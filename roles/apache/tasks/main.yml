---
- name: Load OS-specific Apache variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install Apache
  ansible.builtin.package:
    name: "{{ _apache_package }}"
    state: present

- name: Enable proxy and utility modules (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_modules }}"
  when: ansible_os_family == 'Debian'
  notify: reload apache

- name: Enable SSL module (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_ssl_modules }}"
  when:
    - ansible_os_family == 'Debian'
    - apache_enable_ssl
  notify: reload apache

# RedHat ships mod_proxy / mod_proxy_http / mod_proxy_ajp / mod_headers in the
# base httpd package (auto-loaded via conf.modules.d), but mod_ssl is a separate
# package that is NOT installed by default. Without it, SSLEngine is unknown and
# `apachectl -t` / startup fail. Install it whenever SSL is terminated here.
- name: Install mod_ssl (RedHat)
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - apache_enable_ssl
  notify: reload apache

# ── Disable the distro's stock default vhost ─────────────────────────────────
# On a dedicated OpenSpecimen host the stock default (Debian 000-default.conf /
# default-ssl.conf; RedHat welcome.conf) overlaps the managed OpenSpecimen vhost on
# :80 and can shadow it (or serve the distro "It works" page). Disable it so the
# managed openspecimen[-shared].conf is authoritative. This also cleans up a legacy
# install whose whole config lived in 000-default.conf. Set apache_disable_default_vhost:
# false to leave it alone (e.g. an Apache shared with non-OpenSpecimen apps).
- name: Disable the stock default vhost (Debian)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apache2/sites-enabled/000-default.conf
    - /etc/apache2/sites-enabled/default-ssl.conf
  when:
    - ansible_os_family == 'Debian'
    - apache_disable_default_vhost | default(true) | bool
  notify: reload apache

- name: Disable the stock welcome vhost (RedHat)
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/welcome.conf
    content: "# Disabled by OpenSpecimen Ansible (apache_disable_default_vhost).\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_os_family == 'RedHat'
    - apache_disable_default_vhost | default(true) | bool
  notify: reload apache

# Self-signed cert for internal / test environments with no CA-issued cert.
# Generated only when missing (creates:) so it never churns or forces a reload
# on subsequent runs. Must precede the VirtualHost template task below, whose
# `apachectl -t` validate (and apache startup) load SSLCertificateFile.
- name: Ensure TLS private key directory exists
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Generate self-signed TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout {{ apache_ssl_key_file }}
      -out {{ apache_ssl_cert_file }}
      -days 3650
      -subj "/CN={{ apache_server_name }}"
    creates: "{{ apache_ssl_cert_file }}"
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed
  notify: reload apache

- name: Restrict self-signed key permissions
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Deploy maintenance page and logo
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _apache_webroot }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - downtime.html
    - OS_LOGO_BANNER.png

# ── Domain-mode collision guard (co-located instances) ───────────────────────
# In domain mode each instance owns a full vhost file (apache_vhost_name.conf)
# answering on apache_server_name. Two co-located instances that resolve the SAME
# vhost filename (e.g. a shared openspecimen_service_name) or the SAME ServerName
# silently clobber each other's vhost, or trigger an Apache duplicate-ServerName so
# only the first-loaded vhost serves. ADR-009 deploys one instance per run, so the
# co-tenant is a SEPARATE run - detect the clash by inspecting the host's existing
# OSP-managed vhosts (not _instances) and fail BEFORE overwriting anything.
- name: Domain-mode collision pre-check
  when: apache_routing_mode != 'path'
  block:
    - name: Check whether another OSP vhost already answers on this ServerName
      ansible.builtin.shell: |
        set -o pipefail
        shopt -s nullglob
        for f in {{ _apache_conf_dir }}/*.conf; do
          [ "$(basename "$f")" = "{{ apache_vhost_name }}.conf" ] && continue
          grep -q '# Managed by Ansible' "$f" || continue
          if grep -qE '^[[:space:]]*ServerName[[:space:]]+{{ apache_server_name | regex_escape }}[[:space:]]*$' "$f"; then
            echo "$f"
          fi
        done
      args:
        executable: /bin/bash
      register: _apache_servername_clash
      changed_when: false
      failed_when: false

    - name: Check whether this instance's vhost file is already owned by a different context
      ansible.builtin.shell: |
        set -o pipefail
        f={{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf
        if [ -f "$f" ] && grep -q '# Managed by Ansible' "$f" \
           && ! grep -qE '^[[:space:]]*ProxyPass[[:space:]]+{{ apache_path_prefix | regex_escape }}/[[:space:]]' "$f"; then
          # Report the real context mount (a path ending in '/ '), skipping the
          # '! ' exclusion lines (ProxyPass /downtime.html !) that precede it.
          grep -oE 'ProxyPass[[:space:]]+/[^[:space:]!]+/ ' "$f" | head -1 | awk '{print $2}'
        fi
      args:
        executable: /bin/bash
      register: _apache_vhost_owner_clash
      changed_when: false
      failed_when: false

    - name: Fail fast on a domain-mode ServerName / vhost-file collision
      ansible.builtin.assert:
        quiet: true
        that:
          - _apache_servername_clash.stdout | trim | length == 0
          - _apache_vhost_owner_clash.stdout | trim | length == 0
        fail_msg: |
          Apache domain-mode routing collision for instance '{{ openspecimen_service_name | default('openspecimen') }}':
          {% if _apache_servername_clash.stdout | trim | length > 0 %}
            - ServerName '{{ apache_server_name }}' is already served by another OSP vhost:
              {{ _apache_servername_clash.stdout_lines | join(', ') }}
          {% endif %}
          {% if _apache_vhost_owner_clash.stdout | trim | length > 0 %}
            - vhost file '{{ apache_vhost_name }}.conf' already mounts a different context
              ('{{ _apache_vhost_owner_clash.stdout | trim }}'), i.e. a co-located instance owns it.
          {% endif %}
          Two co-located instances cannot share a ServerName or a vhost filename in domain
          mode. Fix one of:
            - use path mode (apache_routing_mode: path) - co-tenants share one ServerName at
              distinct URL paths (the shared-Tomcat co-tenant model), OR
            - give each instance a DISTINCT hostname (apache_server_name, via
              openspecimen_app_url) AND a distinct apache_vhost_name.

# ── DOMAIN mode (default): one full vhost per instance on its own ServerName ──
- name: Deploy OpenSpecimen VirtualHost config (domain mode)
  ansible.builtin.template:
    src: openspecimen.conf.j2
    dest: "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  # No inline `validate: apache2ctl -t -f %s`: the -f flag makes Apache use ONLY
  # the vhost file as the whole config, so the base config (and the MPM module)
  # is never loaded - `apache2ctl -t -f <vhost>` fails with "No MPM loaded". The
  # full configtest below validates the real config (base + MPM + this vhost)
  # once the site is enabled.
  when: apache_routing_mode != 'path'
  notify: reload apache

- name: Enable site (Debian, domain mode)
  ansible.builtin.file:
    src: "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
    dest: "{{ _apache_conf_link | dirname }}/{{ apache_vhost_name }}.conf"
    state: link
  when:
    - apache_routing_mode != 'path'
    - ansible_os_family == 'Debian'
  notify: reload apache

- name: Remove this instance's path-mode snippet(s) (not in path mode)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  # Both the war_name-keyed name and the legacy apache_vhost_name-keyed name, so an
  # instance that predates the war_name keying is cleaned when it switches to domain.
  loop:
    - "{{ _apache_dropin_dir }}/{{ apache_path_snippet_name }}.conf"
    - "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
  when: apache_routing_mode != 'path'
  notify: reload apache

# ── PATH mode: shared vhost on one ServerName + one Include'd snippet per instance ──
- name: Path mode - render shared vhost and this instance's mount snippet
  when: apache_routing_mode == 'path'
  block:
    - name: Remove this instance's domain-mode vhost (switching to path mode)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
        - "{{ _apache_conf_link | dirname }}/{{ apache_vhost_name }}.conf"
      notify: reload apache

    - name: Create the path-mode drop-in directory
      ansible.builtin.file:
        path: "{{ _apache_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the shared base vhost (instance-agnostic)
      ansible.builtin.template:
        src: openspecimen-shared.conf.j2
        dest: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

    - name: Enable the shared vhost (Debian)
      ansible.builtin.file:
        src: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        dest: "{{ _apache_conf_link | dirname }}/{{ apache_shared_vhost_name }}.conf"
        state: link
      when: ansible_os_family == 'Debian'
      notify: reload apache

    # If this instance previously deployed a snippet under the legacy
    # apache_vhost_name name (before war_name keying), remove it so the shared vhost
    # doesn't Include a stale duplicate mount. No-op when the names already match
    # (every instance whose context segment == service_name).
    - name: Remove stale legacy-named path snippet (pre war_name keying)
      ansible.builtin.file:
        path: "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
        state: absent
      when: apache_vhost_name != apache_path_snippet_name
      notify: reload apache

    - name: Deploy this instance's path mount snippet
      ansible.builtin.template:
        src: openspecimen-path-snippet.conf.j2
        dest: "{{ _apache_dropin_dir }}/{{ apache_path_snippet_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

# Validate the FULL Apache config (base + MPM + the now-enabled vhost) before
# (re)starting. apachectl/apache2ctl source the distro env (APACHE_* vars on
# Debian) and load mods-enabled, unlike `apache2 -t -f`. Fails the deploy on a
# bad vhost without leaving a broken config in a running server.
- name: Validate full Apache configuration
  ansible.builtin.command:
    cmd: "{{ 'apachectl' if ansible_os_family == 'RedHat' else 'apache2ctl' }} -t"
  changed_when: false

- name: Enable and start Apache
  ansible.builtin.systemd:
    name: "{{ _apache_service }}"
    state: started
    enabled: true
    daemon_reload: true
