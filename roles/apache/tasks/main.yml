---
- name: Load OS-specific Apache variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install Apache
  ansible.builtin.package:
    name: "{{ _apache_package }}"
    state: present

- name: Enable proxy and utility modules (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_modules }}"
  when: ansible_os_family == 'Debian'
  notify: reload apache

- name: Enable SSL module (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_ssl_modules }}"
  when:
    - ansible_os_family == 'Debian'
    - apache_enable_ssl
  notify: reload apache

# RedHat ships mod_proxy / mod_proxy_http / mod_proxy_ajp / mod_headers in the
# base httpd package (auto-loaded via conf.modules.d), but mod_ssl is a separate
# package that is NOT installed by default. Without it, SSLEngine is unknown and
# `apachectl -t` / startup fail. Install it whenever SSL is terminated here.
- name: Install mod_ssl (RedHat)
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - apache_enable_ssl
  notify: reload apache

# Self-signed cert for internal / test environments with no CA-issued cert.
# Generated only when missing (creates:) so it never churns or forces a reload
# on subsequent runs. Must precede the VirtualHost template task below, whose
# `apachectl -t` validate (and apache startup) load SSLCertificateFile.
- name: Ensure TLS private key directory exists
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Generate self-signed TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout {{ apache_ssl_key_file }}
      -out {{ apache_ssl_cert_file }}
      -days 3650
      -subj "/CN={{ apache_server_name }}"
    creates: "{{ apache_ssl_cert_file }}"
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed
  notify: reload apache

- name: Restrict self-signed key permissions
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Deploy maintenance page and logo
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _apache_webroot }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - downtime.html
    - OS_LOGO_BANNER.png

# ── DOMAIN mode (default): one full vhost per instance on its own ServerName ──
- name: Deploy OpenSpecimen VirtualHost config (domain mode)
  ansible.builtin.template:
    src: openspecimen.conf.j2
    dest: "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  # No inline `validate: apache2ctl -t -f %s`: the -f flag makes Apache use ONLY
  # the vhost file as the whole config, so the base config (and the MPM module)
  # is never loaded - `apache2ctl -t -f <vhost>` fails with "No MPM loaded". The
  # full configtest below validates the real config (base + MPM + this vhost)
  # once the site is enabled.
  when: apache_routing_mode != 'path'
  notify: reload apache

- name: Enable site (Debian, domain mode)
  ansible.builtin.file:
    src: "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
    dest: "{{ _apache_conf_link | dirname }}/{{ apache_vhost_name }}.conf"
    state: link
  when:
    - apache_routing_mode != 'path'
    - ansible_os_family == 'Debian'
  notify: reload apache

- name: Remove this instance's path-mode snippet (not in path mode)
  ansible.builtin.file:
    path: "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
    state: absent
  when: apache_routing_mode != 'path'
  notify: reload apache

# ── PATH mode: shared vhost on one ServerName + one Include'd snippet per instance ──
- name: Path mode - render shared vhost and this instance's mount snippet
  when: apache_routing_mode == 'path'
  block:
    - name: Remove this instance's domain-mode vhost (switching to path mode)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
        - "{{ _apache_conf_link | dirname }}/{{ apache_vhost_name }}.conf"
      notify: reload apache

    - name: Create the path-mode drop-in directory
      ansible.builtin.file:
        path: "{{ _apache_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the shared base vhost (instance-agnostic)
      ansible.builtin.template:
        src: openspecimen-shared.conf.j2
        dest: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

    - name: Enable the shared vhost (Debian)
      ansible.builtin.file:
        src: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        dest: "{{ _apache_conf_link | dirname }}/{{ apache_shared_vhost_name }}.conf"
        state: link
      when: ansible_os_family == 'Debian'
      notify: reload apache

    - name: Deploy this instance's path mount snippet
      ansible.builtin.template:
        src: openspecimen-path-snippet.conf.j2
        dest: "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

# Validate the FULL Apache config (base + MPM + the now-enabled vhost) before
# (re)starting. apachectl/apache2ctl source the distro env (APACHE_* vars on
# Debian) and load mods-enabled, unlike `apache2 -t -f`. Fails the deploy on a
# bad vhost without leaving a broken config in a running server.
- name: Validate full Apache configuration
  ansible.builtin.command:
    cmd: "{{ 'apachectl' if ansible_os_family == 'RedHat' else 'apache2ctl' }} -t"
  changed_when: false

- name: Enable and start Apache
  ansible.builtin.systemd:
    name: "{{ _apache_service }}"
    state: started
    enabled: true
    daemon_reload: true
