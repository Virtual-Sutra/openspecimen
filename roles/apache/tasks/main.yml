---
- name: Load OS-specific Apache variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install Apache
  ansible.builtin.package:
    name: "{{ _apache_package }}"
    state: present

- name: Enable proxy and utility modules (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_modules }}"
  when: ansible_os_family == 'Debian'
  notify: reload apache

- name: Enable SSL module (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ _apache_ssl_modules }}"
  when:
    - ansible_os_family == 'Debian'
    - apache_enable_ssl
  notify: reload apache

# RedHat ships mod_proxy / mod_proxy_http / mod_proxy_ajp / mod_headers in the
# base httpd package (auto-loaded via conf.modules.d), but mod_ssl is a separate
# package that is NOT installed by default. Without it, SSLEngine is unknown and
# `apachectl -t` / startup fail. Install it whenever SSL is terminated here.
- name: Install mod_ssl (RedHat)
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - apache_enable_ssl
  notify: reload apache

# Self-signed cert for internal / test environments with no CA-issued cert.
# Generated only when missing (creates:) so it never churns or forces a reload
# on subsequent runs. Must precede the VirtualHost template task below, whose
# `apachectl -t` validate (and apache startup) load SSLCertificateFile.
- name: Ensure TLS private key directory exists
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Generate self-signed TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout {{ apache_ssl_key_file }}
      -out {{ apache_ssl_cert_file }}
      -days 3650
      -subj "/CN={{ apache_server_name }}"
    creates: "{{ apache_ssl_cert_file }}"
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed
  notify: reload apache

- name: Restrict self-signed key permissions
  ansible.builtin.file:
    path: "{{ apache_ssl_key_file }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - apache_enable_ssl
    - apache_ssl_self_signed

- name: Deploy maintenance page and logo
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _apache_webroot }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - downtime.html
    - OS_LOGO_BANNER.png

# ── Domain-mode collision guard (co-located instances) ───────────────────────
# In domain mode every instance writes its full vhost as a marker-delimited blockinfile
# block INTO the one managed default conf ({{ _apache_default_conf }}), keyed by instance
# name. Distinct instances can't clobber each other's block (distinct markers), but two
# co-located instances declaring the SAME ServerName still trigger an Apache
# duplicate-ServerName so only the first-loaded vhost serves. ADR-009 deploys one instance
# per run, so the co-tenant is a SEPARATE run - inspect the OTHER instances' blocks already
# in the file and fail BEFORE injecting this one.
- name: Domain-mode collision pre-check
  when: apache_routing_mode != 'path'
  block:
    - name: Check whether another instance's vhost block already answers on this ServerName
      ansible.builtin.shell: |
        set -o pipefail
        f={{ _apache_default_conf }}
        [ -f "$f" ] || exit 0
        # Drop THIS instance's own block, then look for a matching ServerName in any
        # OTHER instance's block (a duplicate ServerName across co-located instances).
        awk '/^# BEGIN OpenSpecimen {{ openspecimen_instance_name | default('openspecimen') }}$/{skip=1}
             !skip
             /^# END OpenSpecimen {{ openspecimen_instance_name | default('openspecimen') }}$/{skip=0}' "$f" \
          | grep -E '^[[:space:]]*ServerName[[:space:]]+{{ apache_server_name | regex_escape }}[[:space:]]*$'
      args:
        executable: /bin/bash
      register: _apache_servername_clash
      changed_when: false
      failed_when: false
      check_mode: false   # shell is skipped in --check; run it so the assert below has .stdout

    - name: Fail fast on a domain-mode ServerName collision
      ansible.builtin.assert:
        quiet: true
        that:
          - _apache_servername_clash.stdout | trim | length == 0
        fail_msg: |
          Apache domain-mode routing collision for instance
          '{{ openspecimen_instance_name | default('openspecimen') }}':
            - ServerName '{{ apache_server_name }}' is already served by another OpenSpecimen
              instance's vhost block in {{ _apache_default_conf }}.
          Two co-located instances cannot share a ServerName in domain mode. Fix one of:
            - use path mode (apache_routing_mode: path) - co-tenants share one ServerName at
              distinct URL paths (the shared-Tomcat co-tenant model), OR
            - give each instance a DISTINCT hostname (apache_server_name, via
              openspecimen_app_url).

# ── DOMAIN mode (default): one marked vhost block per instance in the managed default conf ──
# Each instance's full vhost (redirect + SSL/proxy) is written as a blockinfile block INTO
# {{ _apache_default_conf }} (Debian: the stock, already-enabled 000-default.conf; RedHat: a
# managed conf.d/openspecimen.conf). Co-located instances each own a marker-delimited block
# in the same file - no per-instance file or sites-enabled symlink.
- name: Neutralise the stock welcome vhost (RedHat, domain mode)
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/welcome.conf
    content: "# Disabled by OpenSpecimen Ansible\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - apache_routing_mode != 'path'
    - ansible_os_family == 'RedHat'
  notify: reload apache

# First-management reset: when the default conf has NO OpenSpecimen block yet, overwrite it
# once with a managed header so the stock :80 vhost can't overlap the block we add next.
# Co-located second deploys already see a marker and skip this (blockinfile then just
# adds/updates their own block). NOTE: OpenSpecimen OWNS this file in domain mode - the
# reset replaces WHATEVER is there (fine on a dedicated host, which is the norm). If this
# Apache also serves a non-OpenSpecimen site out of the default conf, set apache_managed:
# false for the OpenSpecimen deploy so Ansible leaves Apache alone.
- name: Check whether the default conf is already OpenSpecimen-managed (domain mode)
  ansible.builtin.command:
    cmd: "grep -qs '# BEGIN OpenSpecimen ' {{ _apache_default_conf }}"
  register: _apache_default_managed
  changed_when: false
  failed_when: false
  check_mode: false
  when: apache_routing_mode != 'path'

- name: Reset the stock default conf to a managed header on first management (domain mode)
  ansible.builtin.copy:
    dest: "{{ _apache_default_conf }}"
    content: "# Managed by OpenSpecimen Ansible. Per-instance vhosts are blockinfile blocks below.\n"
    owner: root
    group: root
    mode: '0644'
  when:
    - apache_routing_mode != 'path'
    - _apache_default_managed.rc | default(1) != 0
  notify: reload apache

- name: "Write this instance's domain vhost block into {{ _apache_default_conf }}"
  ansible.builtin.blockinfile:
    path: "{{ _apache_default_conf }}"
    marker: "# {mark} OpenSpecimen {{ openspecimen_instance_name | default('openspecimen') }}"
    block: "{{ lookup('ansible.builtin.template', 'openspecimen.conf.j2') }}"
    create: true
    owner: root
    group: root
    mode: '0644'
  when: apache_routing_mode != 'path'
  notify: reload apache

# The managed conf loads via the stock sites-enabled/000-default.conf symlink - but a
# host previously managed by OpenSpecimen (older release / #157) had that symlink
# removed. Re-create it so the block we just wrote is actually included (else Apache
# passes configtest but serves nothing on :80 - a silent outage on upgrade).
- name: "Ensure the managed default vhost is enabled (Debian, domain mode)"
  ansible.builtin.file:
    src: "{{ _apache_default_conf }}"
    dest: /etc/apache2/sites-enabled/000-default.conf
    state: link
  when:
    - apache_routing_mode != 'path'
    - ansible_os_family == 'Debian'
  notify: reload apache

- name: "Remove the obsolete standalone domain vhost file (migrated into {{ _apache_default_conf }})"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
    - "/etc/apache2/sites-enabled/{{ apache_vhost_name }}.conf"
  when:
    - apache_routing_mode != 'path'
    # Never delete the managed default conf itself (on RedHat the default instance's
    # standalone name resolves to conf.d/openspecimen.conf == _apache_default_conf).
    - item != _apache_default_conf
  notify: reload apache

- name: Remove this instance's path-mode snippet(s) (not in path mode)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  # Both the war_name-keyed name and the legacy apache_vhost_name-keyed name, so an
  # instance that predates the war_name keying is cleaned when it switches to domain.
  loop:
    - "{{ _apache_dropin_dir }}/{{ apache_path_snippet_name }}.conf"
    - "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
  when: apache_routing_mode != 'path'
  notify: reload apache

# ── PATH mode: shared vhost on one ServerName + one Include'd snippet per instance ──
- name: Path mode - render shared vhost and this instance's mount snippet
  when: apache_routing_mode == 'path'
  block:
    - name: Remove this instance's domain-mode vhost (switching to path mode)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _apache_conf_dir }}/{{ apache_vhost_name }}.conf"
        - "{{ _apache_conf_link | dirname }}/{{ apache_vhost_name }}.conf"
      notify: reload apache

    # Domain vhosts now live as blockinfile blocks inside _apache_default_conf, so also
    # drop this instance's block when it switches domain -> path (else its stale vhost
    # keeps answering on the same ServerName as the new shared vhost).
    - name: Remove this instance's domain-mode block from the default conf (switching to path)
      ansible.builtin.blockinfile:
        path: "{{ _apache_default_conf }}"
        marker: "# {mark} OpenSpecimen {{ openspecimen_instance_name | default('openspecimen') }}"
        state: absent
      failed_when: false
      notify: reload apache

    - name: Create the path-mode drop-in directory
      ansible.builtin.file:
        path: "{{ _apache_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the shared base vhost (instance-agnostic)
      ansible.builtin.template:
        src: openspecimen-shared.conf.j2
        dest: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

    - name: Enable the shared vhost (Debian)
      ansible.builtin.file:
        src: "{{ _apache_conf_dir }}/{{ apache_shared_vhost_name }}.conf"
        dest: "{{ _apache_conf_link | dirname }}/{{ apache_shared_vhost_name }}.conf"
        state: link
      when: ansible_os_family == 'Debian'
      notify: reload apache

    # If this instance previously deployed a snippet under the legacy
    # apache_vhost_name name (before war_name keying), remove it so the shared vhost
    # doesn't Include a stale duplicate mount. No-op when the names already match
    # (every instance whose context segment == service_name).
    - name: Remove stale legacy-named path snippet (pre war_name keying)
      ansible.builtin.file:
        path: "{{ _apache_dropin_dir }}/{{ apache_vhost_name }}.conf"
        state: absent
      when: apache_vhost_name != apache_path_snippet_name
      notify: reload apache

    - name: Deploy this instance's path mount snippet
      ansible.builtin.template:
        src: openspecimen-path-snippet.conf.j2
        dest: "{{ _apache_dropin_dir }}/{{ apache_path_snippet_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload apache

# Validate the FULL Apache config (base + MPM + the now-enabled vhost) before
# (re)starting. apachectl/apache2ctl source the distro env (APACHE_* vars on
# Debian) and load mods-enabled, unlike `apache2 -t -f`. Fails the deploy on a
# bad vhost without leaving a broken config in a running server.
- name: Validate full Apache configuration
  ansible.builtin.command:
    cmd: "{{ 'apachectl' if ansible_os_family == 'RedHat' else 'apache2ctl' }} -t"
  changed_when: false

- name: Enable and start Apache
  ansible.builtin.systemd:
    name: "{{ _apache_service }}"
    state: started
    enabled: true
    daemon_reload: true
