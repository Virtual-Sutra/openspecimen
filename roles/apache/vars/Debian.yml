---
_apache_package:  apache2
_apache_service:  apache2
_apache_conf_dir: /etc/apache2/sites-available
_apache_conf_link: /etc/apache2/sites-enabled/openspecimen.conf
# Domain mode: the stock default vhost file we write per-instance vhost blocks into.
# Enabled by the stock sites-enabled/000-default.conf symlink, so it stays authoritative
# on :80 without a separate per-instance file/symlink.
_apache_default_conf: /etc/apache2/sites-available/000-default.conf
_apache_log_dir:  /var/log/apache2
_apache_webroot:  /var/www/html
_apache_modules:  [proxy, proxy_http, proxy_ajp, headers, expires]
_apache_ssl_modules: [ssl]
# path mode: per-instance proxy snippets Include'd by the shared vhost. NOT under
# sites-enabled/ - only the shared vhost pulls them in (inside its <VirtualHost>).
_apache_dropin_dir: /etc/apache2/openspecimen.d
