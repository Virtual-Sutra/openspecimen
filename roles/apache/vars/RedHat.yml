---
_apache_package:  httpd
_apache_service:  httpd
_apache_conf_dir: /etc/httpd/conf.d
_apache_conf_link: ""
# Domain mode: RedHat has no 000-default equivalent - conf.d/*.conf auto-loads at the
# top level, so we write per-instance vhost blocks into this managed file. The stock
# welcome.conf is neutralised (domain block, RedHat-only) so it can't overlap on :80.
_apache_default_conf: /etc/httpd/conf.d/openspecimen.conf
_apache_log_dir:  /var/log/httpd
_apache_webroot:  /var/www/html
# RedHat httpd auto-loads mod_proxy / mod_proxy_http / mod_proxy_ajp / mod_headers
# / mod_expires from conf.modules.d, so there is no per-module enable step (unlike
# Debian's a2enmod). mod_ssl is the exception - a separate package installed by the
# "Install mod_ssl (RedHat)" task in tasks/main.yml when apache_enable_ssl is set.
_apache_modules:  []
_apache_ssl_modules: []
# path mode: per-instance proxy snippets Include'd by the shared vhost. Deliberately
# OUTSIDE conf.d/ (which httpd auto-includes at the top level) so the snippets load
# ONLY inside the shared <VirtualHost>, not as stray server-level directives.
_apache_dropin_dir: /etc/httpd/openspecimen.d
