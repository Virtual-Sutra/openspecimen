---
apache_http_port:   80
apache_https_port:  443

# Per-instance vhost file name (sites-available/<name>.conf + sites-enabled link on
# Debian, conf.d/<name>.conf on RedHat). Defaults to the instance's service name,
# so the single default instance keeps openspecimen.conf and named instances get
# openspecimen-<name>.conf - each instance owns its own vhost.
apache_vhost_name: "{{ openspecimen_service_name | default('openspecimen') }}"

# Path-mode: the per-instance mount snippet filename in the shared drop-in dir.
# Keyed to the WAR/context name (UNIQUE per co-tenant) - NOT apache_vhost_name.
# Co-located instances sharing one Tomcat share openspecimen_service_name (hence
# apache_vhost_name), so keying the snippet on apache_vhost_name would make two
# co-tenants (e.g. /test and /test1 as service 'osshared') overwrite each other's
# snippet - deploying one drops the other's proxy mount. war_name is distinct.
apache_path_snippet_name: "{{ openspecimen_war_name | default(apache_vhost_name) }}"

# Enable the Apache reverse-proxy front-end. Defaults on when openspecimen_app_url
# is set (public hostname → fronted; bare Tomcat/ALB → not). Override via -e.
apache_enabled: "{{ (openspecimen_app_url | default('') | trim | length) > 0 }}"

# VirtualHost ServerName - derived from openspecimen_app_url (scheme and path
# stripped) when set, else the host's own FQDN. Same derivation the openspecimen
# role uses for its external-reachability check.
apache_server_name: >-
  {{ (openspecimen_app_url | regex_replace('^https?://', '') | regex_replace('/.*$', ''))
     if (openspecimen_app_url | default('') | trim | length) > 0
     else (ansible_fqdn | default(ansible_hostname)) }}

# Proxy protocol to the local Tomcat: 'http' (default, no AJP exposure) or 'ajp'
# (matches operator samples; the tomcat role binds AJP to 127.0.0.1, so it's never
# reachable off-box - Ghostcat CVE-2020-1938 mitigation).
apache_proxy_protocol: http
# Explicit AJP backend port override. Normally leave unset - the backend below
# proxies to THIS instance's Tomcat AJP port (openspecimen_ajp_port) so each
# instance reaches its own Tomcat.
apache_ajp_port: 8009

# Set to true to terminate SSL at Apache. Requires the two cert vars below.
apache_enable_ssl:    false
apache_ssl_cert_file: ""
apache_ssl_key_file:  ""

# Generate a self-signed cert at the paths above when SSL is enabled and the
# cert is absent - for internal/test environments without a CA-issued cert
# (browsers will warn on the untrusted cert). Set the cert/key paths when true.
apache_ssl_self_signed: false

# ── Multi-instance public routing (ADR-007) ───────────────────────────────────
# How co-located instances are exposed behind Apache. BOTH modes mount each instance at
# its context path (apache_path_prefix) and proxy 1:1 - so app.url is identical either
# way and switching modes needs no app change. The modes differ only in the axis that
# distinguishes instances:
#   domain - each instance answers on its OWN ServerName (apache_server_name); the path
#            (context) is common across the domains. e.g.
#            https://prod.example.com/openspecimen + https://test.example.com/openspecimen
#            One full vhost per instance. (default)
#   path   - instances SHARE one ServerName (apache_shared_server_name); each is mounted
#            at its OWN path (context). e.g.
#            https://example.com/openspecimen (prod) + https://example.com/openspecimen-test
#            Rendered as a shared base vhost that Includes one drop-in proxy snippet per
#            instance, so each single-instance deploy manages only its own path snippet.
apache_routing_mode: domain

# path mode: the shared ServerName every path-mounted instance answers on. Defaults to
# apache_server_name, so all co-located instances must resolve the same public host.
apache_shared_server_name: "{{ apache_server_name }}"

# The URL path this instance mounts at (both modes). Defaults to its context_path so the
# proxy is 1:1; set app.url to <scheme>://<host>{{ '<context_path>' }}.
apache_path_prefix: "{{ openspecimen_context_path | default('/openspecimen') }}"

# DOMAIN mode only: serve the app at the domain ROOT ('/') and HIDE the Tomcat context,
# instead of exposing it in the URL. true → the vhost proxies '/' to the Tomcat context
# (apache_path_prefix) and rewrites the session cookie path back to '/', so the public
# URL is a clean https://<host>/ (set openspecimen_app_url to the bare host, no path).
# A root-mount monopolises the ServerName, so it is invalid in path mode (a fail-fast in
# tasks/main.yml enforces this).
#
# DEFAULT: true in domain mode (an instance on its OWN hostname is normally served at
# that host's root), false in path mode (co-tenants under one host need distinct paths).
# A domain instance that must keep the context in the URL sets apache_mount_at_root: false.
apache_mount_at_root: "{{ (apache_routing_mode | default('domain')) == 'domain' }}"

# Backend base (no context suffix) - AJP/HTTP to THIS instance's Tomcat port. The mount
# appends apache_path_prefix so the proxy is 1:1 to the same Tomcat context.
# openspecimen_ajp_port / openspecimen_port are shimmed per instance; apache_ajp_port is
# an optional explicit override of the AJP port only.
apache_path_backend: >-
  {{ ('ajp://127.0.0.1:' ~ (openspecimen_ajp_port | default(apache_ajp_port)))
     if apache_proxy_protocol == 'ajp'
     else ('http://localhost:' ~ openspecimen_port) }}

# path mode: fixed vhost name for the shared base vhost (one per host, instance-agnostic).
apache_shared_vhost_name: openspecimen-shared

# Add defensive response headers (incl. HSTS when SSL is terminated here).
apache_security_headers: true
