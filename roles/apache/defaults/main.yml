---
apache_http_port:   80
apache_https_port:  443

# Per-instance vhost file name (sites-available/<name>.conf + sites-enabled link on
# Debian, conf.d/<name>.conf on RedHat). Defaults to the instance's service name,
# so the single default instance keeps openspecimen.conf and named instances get
# openspecimen-<name>.conf - each instance owns its own vhost.
apache_vhost_name: "{{ openspecimen_service_name | default('openspecimen') }}"

# Enable the Apache reverse-proxy front-end. Defaults on when openspecimen_app_url
# is set (public hostname → fronted; bare Tomcat/ALB → not). Override via -e.
apache_enabled: "{{ (openspecimen_app_url | default('') | trim | length) > 0 }}"

# VirtualHost ServerName - derived from openspecimen_app_url (scheme and path
# stripped) when set, else the host's own FQDN. Same derivation the openspecimen
# role uses for its external-reachability check.
apache_server_name: >-
  {{ (openspecimen_app_url | regex_replace('^https?://', '') | regex_replace('/.*$', ''))
     if (openspecimen_app_url | default('') | trim | length) > 0
     else (ansible_fqdn | default(ansible_hostname)) }}

# Proxy protocol to the local Tomcat: 'http' (default, no AJP exposure) or 'ajp'
# (matches operator samples; the tomcat role binds AJP to 127.0.0.1, so it's never
# reachable off-box - Ghostcat CVE-2020-1938 mitigation).
apache_proxy_protocol: http
# Explicit AJP backend port override. Normally leave unset - the backend below
# proxies to THIS instance's Tomcat AJP port (openspecimen_ajp_port) so each
# instance reaches its own Tomcat.
apache_ajp_port: 8009

# Set to true to terminate SSL at Apache. Requires the two cert vars below.
apache_enable_ssl:    false
apache_ssl_cert_file: ""
apache_ssl_key_file:  ""

# Generate a self-signed cert at the paths above when SSL is enabled and the
# cert is absent - for internal/test environments without a CA-issued cert
# (browsers will warn on the untrusted cert). Set the cert/key paths when true.
apache_ssl_self_signed: false

# Proxy backend URL - per instance: AJP/HTTP to THIS instance's Tomcat port.
# openspecimen_ajp_port / openspecimen_port are shimmed per instance; apache_ajp_port
# is an optional explicit override of the AJP port only.
apache_proxy_backend: >-
  {{ ('ajp://127.0.0.1:' ~ (openspecimen_ajp_port | default(apache_ajp_port)) ~ '/openspecimen/')
     if apache_proxy_protocol == 'ajp'
     else ('http://localhost:' ~ openspecimen_port ~ '/openspecimen/') }}

# Add defensive response headers (incl. HSTS when SSL is terminated here).
apache_security_headers: true
