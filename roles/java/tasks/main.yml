---
# Per-instance JDK. Run once per instance from tasks/deploy-instance.yml with that
# instance's os_versions (its release's component spec). _java_track/_java_package/
# _java_home derive from os_versions.java.track, so two instances can install (and
# run on) different JDK majors side by side; the JDKs coexist at the OS level and
# each instance selects its own via openspecimen_java_home (setenv.sh + systemd unit).
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# Expose THIS instance's JDK home so the tomcat role's setenv.sh / systemd unit
# pin JAVA_HOME per instance (not the shared /etc/environment value).
- name: Expose this instance's JAVA_HOME
  ansible.builtin.set_fact:
    openspecimen_java_home: "{{ _java_home }}"

- name: "Install OpenJDK {{ _java_track }}"
  ansible.builtin.package:
    name: "{{ _java_package }}"
    state: present

# Standardised on the OS OpenJDK package for the spec's major track (not an exact
# patch pin - apt carries one patch per major). Capture the ACTUAL installed build so
# the deploy record + discover reflect what is really running.
- name: Capture the installed JDK build
  ansible.builtin.shell: |
    "$OS_JAVA_HOME/bin/java" -version 2>&1 | awk -F'"' '/version/ {print $2; exit}'
  environment:
    OS_JAVA_HOME: "{{ _java_home }}"
  register: _java_build
  changed_when: false

- name: Record the installed JDK build (major track {{ _java_track }})
  ansible.builtin.set_fact:
    openspecimen_java_build: "{{ _java_build.stdout | trim }}"

- name: Show the installed JDK
  ansible.builtin.debug:
    msg: "OpenJDK {{ _java_track }} (OS package {{ _java_package }}) → build {{ openspecimen_java_build | default('unknown') }}"

# Host-wide default for interactive shells / tooling. With multiple instances this
# holds the last-deployed instance's JDK; each instance's Tomcat overrides it with
# its own JAVA_HOME in the unit/setenv, so this is only a convenience default.
- name: Set JAVA_HOME in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^JAVA_HOME='
    line: "JAVA_HOME={{ _java_home }}"
    create: true
    mode: '0644'
