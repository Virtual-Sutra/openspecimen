---
- name: Fail if openspecimen_release is not set
  ansible.builtin.fail:
    msg: >-
      openspecimen_release is not set for {{ inventory_hostname }}.
      Pass it at run time: -e openspecimen_release=<name>
  when: not openspecimen_release | default('') | trim

- name: Check prior OpenSpecimen version
  ansible.builtin.slurp:
    src: "{{ openspecimen_release_marker }}"
  register: _release_marker
  failed_when: false

- name: Set prior version fact
  ansible.builtin.set_fact:
    _installed_release: "{{ (_release_marker.content | b64decode | trim) if _release_marker.content is defined else '' }}"
    _version_check_done: true

- name: Show version transition
  ansible.builtin.debug:
    msg: >-
      {% if _installed_release %}
      Prior version: {{ _installed_release }} - Requesting: {{ openspecimen_release }}
      {% else %}
      No prior version recorded - Requesting: {{ openspecimen_release }}
      {% endif %}

# Downgrade is NOT blocked here. Direction is detected once, earlier, by
# roles/openspecimen/tasks/direction.yml (the first pre_task in site.yml): a
# requested release older than the installed one triggers the backup-restore
# rollback flow (roles/openspecimen/tasks/rollback.yml) and ends the play
# before this base role runs. Rollback restores the prior deploy backup
# end-to-end (WAR + config + plugins + DB), so schema drift is never a concern.
# A second, contradictory "downgrade not supported" hard-stop used to live here
# (dead code, since direction.yml already ended the play) and has been removed.
# See ADR-004.
