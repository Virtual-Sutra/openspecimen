---
# JVM heap auto-sized at deploy: max(2048 MB, 50% of RAM). OpenSpecimen exits at
# startup if Xmx < 2 GB. Override per customer with tomcat_heap_max_override /
# tomcat_heap_min_override (integer MB).

tomcat_heap_max: >-
  {{ (tomcat_heap_max_override
      | default([2048, (ansible_facts['memtotal_mb'] * 0.5) | int] | max)
      | int) | string }}m

tomcat_heap_min: >-
  {{ (tomcat_heap_min_override | default(512) | int) | string }}m

# ── Tomcat install source (#91) ───────────────────────────────────────────────
# Binaries from a pinned Apache download (Tomcat 9 isn't packaged on Ubuntu 24.04 /
# RHEL 9); conf + connectors from the release zip. Version = component spec (#90).
tomcat_version: "{{ os_versions.tomcat | default('9.0.59') }}"
tomcat_major: "{{ tomcat_version.split('.')[0] }}"
tomcat_tarball: "apache-tomcat-{{ tomcat_version }}.tar.gz"
tomcat_download_url: >-
  https://archive.apache.org/dist/tomcat/tomcat-{{ tomcat_major }}/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz
# Verify the download against Apache's published checksum alongside the tarball.
# For an air-gapped mirror, override tomcat_download_url and set a literal
# "sha512:<hash>" (or "sha256:<hash>") here.
tomcat_download_checksum: "sha512:{{ tomcat_download_url }}.sha512"

# Download resilience: archive.apache.org is slow for archived versions, so the
# fetch uses a generous read timeout and retries. Override for a fast local mirror.
tomcat_download_timeout: 60   # seconds per attempt
tomcat_download_retries: 5
tomcat_download_delay:   10    # seconds between retries
