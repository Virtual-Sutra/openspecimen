---
# Per-instance Tomcat runtime (#73). One shared Tomcat binary (CATALINA_HOME =
# tomcat_home, installed host-level by this role's main.yml) serves every
# instance; each instance gets its own CATALINA_BASE with its own conf/ (ports,
# datasource), logs/, temp/, work/, webapps/, and bin/setenv.sh, plus its own
# systemd unit. Included PER INSTANCE from tasks/deploy-instance.yml, after the
# host-level tomcat role and before the openspecimen role (the WAR extracts into
# CATALINA_BASE/webapps). _instance + the shimmed flat vars (catalina_base,
# openspecimen_service_name, openspecimen_port/_ajp_port/_shutdown_port,
# openspecimen_data_dir, mysql_db_*) are in scope from the loop.
#
# For the single default instance catalina_base == catalina_home == tomcat_home,
# so the conf-seed is skipped and every templated dest resolves to the shared
# Tomcat - behaviour is identical to the pre-#73 host-level setup.

- name: "[tomcat:{{ openspecimen_service_name }}] Create CATALINA_BASE tree"
  ansible.builtin.file:
    path: "{{ catalina_base }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'
  loop: [conf, logs, temp, work, webapps, bin]

# The stock Apache Tomcat tarball ships sample webapps (ROOT, docs, examples,
# host-manager, manager) that OpenSpecimen never serves. Remove them from THIS
# instance's served webapps/ on EVERY deploy - not only when the Tomcat binary is
# (re)installed - so a co-tenant on an already-installed shared Tomcat (e.g. test1
# deploying onto the Tomcat test installed) also clears any leftover stock apps. Runs
# before the openspecimen role copies the WAR. Removal is BY NAME (the fixed stock
# set), never a wildcard, and skips the instance's own war_name, so no instance WAR is
# ever touched: openspecimen.war, or a co-tenant's test.war/test1.war and its exploded
# dir on a shared Tomcat, all survive.
- name: "[tomcat:{{ openspecimen_service_name }}] Remove stock Tomcat sample webapps (keep instance WARs)"
  ansible.builtin.file:
    path: "{{ catalina_base }}/webapps/{{ item }}"
    state: absent
  loop:
    - ROOT
    - ROOT.war
    - docs
    - docs.war
    - examples
    - examples.war
    - host-manager
    - host-manager.war
    - manager
    - manager.war
  when: (item | regex_replace('\.war$', '')) != (openspecimen_war_name | default(''))
  notify: restart openspecimen

# Seed conf/ from the golden CATALINA_HOME/conf (the #91 zip overlay) for extra
# instances. `cp -an` (archive, no-clobber) never overwrites an already
# port-patched server.xml on re-runs. `creates:` makes it idempotent. Skipped for
# the default instance (base == home: its conf IS the golden conf).
- name: "[tomcat:{{ openspecimen_service_name }}] Seed conf from CATALINA_HOME"
  ansible.builtin.command:
    cmd: "cp -an {{ catalina_home }}/conf/. {{ catalina_base }}/conf/"
    creates: "{{ catalina_base }}/conf/catalina.properties"
  when: catalina_base != catalina_home

- name: "[tomcat:{{ openspecimen_service_name }}] Own seeded conf (cp ran as root)"
  ansible.builtin.file:
    path: "{{ catalina_base }}/conf"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    recurse: true
  when: catalina_base != catalina_home

# _reuse_existing_config (db_managed=false with existing on-host config, see site.yml):
# the tomcat runtime config (server.xml ports/AJP + setenv.sh) is left as-is, so the
# four server.xml patches and the setenv.sh render below are skipped. A db_managed=false
# FRESH host is NOT reuse - it renders everything from inventory. REVISIT: on a default
# (base==home) instance a Tomcat *version change* re-unpacks the stock server.xml and it
# will NOT be re-patched (the reuse safety-net catches a lost datasource); re-onboard.
#
# Set this instance's HTTP / AJP / shutdown ports in its own server.xml. The
# golden conf ships stock 8080/8009/8005; for the default instance these match
# (changed=0). A co-located 2nd customer sets its own ports explicitly (ADR-009).
# Shared Tomcat has ONE set of connectors, so every co-tenant MUST declare identical
# ports. A run only sees one customer folder (ADR-009), so we can't compare folders;
# instead inspect the host: if a co-tenant is ALREADY deployed (its WAR is in the shared
# webapps/) and the live server.xml HTTP port differs from this folder's, the two would
# flip-flop the shared server.xml on every deploy (and collide at runtime). Fail fast.
# Gated on a co-tenant actually existing - not on the stock port - so a first co-tenant
# on a freshly-seeded (stock 8080) conf still claims its port, and a solo app freely
# changes its own port (its own WAR is excluded from the co-tenant set).
- name: "[tomcat:{{ openspecimen_service_name }}] Guard - co-tenant port conflict on shared server.xml"
  when:
    - openspecimen_shared_tomcat | default(false) | bool
    - not (_reuse_existing_config | default(false))
  block:
    - name: "[tomcat:{{ openspecimen_service_name }}] Read current HTTP connector port"
      ansible.builtin.shell: |
        python3 -c "
        import re
        try:
            c = open('{{ catalina_base }}/conf/server.xml').read()
        except Exception:
            print(''); raise SystemExit
        m = re.search(r'<Connector\b[^>]*?protocol=\"HTTP/1\.1\"[^>]*?/>', c, re.DOTALL)
        p = re.search(r'\bport=\"(\d+)\"', m.group(0)) if m else None
        print(p.group(1) if p else '')
        "
      args:
        executable: /bin/bash
      register: _cur_http_port
      changed_when: false
      failed_when: false

    - name: "[tomcat:{{ openspecimen_service_name }}] Probe shared webapps for an already-deployed co-tenant"
      ansible.builtin.find:
        paths: "{{ catalina_base }}/webapps"
        patterns: "*.war"
        file_type: file
      register: _cotenant_war_scan
      changed_when: false

    - name: "[tomcat:{{ openspecimen_service_name }}] Fail on co-tenant port mismatch"
      ansible.builtin.fail:
        msg: |
          ✗ Shared-Tomcat port conflict on {{ catalina_base }}/conf/server.xml
              live HTTP port : {{ _cur_http_port.stdout | trim }}
              this folder    : {{ openspecimen_port }}
              co-tenant WARs : {{ _other_wars | join(', ') }}

          A shared Tomcat has ONE HTTP connector, so every co-tenant customer folder MUST
          set identical openspecimen_port / openspecimen_ajp_port / openspecimen_shutdown_port.
          Align this folder's ports with the co-tenant's (or vice versa) and redeploy.
      vars:
        # Existing app WARs excluding this app (its own re-deploy) and stock Tomcat webapps.
        _other_wars: >-
          {{ (_cotenant_war_scan.files | map(attribute='path') | map('basename')
              | map('regex_replace', '\.war$', '') | list)
              | difference([openspecimen_war_name, 'ROOT', 'manager', 'host-manager', 'docs', 'examples']) }}
      when:
        - _cur_http_port.stdout | trim | length > 0
        - _other_wars | length > 0
        - _cur_http_port.stdout | trim != (openspecimen_port | string)

- name: "[tomcat:{{ openspecimen_service_name }}] Set HTTP/AJP/shutdown ports in server.xml"
  # Match each connector block by protocol (any attribute order) then set its own
  # port - stock Tomcat 9 ships the AJP connector as protocol-before-port, so an
  # order-dependent regex would leave AJP at 8009 and collide across instances.
  ansible.builtin.shell: |
    python3 -c "
    import re, sys
    path = '{{ catalina_base }}/conf/server.xml'
    c = open(path).read(); orig = c
    def setport(block, port):
        return re.sub(r'(\bport=\")\d+(\")', r'\g<1>%s\g<2>' % port, block, count=1)
    c = re.sub(r'(<Server\b[^>]*?\bport=\")\d+(\")', r'\g<1>{{ openspecimen_shutdown_port }}\g<2>', c, count=1)
    c = re.sub(r'<Connector\b[^>]*?protocol=\"HTTP/1\.1\"[^>]*?/>',
               lambda m: setport(m.group(0), '{{ openspecimen_port }}'), c, flags=re.DOTALL)
    c = re.sub(r'<Connector\b[^>]*?protocol=\"AJP/1\.3\"[^>]*?/>',
               lambda m: setport(m.group(0), '{{ openspecimen_ajp_port }}'), c, flags=re.DOTALL)
    if c == orig: sys.exit(0)
    open(path, 'w').write(c); print('changed')
    "
  args:
    executable: /bin/bash
  register: _port_patch
  changed_when: "'changed' in _port_patch.stdout"
  notify: restart openspecimen
  when: not (_reuse_existing_config | default(false))

# Stock Tomcat ships the AJP connector commented out; when proxying via AJP it must
# be uncommented or Apache gets "Connection refused" and serves the 503 page.
- name: "[tomcat:{{ openspecimen_service_name }}] Enable (uncomment) the AJP connector"
  # Line-based (not regex): remove only a BARE '<!--'/'-->' bracketing the AJP
  # <Connector>, so the descriptive comment survives and we never leave a half-open
  # comment (which breaks server.xml).
  ansible.builtin.shell: |
    python3 -c "
    import sys
    path = '{{ catalina_base }}/conf/server.xml'
    lines = open(path).read().split('\n')
    n = len(lines)
    start = end = None
    for i, ln in enumerate(lines):
        if '<Connector' in ln:
            j = i; blk = ln
            while '/>' not in lines[j] and j < n - 1:
                j += 1; blk += lines[j]
            if 'AJP/1.3' in blk:
                start, end = i, j; break
    if start is None:
        sys.exit(0)
    changed = False
    k = end + 1
    while k < n and lines[k].strip() == '':
        k += 1
    if k < n and lines[k].strip() == '-->':
        del lines[k]; changed = True
    k = start - 1
    while k >= 0 and lines[k].strip() == '':
        k -= 1
    if k >= 0 and lines[k].strip() == '<!--':
        del lines[k]; changed = True
    if changed:
        open(path, 'w').write('\n'.join(lines)); print('changed')
    "
  args:
    executable: /bin/bash
  register: _ajp_enable
  changed_when: "'changed' in _ajp_enable.stdout"
  notify: restart openspecimen
  when:
    - not (_reuse_existing_config | default(false))
    - apache_enabled | default(false) | bool
    - (apache_proxy_protocol | default('http')) == 'ajp'

# ── Patch AJP connector (per CATALINA_BASE) ──────────────────────────────────
# Tomcat 9.0.31+ sets secretRequired="true" by default; without a secret the AJP
# connector refuses to start and aborts the service. Disable it and bind AJP to
# IPv4 loopback (Ghostcat / CVE-2020-1938). Idempotent.
- name: "[tomcat:{{ openspecimen_service_name }}] Set secretRequired=false on AJP connector"
  ansible.builtin.shell: |
    python3 -c "
    import re, sys
    path = '{{ catalina_base }}/conf/server.xml'
    content = open(path).read()
    if 'secretRequired' in content:
        sys.exit(0)
    patched = re.sub(
        r'(<Connector[^>]*protocol=\"AJP/1\.3\"[^>]*?)(\s*/>)',
        r'\1 secretRequired=\"false\"\2',
        content, flags=re.DOTALL)
    if patched == content:
        sys.exit(0)
    open(path, 'w').write(patched)
    print('changed')
    "
  register: _ajp_patch
  changed_when: "'changed' in _ajp_patch.stdout"
  notify: restart openspecimen
  when: not (_reuse_existing_config | default(false))

- name: "[tomcat:{{ openspecimen_service_name }}] Bind AJP connector to 127.0.0.1"
  ansible.builtin.shell: |
    python3 -c "
    import re, sys
    path = '{{ catalina_base }}/conf/server.xml'
    content = open(path).read()
    def patch(m):
        tag, close = m.group(1), m.group(2)
        if 'address=\"127.0.0.1\"' in tag:
            return m.group(0)
        if 'address=' in tag:
            tag = re.sub(r'address=\"[^\"]*\"', 'address=\"127.0.0.1\"', tag)
            return tag + close
        return tag + ' address=\"127.0.0.1\"' + close
    patched = re.sub(
        r'(<Connector[^>]*protocol=\"AJP/1\.3\"[^>]*?)(\s*/>)',
        patch, content, flags=re.DOTALL)
    if patched == content:
        sys.exit(0)
    open(path, 'w').write(patched)
    print('changed')
    "
  register: _ajp_bind
  changed_when: "'changed' in _ajp_bind.stdout"
  notify: restart openspecimen
  when: not (_reuse_existing_config | default(false))

- name: "[tomcat:{{ openspecimen_service_name }}] Log JVM heap sizing"
  ansible.builtin.debug:
    msg: >-
      {{ openspecimen_service_name }} heap:
      -Xms{{ (_instance.heap_min | string ~ 'm') if (_instance.heap_min | default('') | string | trim | length > 0) else tomcat_heap_min }}
      -Xmx{{ (_instance.heap_max | string ~ 'm') if (_instance.heap_max | default('') | string | trim | length > 0) else tomcat_heap_max }}
      (RAM: {{ ansible_facts['memtotal_mb'] }} MB)

# Rendered on every deploy EXCEPT a db_managed=false reuse (existing on-host
# datasource): there the JNDI datasource is left exactly as it is, so an app-only
# upgrade touches only java/tomcat/war/plugins/apache and needs no db_password. A
# db_managed=false FRESH host (no existing datasource) DOES render this from the
# inventory db_config - and preflight fails first if that config is missing.
- name: "[tomcat:{{ openspecimen_service_name }}] Template context.xml (JNDI datasource)"
  ansible.builtin.template:
    src: context.xml.j2
    dest: "{{ catalina_base }}/conf/context.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  notify: restart openspecimen
  when:
    - not (_reuse_existing_config | default(false))
    - not (openspecimen_shared_tomcat | default(false))

# ── Shared-Tomcat co-tenancy (openspecimen_shared_tomcat) ────────────────────
# Multiple named apps share ONE conf/context.xml. Instead of rendering the file
# whole (which would erase every other app's datasource), MERGE only THIS app's
# <Resource>+<Environment> block, keyed by war_name marker. Preserves co-tenant
# blocks - including a legacy hand-managed app's inline datasource. Runs even in
# the _reuse_existing_config path: a NEW co-tenant's datasource must be added
# while the shared Tomcat runtime (server.xml/setenv) is left untouched.
- name: "[tomcat:{{ openspecimen_service_name }}] Ensure shared context.xml has a clean <Context> wrapper"
  # Greenfield (this run just installed the Tomcat - CATALINA_HOME/bin/startup.sh was
  # absent at the pre-install stat) → force:true: reset context.xml to the clean wrapper,
  # discarding whatever the release bundle's conf overlay laid down (its stock
  # jdbc/openspecimen sample), so a freshly Ansible-built shared Tomcat holds ONLY
  # Ansible-managed blocks. No real co-tenant can exist yet on a just-installed Tomcat.
  # Brownfield (Tomcat pre-existed) → force:false: NEVER clobber an existing shared
  # context.xml - it may hold a real co-tenant or a legacy install.sh datasource.
  # Undefined stat (called outside the deploy flow) defaults to brownfield (preserve).
  ansible.builtin.copy:
    dest: "{{ catalina_base }}/conf/context.xml"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Managed by Ansible - shared context.xml (co-tenant OpenSpecimen apps) -->
      <Context notFoundClassResourceCacheSize="0">
          <WatchedResource>WEB-INF/web.xml</WatchedResource>
          <WatchedResource>WEB-INF/tomcat-web.xml</WatchedResource>
          <WatchedResource>${catalina.base}/conf/web.xml</WatchedResource>
      </Context>
    force: "{{ not (_inst_tomcat_stat.stat.exists | default(true)) }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  when: openspecimen_shared_tomcat | default(false)

# A CRLF context.xml (a Windows-authored stock/bundle file that brownfield seeding
# preserves) breaks the blockinfile marker match below: the markers are compared with
# '\n' line endings and never match the file's '...-->\r' lines, so every deploy
# APPENDED a fresh OSP-MANAGED block instead of updating in place - duplicating this
# instance's datasource. Strip CR so the markers match (and the ^M chars are removed),
# and drop any pre-existing DUPLICATE blocks for THIS war_name (the merge below re-adds
# exactly one). Co-tenant blocks are left untouched. Idempotent: no-op once the file is
# LF with a single block for this app. newline='' preserves raw endings so CRLF is
# detected and rewritten.
- name: "[tomcat:{{ openspecimen_service_name }}] Normalise shared context.xml (strip CR, drop duplicate blocks)"
  ansible.builtin.shell: |
    python3 -c "
    import re
    path = '{{ catalina_base }}/conf/context.xml'
    c = open(path, newline='').read(); orig = c
    c = c.replace('\r', '')
    war = '{{ openspecimen_war_name }}'
    pat = re.compile(r'[ \t]*<!-- BEGIN OSP-MANAGED datasource: ' + re.escape(war) + r' -->.*?<!-- END OSP-MANAGED datasource: ' + re.escape(war) + r' -->[ \t]*\n?', re.DOTALL)
    if len(pat.findall(c)) >= 2:
        c = pat.sub('', c)
    if c != orig:
        open(path, 'w').write(c); print('changed')
    "
  args:
    executable: /bin/bash
  register: _ctx_normalise
  changed_when: "'changed' in _ctx_normalise.stdout"
  notify: restart openspecimen
  when: openspecimen_shared_tomcat | default(false)

- name: "[tomcat:{{ openspecimen_service_name }}] Merge this app's datasource block into shared context.xml"
  ansible.builtin.blockinfile:
    path: "{{ catalina_base }}/conf/context.xml"
    marker: "    <!-- {mark} OSP-MANAGED datasource: {{ openspecimen_war_name }} -->"
    insertbefore: '</Context>'
    block: "{{ lookup('template', 'context-datasource-block.xml.j2') | indent(8, first=True) }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  notify: restart openspecimen
  when: openspecimen_shared_tomcat | default(false)

# Reuse safety net: when reusing existing config (db_managed=false + existing host
# config), we deliberately did NOT re-render context.xml. It was present at the
# direction.yml probe, so it should still be here - re-verify to catch the one case
# that can lose it between probe and now: a Tomcat *version change* on a default
# (base==home) instance re-unpacks the stock context.xml over the shared conf. Fail
# fast with guidance instead of a misleading JDBC error minutes later at startup.
- name: "[tomcat:{{ openspecimen_service_name }}] Re-verify the reused datasource survives (db_managed=false upgrade)"
  when: _reuse_existing_config | default(false)
  block:
    - name: "[tomcat:{{ openspecimen_service_name }}] Check context.xml still has the {{ openspecimen_datasource_name }} datasource"
      # rc 0 = present, 1 = file exists but no datasource, 2 = file missing.
      # Keyed to this app's datasource name so a co-tenant (e.g. jdbc/darpan) in a
      # shared context.xml is checked correctly, not the default jdbc/openspecimen.
      ansible.builtin.command: "grep -q '{{ openspecimen_datasource_name }}' {{ catalina_base }}/conf/context.xml"
      register: _external_datasource_check
      failed_when: false
      changed_when: false

    - name: "[tomcat:{{ openspecimen_service_name }}] Fail if the reused datasource was lost"
      ansible.builtin.fail:
        msg: |
          ✗ db_managed=false: the {{ openspecimen_datasource_name }} datasource is no longer present at
            {{ catalina_base }}/conf/context.xml

          It existed when the deploy started but is now gone - most likely a Tomcat
          version change re-unpacked the stock config over a default (base==home)
          instance's shared conf directory.

          What to do:
            - Re-onboard this host, OR
            - Run one deploy with db_managed=true (plus mysql_db_password / the
              relevant oracle_* vars) to re-render the datasource, then switch back
              to db_managed=false for subsequent app-only upgrades.
      when: _external_datasource_check.rc != 0

# db_managed=false: reuse the existing heap config - the memory guardrail below
# still reads the live setenv.sh, so co-located sizing is re-validated either way.
- name: "[tomcat:{{ openspecimen_service_name }}] Template setenv.sh (JVM heap)"
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ catalina_base }}/bin/setenv.sh"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0750'
  notify: restart openspecimen
  when: not (_reuse_existing_config | default(false))

# ── Co-location memory guardrail ─────────────────────────────────────────────
# Sum the -Xmx of EVERY OpenSpecimen instance's setenv.sh on this host (this
# instance's freshly-written one + any co-located ones), add the host-level MySQL
# InnoDB buffer + an OS reserve + a per-JVM off-heap estimate, and compare to RAM.
# Runs after setenv.sh is written but before the restart handler, so an
# over-subscribed second instance is caught before it can OOM/thrash - and (inside
# the deploy block) triggers auto-rollback. Body reads env vars only (no inline
# Jinja - split_args). Backups live under */config/setenv.sh, not */bin/, so the
# */bin/setenv.sh glob only matches live instances.
- name: "[tomcat:{{ openspecimen_service_name }}] Memory guardrail - co-located heaps must fit in RAM"
  ansible.builtin.shell: |
    python3 << 'PYEOF'
    import os, re, glob, sys
    ram     = int(os.environ['RAM_MB'])
    reserve = int(os.environ['OS_RESERVE_MB'])
    offheap = int(os.environ['JVM_OFFHEAP_MB'])
    mysql   = int(os.environ['MYSQL_BUFFER_MB'])
    root    = os.environ['OSP_ROOT']

    def to_mb(tok):
        m = re.match(r'(\d+)\s*([kKmMgG]?)', tok or '')
        if not m:
            return 0
        n, u = int(m.group(1)), m.group(2).lower()
        if u == 'g':
            return n * 1024
        if u == 'k':
            return n // 1024
        return n  # m or bare (Xmx defaults to bytes if bare, but our template writes m)

    heaps = []
    for se in sorted(glob.glob(root + '/**/bin/setenv.sh', recursive=True)):
        m = re.search(r'-Xmx(\d+[kKmMgG]?)', open(se, errors='replace').read())
        if m:
            heaps.append((se, to_mb(m.group(1))))
    total_heap = sum(mb for _, mb in heaps)
    n = max(1, len(heaps))
    projected = total_heap + mysql + reserve + offheap * n
    print("Instances (live setenv.sh): %d" % len(heaps))
    for se, mb in heaps:
        print("  -Xmx %5d MB  %s" % (mb, se))
    print("Heaps total : %d MB" % total_heap)
    print("MySQL buffer: %d MB   OS reserve: %d MB   JVM off-heap: %d MB x %d" % (mysql, reserve, offheap, n))
    print("Projected   : %d MB   /   Host RAM: %d MB" % (projected, ram))
    # This guardrail is about CO-LOCATION. A single instance keeps the established
    # single-tenant 50%-of-RAM default (which is fine even on a small host), so
    # never fail there - only enforce once a 2nd instance shares the box.
    if len(heaps) < 2:
        print("Single instance - co-location guardrail not applied.")
        sys.exit(0)
    sys.exit(2 if projected > ram else 0)
    PYEOF
  args:
    executable: /bin/bash
  environment:
    OSP_ROOT:         "{{ openspecimen_root | default('/usr/local/openspecimen') }}"
    RAM_MB:           "{{ ansible_facts['memtotal_mb'] }}"
    OS_RESERVE_MB:    "{{ openspecimen_mem_os_reserve_mb | default(1024) }}"
    JVM_OFFHEAP_MB:   "{{ openspecimen_mem_jvm_offheap_mb | default(512) }}"
    MYSQL_BUFFER_MB:  "{{ (mysql_innodb_buffer_pool_size | regex_replace('[^0-9]', '') | int) if (db_managed | default(true) | bool and db_type | default('mysql') == 'mysql') else 0 }}"
  become: true
  register: _mem_guardrail
  changed_when: false
  failed_when: false

- name: "[tomcat:{{ openspecimen_service_name }}] Memory allocation across instances"
  ansible.builtin.debug:
    var: _mem_guardrail.stdout_lines

- name: "[tomcat:{{ openspecimen_service_name }}] Fail - co-located instances over-subscribe RAM"
  ansible.builtin.fail:
    msg: |
      ✗ Co-located OpenSpecimen instances over-subscribe host memory:
      {{ _mem_guardrail.stdout }}

      The combined Tomcat heaps + MySQL InnoDB buffer + OS reserve exceed host RAM.
      Set tomcat_heap_max_override (integer MB) per customer folder so the total fits:
        heap budget ≈ RAM - MySQL buffer - OS reserve - (off-heap x instances)
      Each instance's -Xmx must stay >= 2048 (OpenSpecimen's floor). See
      docs/MULTI-INSTANCE.md - Resource sizing.

      To proceed anyway, downgrade the guardrail:
        -e openspecimen_memory_guardrail=warn   (log only)   or   =off (skip)
  when:
    - _mem_guardrail.rc == 2
    - (openspecimen_memory_guardrail | default('fail')) == 'fail'

- name: "[tomcat:{{ openspecimen_service_name }}] WARN - instances over-subscribe RAM (guardrail=warn)"
  ansible.builtin.debug:
    msg: >-
      ⚠ WARNING: co-located instances over-subscribe RAM (projected usage exceeds host
      RAM - see the allocation above). Set tomcat_heap_max_override (MB) per folder.
  when:
    - _mem_guardrail.rc == 2
    - (openspecimen_memory_guardrail | default('fail')) == 'warn'

- name: "[tomcat:{{ openspecimen_service_name }}] Install systemd unit"
  ansible.builtin.template:
    src: openspecimen.service.j2
    dest: "/etc/systemd/system/{{ openspecimen_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart openspecimen

- name: "[tomcat:{{ openspecimen_service_name }}] Enable service"
  ansible.builtin.systemd:
    name: "{{ openspecimen_service_name }}"
    enabled: true
    daemon_reload: true
