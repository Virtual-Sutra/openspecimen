---
# ── Verify release zip on control node ───────────────────────────────────────
# openspecimen_zip_path must be a path on the Ansible control node.
# Stat and upload run here, not on target.

- name: Assert openspecimen_release is set
  ansible.builtin.assert:
    that: openspecimen_release | length > 0
    fail_msg: "openspecimen_release must be set - pass -e openspecimen_release=<name>"

- name: Stat release zip on control node
  ansible.builtin.stat:
    path: "{{ openspecimen_zip_path | expanduser }}"
  register: _release_zip
  delegate_to: localhost
  become: false

- name: Assert release zip exists
  ansible.builtin.assert:
    that: _release_zip.stat.exists
    fail_msg: >
      Release zip not found: {{ openspecimen_zip_path }}
      Pass the path at run time: -e openspecimen_zip_path=/path/to/<release>.zip

- name: Upload release zip to target
  ansible.builtin.copy:
    src:  "{{ openspecimen_zip_path | expanduser }}"
    dest: "/tmp/{{ openspecimen_release }}.zip"
    mode: '0644'

# ── Cache zip contents listing ────────────────────────────────────────────────
# Listed once; reused for all extraction tasks below and by the openspecimen
# role (variable persists across roles within the same play).

- name: Cache release zip contents
  ansible.builtin.shell: unzip -l /tmp/{{ openspecimen_release }}.zip
  register: _zip_contents
  changed_when: false

# ── Install Tomcat: binaries from pinned download, conf from the release zip ──
# Tomcat 9 is not packaged on Ubuntu 24.04 (ships Tomcat 10) or RHEL 9, so the
# binaries come from a pinned Apache download (tomcat_version = os_versions.tomcat,
# component spec #90). The OpenSpecimen-tuned config (conf/, and any non-binary
# dirs in the bundle) and the DB connectors continue to come from the release
# zip. conf and binaries must share the same Tomcat major (9).

- name: Create /usr/local/openspecimen base dir
  ansible.builtin.file:
    path: /usr/local/openspecimen
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'

- name: Assert Tomcat major is 9
  ansible.builtin.assert:
    that: tomcat_major == '9'
    fail_msg: >-
      tomcat_version={{ tomcat_version }} (major {{ tomcat_major }}), but the
      OpenSpecimen webapp and the bundled conf require Tomcat 9. Set
      os_versions.tomcat to a 9.0.x release in the component spec.

- name: Check if Tomcat is already installed
  ansible.builtin.stat:
    path: "{{ tomcat_home }}/bin/startup.sh"
  register: tomcat_stat

# Download once on the control node, OUTSIDE the per-host install block.
# get_url is idempotent (skips when dest matches the checksum). Keeping it out
# of the `when: not tomcat_stat...` block means a mixed batch - some hosts
# already installed, some fresh - still has the tarball staged for the fresh
# ones (run_once gated on a per-host fact would skip the download for them).
- name: Download pinned Tomcat tarball to control node
  ansible.builtin.get_url:
    url: "{{ tomcat_download_url }}"
    dest: "/tmp/{{ tomcat_tarball }}"
    checksum: "{{ tomcat_download_checksum }}"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true

- name: Install Tomcat (binaries from download, config overlaid from the zip)
  when: not tomcat_stat.stat.exists
  block:
    - name: Upload Tomcat tarball to target
      ansible.builtin.copy:
        src:  "/tmp/{{ tomcat_tarball }}"
        dest: "/tmp/{{ tomcat_tarball }}"
        mode: '0644'

    - name: Create CATALINA_HOME
      ansible.builtin.file:
        path: "{{ tomcat_home }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        mode: '0755'

    - name: Unpack Tomcat into CATALINA_HOME (strip top-level dir)
      ansible.builtin.unarchive:
        src: "/tmp/{{ _tomcat_tarball }}"
        dest: "{{ tomcat_home }}"
        remote_src: true
        extra_opts: ['--strip-components=1']
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"

    - name: Extract inner tomcat-as.zip from release package
      ansible.builtin.shell: |
        TOMCAT_ZIP=$(echo "{{ _zip_contents.stdout }}" \
          | awk 'NF==4 && $NF ~ /tomcat-as\.zip$/ {print $NF; exit}')
        if [ -z "$TOMCAT_ZIP" ]; then
          echo "ERROR: tomcat-as.zip not found inside /tmp/{{ openspecimen_release }}.zip"
          exit 1
        fi
        unzip -p /tmp/{{ openspecimen_release }}.zip "$TOMCAT_ZIP" > /tmp/tomcat-as.zip
        test -s /tmp/tomcat-as.zip || { echo "ERROR: extracted tomcat-as.zip is empty"; exit 1; }

    # Overlay everything from the bundle EXCEPT the binaries (bin/, lib/) - keeps
    # the OpenSpecimen-tuned conf/ (server.xml etc.) and any other bundle dirs on
    # top of the pinned Tomcat. The bundle's lib/ is empty; connectors are copied
    # from the release zip below.
    - name: Overlay OpenSpecimen config from the bundle over the pinned Tomcat
      ansible.builtin.shell: |
        set -o pipefail
        unzip -o /tmp/tomcat-as.zip -d /usr/local/openspecimen/ \
          -x 'tomcat-as/bin/*' 'tomcat-as/lib/*'
        test -f {{ tomcat_home }}/conf/server.xml \
          || { echo "ERROR: tomcat-as/conf/server.xml not found in bundle"; exit 1; }
      args:
        executable: /bin/bash

    - name: Remove inner tomcat-as.zip
      ansible.builtin.file:
        path: /tmp/tomcat-as.zip
        state: absent

    - name: Set ownership of CATALINA_HOME
      ansible.builtin.file:
        path: "{{ tomcat_home }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        recurse: true

# ── Copy database connectors ──────────────────────────────────────────────────
# lib/ is empty in the tomcat-as bundle so unzip does not create it.
# Connectors are always redeployed from the current release zip - stale JARs
# removed first to ensure the correct version is in place after upgrades.

- name: Create tomcat lib directory
  ansible.builtin.file:
    path: "{{ tomcat_home }}/lib"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'

- name: Find existing MySQL connector
  ansible.builtin.find:
    paths:    "{{ tomcat_home }}/lib"
    patterns: "mysql-connector*.jar"
  register: _mysql_connectors
  when: db_type == 'mysql'

# ── Backup existing MySQL connector before replacement ───────────────────────
# Mirrors the openspecimen role's WAR/plugin backup pattern:
#   {{ openspecimen_backup_dir }}/<timestamp>/lib/
# Creates intermediate dirs if openspecimen_backup_dir doesn't exist yet
# (tomcat role runs before openspecimen role on a fresh install).

- name: Backup existing MySQL connector to timestamped lib backup
  when:
    - db_type == 'mysql'
    - _mysql_connectors.files | default([]) | length > 0
  block:
    - name: Generate backup timestamp for tomcat lib changes
      ansible.builtin.command: date '+%d%m%Y_%H%M%S'
      register: _tomcat_backup_ts
      changed_when: false

    - name: Create timestamped lib backup directory
      ansible.builtin.file:
        path: "{{ openspecimen_backup_dir }}/{{ _tomcat_backup_ts.stdout }}/lib"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        mode: '0755'

    - name: Copy existing MySQL connector to timestamped lib backup
      ansible.builtin.copy:
        src:        "{{ item.path }}"
        dest:       "{{ openspecimen_backup_dir }}/{{ _tomcat_backup_ts.stdout }}/lib/"
        remote_src: true
        owner:      root
        group:      root
        mode:       '0640'
      loop: "{{ _mysql_connectors.files }}"

- name: Extract MySQL connector(s) from release zip
  # Copy every mysql-connector*.jar the zip ships (a release may bundle more
  # than one, e.g. 5.1.x and 8.0.x) - "whatever's in the zip".
  ansible.builtin.shell: |
    set -o pipefail
    rm -f {{ tomcat_home }}/lib/mysql-connector*.jar
    CONNECTORS=$(echo "{{ _zip_contents.stdout }}" \
      | awk 'NF==4 && $NF ~ /mysql-connector.*\.jar$/ {print $NF}')
    if [ -z "$CONNECTORS" ]; then
      echo "ERROR: no MySQL connector JAR found in release zip"
      exit 1
    fi
    echo "$CONNECTORS" | while read -r c; do
      unzip -j /tmp/{{ openspecimen_release }}.zip "$c" -d {{ tomcat_home }}/lib/
    done
    chown {{ tomcat_user }}:{{ tomcat_user }} {{ tomcat_home }}/lib/mysql-connector*.jar
    chmod 644 {{ tomcat_home }}/lib/mysql-connector*.jar
  args:
    executable: /bin/bash
  when: db_type == 'mysql'

- name: Extract Oracle JDBC driver(s) from release zip
  ansible.builtin.shell: |
    set -o pipefail
    rm -f {{ tomcat_home }}/lib/ojdbc*.jar
    DRIVERS=$(echo "{{ _zip_contents.stdout }}" \
      | awk 'NF==4 && $NF ~ /ojdbc.*\.jar$/ {print $NF}')
    if [ -z "$DRIVERS" ]; then
      echo "ERROR: no Oracle JDBC driver found in release zip"
      exit 1
    fi
    echo "$DRIVERS" | while read -r d; do
      unzip -j /tmp/{{ openspecimen_release }}.zip "$d" -d {{ tomcat_home }}/lib/
    done
    chown {{ tomcat_user }}:{{ tomcat_user }} {{ tomcat_home }}/lib/ojdbc*.jar
    chmod 644 {{ tomcat_home }}/lib/ojdbc*.jar
  args:
    executable: /bin/bash
  when: db_type == 'oracle'

# ── Templated configs ─────────────────────────────────────────────────────────

- name: Log JVM heap sizing
  ansible.builtin.debug:
    msg: >-
      Heap: -Xms{{ tomcat_heap_min }} -Xmx{{ tomcat_heap_max }}
      (RAM: {{ ansible_facts['memtotal_mb'] }} MB
      {% if tomcat_heap_max_override is defined %}| override{% else %}| auto-sized{% endif %})

- name: Template context.xml (JNDI datasource)
  ansible.builtin.template:
    src: context.xml.j2
    dest: "{{ tomcat_home }}/conf/context.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  notify: restart openspecimen

- name: Template setenv.sh (JVM heap settings)
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ tomcat_home }}/bin/setenv.sh"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0750'
  notify: restart openspecimen

# ── Patch AJP connector ───────────────────────────────────────────────────────
# Tomcat 9.0.31+ sets secretRequired="true" by default on the AJP connector.
# Without a matching secret= attribute the connector refuses to start, which
# aborts StandardService.startInternal() and prevents port 8080 from binding.
# The deploy can front Tomcat over AJP (apache_proxy_protocol: ajp) or HTTP;
# either way we disable the secret requirement and bind AJP to loopback so the
# connector starts cleanly and is never reachable off-box.

- name: Set secretRequired=false on AJP connector in server.xml
  ansible.builtin.shell: |
    python3 -c "
    import re, sys
    path = '{{ tomcat_home }}/conf/server.xml'
    content = open(path).read()
    if 'secretRequired' in content:
        sys.exit(0)
    patched = re.sub(
        r'(<Connector[^>]*protocol=\"AJP/1\.3\"[^>]*?)(\s*/>)',
        r'\1 secretRequired=\"false\"\2',
        content, flags=re.DOTALL)
    if patched == content:
        sys.exit(0)
    open(path, 'w').write(patched)
    print('changed')
    "
  register: _ajp_patch
  changed_when: "'changed' in _ajp_patch.stdout"
  notify: restart openspecimen

# Bind the AJP connector to IPv4 loopback (Ghostcat / CVE-2020-1938 mitigation).
# Apache proxies over ajp://127.0.0.1:8009, so off-box exposure is never needed.
# Stock Tomcat ships the AJP connector with address="::1" (IPv6 loopback only);
# we force 127.0.0.1 so it matches the Apache backend regardless of how the host
# resolves "localhost". Idempotent: no-op once address="127.0.0.1" is set.
- name: Bind AJP connector to 127.0.0.1 in server.xml
  ansible.builtin.shell: |
    python3 -c "
    import re, sys
    path = '{{ tomcat_home }}/conf/server.xml'
    content = open(path).read()
    def patch(m):
        tag, close = m.group(1), m.group(2)
        if 'address=\"127.0.0.1\"' in tag:
            return m.group(0)
        if 'address=' in tag:
            tag = re.sub(r'address=\"[^\"]*\"', 'address=\"127.0.0.1\"', tag)
            return tag + close
        return tag + ' address=\"127.0.0.1\"' + close
    patched = re.sub(
        r'(<Connector[^>]*protocol=\"AJP/1\.3\"[^>]*?)(\s*/>)',
        patch, content, flags=re.DOTALL)
    if patched == content:
        sys.exit(0)
    open(path, 'w').write(patched)
    print('changed')
    "
  register: _ajp_bind
  changed_when: "'changed' in _ajp_bind.stdout"
  notify: restart openspecimen

# ── systemd service ───────────────────────────────────────────────────────────

- name: Install openspecimen systemd service
  ansible.builtin.template:
    src: openspecimen.service.j2
    dest: /etc/systemd/system/openspecimen.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart openspecimen

- name: Enable openspecimen service
  ansible.builtin.systemd:
    name: openspecimen
    enabled: true
    daemon_reload: true
