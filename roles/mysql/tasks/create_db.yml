---
# Create one OpenSpecimen database + dedicated user (ADR-006: one DB + one
# user, scoped to that DB only, per instance on the shared MySQL server).
# Called once per instance from main.yml. `instance` is the loop var.
- name: "Create OpenSpecimen database ({{ _instance.db_name }})"
  community.mysql.mysql_db:
    name: "{{ _instance.db_name }}"
    state: present
    login_unix_socket: "{{ _mysql_socket }}"

# ADR-012: mysql_grant_host resolves to the app host's ansible_host for
# split-host customers - but an EICE/EC2-instance-ID app host's ansible_host
# IS the instance ID, not a routable address, so a grant against it would be
# silently useless. Fail fast here with the fix instead of writing that grant.
- name: Fail fast when mysql_grant_host looks like an EC2 instance ID
  ansible.builtin.fail:
    msg: >-
      mysql_grant_host resolved to '{{ mysql_grant_host }}', which looks like
      an EC2 instance ID, not a routable address - GRANT can't authenticate
      against it. This customer's OpenSpecimen host is EICE/EC2-based, where
      ansible_host is an instance ID. Set mysql_grant_host_override explicitly
      in this customer's 20-customer.yml, to the app host's real VPC-private IP.
  when:
    - _mysql_split_host
    - mysql_grant_host is match(_ec2_instance_id_pattern)

- name: "Create OpenSpecimen database user ({{ _instance.db_user }})"
  block:
    # PROCESS + SHOW_ROUTINE (global, alongside the per-DB ALL) are required
    # for `mysqldump --routines --add-drop-database` (db-backup.yml, main.yml,
    # rollback.yml) to succeed, not just for the app's own JDBC use of this
    # grant: --single-transaction dumps tablespace info (needs PROCESS), and
    # dumping routines this account didn't itself DEFINE needs SHOW_ROUTINE
    # (MySQL 8.0.20+) - Liquibase creates routines as whichever grant account
    # the app's JDBC connection used, which for split-host is the
    # mysql_grant_host entry below, not the separate localhost entry backup
    # connects as.
    - name: "Grant privileges to {{ _instance.db_user }}@{{ mysql_grant_host }}"
      community.mysql.mysql_user:
        name: "{{ _instance.db_user }}"
        password: "{{ _instance.db_password }}"
        # String form, not a dict - a dict key here (`"{{ _instance.db_name
        # }}.*": ALL`) does NOT get Jinja-templated by this module, so the
        # GRANT silently lands on a database literally named
        # "{{ _instance.db_name }}" instead of the real one. Confirmed live:
        # `SHOW GRANTS` showed exactly that literal string as the db name,
        # and the real database was left with no ALL-privileges grant at all.
        # SET_ANY_DEFINER (MySQL 8.0.24+, alongside PROCESS/SHOW_ROUTINE) is
        # needed on the restore side: a routine dump captures DEFINER=<the
        # account that created it> for each routine, and restoring that
        # DEFINER clause under a DIFFERENT connecting account (mysql_grant_host
        # creates routines via the app's JDBC connection; the localhost
        # account below is what restores them, split-host) fails with
        # "Access denied; you need SUPER or SET_ANY_DEFINER" without it.
        # Confirmed live: a real db-restore over VPN failed on exactly this
        # until both grant accounts had it.
        priv: "{{ _instance.db_name }}.*:ALL/*.*:PROCESS,SHOW_ROUTINE,SET_ANY_DEFINER"
        host: "{{ mysql_grant_host }}"
        state: present
        login_unix_socket: "{{ _mysql_socket }}"

    # ADR-012: backup/restore/upgrade dumps (db-backup.yml, db-restore.yml,
    # main.yml, rollback.yml) run delegated ON the MySQL host itself and
    # connect via -h 127.0.0.1 - a different peer address than
    # mysql_grant_host (the APP host's IP), so MySQL sees it as a distinct
    # account and denies it without its own grant. Not needed co-located,
    # where mysql_grant_host already IS 'localhost'.
    - name: "Grant local privileges to {{ _instance.db_user }}@localhost (split-host backup/restore)"
      community.mysql.mysql_user:
        name: "{{ _instance.db_user }}"
        password: "{{ _instance.db_password }}"
        # String form, not a dict - a dict key here (`"{{ _instance.db_name
        # }}.*": ALL`) does NOT get Jinja-templated by this module, so the
        # GRANT silently lands on a database literally named
        # "{{ _instance.db_name }}" instead of the real one. Confirmed live:
        # `SHOW GRANTS` showed exactly that literal string as the db name,
        # and the real database was left with no ALL-privileges grant at all.
        # SET_ANY_DEFINER (MySQL 8.0.24+, alongside PROCESS/SHOW_ROUTINE) is
        # needed on the restore side: a routine dump captures DEFINER=<the
        # account that created it> for each routine, and restoring that
        # DEFINER clause under a DIFFERENT connecting account (mysql_grant_host
        # creates routines via the app's JDBC connection; the localhost
        # account below is what restores them, split-host) fails with
        # "Access denied; you need SUPER or SET_ANY_DEFINER" without it.
        # Confirmed live: a real db-restore over VPN failed on exactly this
        # until both grant accounts had it.
        priv: "{{ _instance.db_name }}.*:ALL/*.*:PROCESS,SHOW_ROUTINE,SET_ANY_DEFINER"
        host: localhost
        state: present
        login_unix_socket: "{{ _mysql_socket }}"
      when: _mysql_split_host
  rescue:
    # Surface the exact MySQL error and the resolved grant host inline -
    # a malformed mysql_grant_host_override or a stale conflicting grant
    # from a prior topology change must be diagnosable from the console
    # alone, not require re-deriving mysql_grant_host by hand.
    - name: Report GRANT failure with actionable detail
      ansible.builtin.fail:
        msg: >-
          Failed to GRANT privileges for {{ _instance.db_user }}@{{ mysql_grant_host }}
          on {{ _instance.db_name }}: {{ (ansible_failed_result.msg | default('unknown error')) }}.
          mysql_grant_host resolved to '{{ mysql_grant_host }}' - confirm this is a valid
          MySQL grant host (IP, hostname, or CIDR) MySQL will actually see the connection
          from, and that no conflicting grant already exists for this user from a prior
          topology (e.g. a stale 'localhost' grant left over from before this customer
          switched to split-host, or vice versa).
