---
# Write config BEFORE installing MySQL so the package picks it up when it
# initialises the data directory. lower_case_table_names and character-set-server
# cannot be changed after data-dir init in MySQL 8.x.

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# ADR-012: create_db.yml's mysql_db/mysql_user modules run wherever this role
# is delegated - on a dedicated MySQL VM, that's a host the common role never
# touches (common only runs on the app host), so it never got the PyMySQL
# Python module those modules need. Co-located installs already have it via
# common's _os_prereq_packages; only the split-host, delegated case needs it
# installed here too.
- name: Enable EPEL repository for PyMySQL (RHEL, split-host)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_split_host

- name: Install PyMySQL Python module (split-host delegated host)
  ansible.builtin.package:
    name: "{{ 'python3-PyMySQL' if ansible_facts['os_family'] == 'RedHat' else 'python3-pymysql' }}"
    state: present
  when: _mysql_split_host

# ── RHEL 9: add MySQL Community repo ─────────────────────────────────────────
# RHEL 9 ships MariaDB in its default repos; the community repo provides
# genuine MySQL 8.4 LTS. The RPM is idempotent - dnf skips it if already present.

- name: Install MySQL Community repository (RHEL)
  ansible.builtin.dnf:
    name: "https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_facts['os_family'] == 'RedHat'

# ── Debian/Ubuntu: add MySQL APT repo (8.4 LTS) ──────────────────────────────
# Ubuntu's default repos ship MySQL 8.0; the MySQL APT repo provides genuine
# 8.4 LTS. Add the signing key + repo before install so `mysql-community-server`
# resolves to 8.4. Idempotent - apt skips both when already present.

- name: Ensure apt keyrings directory (Debian)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] == 'Debian'

- name: Install MySQL APT signing key (Debian)
  ansible.builtin.get_url:
    url: "{{ _mysql_apt_key_url }}"
    dest: "{{ _mysql_apt_keyring }}"
    owner: root
    group: root
    mode: '0644'
    # Always refresh: a box that fetched the pre-renewal (expired) key on an
    # earlier run must pick up the renewed key, and the key rotates over time.
    force: true
    timeout: "{{ mysql_apt_key_timeout | default(20) | int }}"
  when: ansible_facts['os_family'] == 'Debian'
  register: _mysql_apt_key_fetch
  # keyserver.ubuntu.com (the SKS pool - see _mysql_apt_key_url's own comment
  # for why the alternative, repo.mysql.com's standalone key file, can't be
  # used instead: it serves an EXPIRED key) is known-flaky - retry rather than
  # fail the whole deploy on a single slow/dropped connection. Mirrors the
  # tomcat role's own download retry pattern (roles/tomcat/tasks/main.yml).
  until: _mysql_apt_key_fetch is succeeded
  retries: "{{ mysql_apt_key_retries | default(3) | int }}"
  delay: "{{ mysql_apt_key_delay | default(5) | int }}"

- name: Add MySQL 8.4 LTS APT repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ _mysql_apt_keyring }}]
      https://repo.mysql.com/apt/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} {{ _mysql_apt_component }}
    filename: mysql
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

# Preseed debconf so mysql-community-server installs non-interactively with an
# empty root password (root is normalised to auth_socket after start, below).
# Use debconf-set-selections directly: the ansible.builtin.debconf module needs
# debconf-utils, which isn't installed on a fresh box.
- name: Preseed MySQL debconf for non-interactive install (Debian)
  ansible.builtin.shell: >-
    printf '%s\n%s\n'
    'mysql-community-server mysql-community-server/root-pass password'
    'mysql-community-server mysql-community-server/re-root-pass password'
    | debconf-set-selections
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

# ── Write config before install ───────────────────────────────────────────────

- name: Log InnoDB buffer pool sizing
  ansible.builtin.debug:
    msg: >-
      InnoDB buffer pool: {{ mysql_innodb_buffer_pool_size }}
      (RAM: {{ ansible_facts['memtotal_mb'] }} MB
      {% if mysql_innodb_buffer_pool_size_override is defined %}| override{% else %}| auto-sized at 25%{% endif %})

- name: Create MySQL config directory
  ansible.builtin.file:
    path: "{{ _mysql_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write mysqld.cnf before MySQL is installed
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ _mysql_conf_file }}"
    owner: root
    group: root
    mode: '0644'
  register: _mysqld_cnf

# ── Install and start ─────────────────────────────────────────────────────────

- name: Install MySQL server
  ansible.builtin.package:
    name: "{{ _mysql_package }}"
    state: present
  register: _mysql_install

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name: "{{ _mysql_service }}"
    state: started
    enabled: true

# A fresh install applies mysqld.cnf at data-dir init; an already-installed server
# needs a restart to pick up config changes (e.g. mysql_native_password=ON) before
# any DB user is created.
- name: Restart MySQL to apply config changes on an existing install
  ansible.builtin.service:
    name: "{{ _mysql_service }}"
    state: restarted
  when:
    - _mysqld_cnf is changed
    - _mysql_install is not changed

# ── RHEL 9: initialise root access ───────────────────────────────────────────
# MySQL Community on RHEL sets a temporary root password printed in the error
# log on first init. Reset it to empty so the community.mysql modules can
# connect via socket without a password (same behaviour as Ubuntu).

- name: Check MySQL root socket connectivity (RHEL)
  ansible.builtin.command:
    cmd: mysqladmin -u root ping
  register: _mysql_root_ping
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Read temporary MySQL root password from error log (RHEL)
  ansible.builtin.shell: |
    grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}' | tail -1
  register: _mysql_tmp_pass
  changed_when: false
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0

- name: Reset MySQL root to empty password (RHEL first-time init)
  ansible.builtin.shell: |
    mysql --connect-expired-password -u root \
      -p'{{ _mysql_tmp_pass.stdout }}' \
      -e "ALTER USER 'root'@'localhost' IDENTIFIED BY ''; FLUSH PRIVILEGES;"
  changed_when: true
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0
    - _mysql_tmp_pass.stdout | length > 0

# ── Debian/Ubuntu: normalise root to auth_socket ─────────────────────────────
# community-server installs with an empty (preseeded) root password and no
# auth_socket. If root socket auth is broken (re-used instance), wipe + re-init a
# clean data dir. Either path ends with root on auth_socket so create_db.yml
# connects over the socket with no password.

- name: Check MySQL root socket connectivity (Debian)
  ansible.builtin.command:
    cmd: mysql -u root -S {{ _mysql_socket }} -e "SELECT 1"
  register: _mysql_root_socket_debian
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

# ── Pre-deploy DB snapshot (Debian, existing install) ────────────────────────
# Dump every database to a timestamped gzip before a deploy touches an existing
# server - a rollback point for the schema migrations run later in the play.
# This is NOT what protects the reinit/wipe path: that path is fail-closed on
# fresh installs plus the user-DB scan below. The snapshot can't cover the wipe
# anyway - it only runs when root IS socket-reachable (rc == 0), and a
# broken-auth box that could reach the wipe can't authenticate a passwordless
# mysqldump (restore auth there first). Fresh installs (_mysql_install is
# changed) have no data yet, so it is gated to existing installs only.
- name: Ensure MySQL backup directory exists (Debian)
  ansible.builtin.file:
    path: "{{ _mysql_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_install is not changed
    - _mysql_root_socket_debian.rc == 0

- name: Back up all MySQL databases before any change (Debian)
  # set -o pipefail is required: without it a failed mysqldump still exits 0
  # because gzip succeeds, leaving a truncated .sql.gz that looks like a good
  # backup. --all-databases captures every instance schema in one dump.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      mysqldump -u root -S "{{ _mysql_socket }}"
      --all-databases
      --skip-lock-tables --routines --single-transaction
      --set-gtid-purged=OFF --triggers --no-tablespaces
      | gzip -c > "{{ _mysql_backup_path }}"
    executable: /bin/bash
  # A snapshot is a read-only artifact, not a change to managed config state -
  # report ok so a stable re-run stays changed=0 (project idempotency gate).
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_install is not changed
    - _mysql_root_socket_debian.rc == 0

- name: Prune old MySQL backups, keeping the most recent (Debian)
  # Bounds disk use: timestamped dumps would otherwise accumulate in /var over
  # every deploy. Keep the newest _mysql_backup_keep, remove the rest.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      ls -1t "{{ _mysql_backup_dir }}"/all-databases-*.sql.gz 2>/dev/null
      | tail -n +{{ _mysql_backup_keep + 1 }}
      | xargs -r rm -f --
    executable: /bin/bash
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_install is not changed
    - _mysql_root_socket_debian.rc == 0

# Data-safety guard: only wipe when the data dir holds nothing but the system
# schemas (mysql/sys/performance_schema). Any other database dir = live data → fail.
- name: Scan for existing user databases before reinit (Debian)
  ansible.builtin.find:
    paths: /var/lib/mysql
    file_type: directory
    excludes: ['mysql', 'sys', 'performance_schema']
  register: _mysql_userdbs
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0

- name: Refuse to reinit an existing MySQL install whose root is not socket-reachable (Debian)
  # Fail loudly for every unsafe state: an already-installed server (reinit is
  # fresh-install only) OR a data dir holding user databases. Reinit below can
  # only fire on the safe complement - a fresh install with no user data.
  ansible.builtin.fail:
    msg: >-
      MySQL root is not reachable over the socket with no password. The data
      directory holds:
      {{ (_mysql_userdbs.files | map(attribute='path') | map('basename') | join(', '))
         if (_mysql_userdbs.matched | default(0)) > 0 else 'system schemas only' }}.
      Refusing to reinitialise /var/lib/mysql (that path is fresh-install only).
      Restore root auth manually (auth_socket, or the known root password) and re-run.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0
    - (_mysql_install is not changed) or ((_mysql_userdbs.matched | default(0)) > 0)

- name: Reinitialize MySQL data directory (Debian, fresh box with broken root auth)
  # Only reached when THIS run just installed MySQL (_mysql_install is changed),
  # root auth is broken, AND the data dir has no user databases - i.e. a genuinely
  # fresh box or a preseed miss on first install. Wipe + --initialize-insecure
  # re-creates it with an empty-password root, and our mysqld.cnf (written before
  # install) is applied from first init. The _mysql_install gate makes it
  # structurally impossible to wipe a pre-existing install; the user-db scan is a
  # second belt. Any existing install with broken root auth fails the guard above.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_install is changed
    - _mysql_root_socket_debian.rc != 0
    - (_mysql_userdbs.matched | default(0)) == 0
  block:
    - name: Stop MySQL before data directory wipe
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: stopped

    - name: Wipe MySQL data directory
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent

    - name: Initialize MySQL data directory
      # mysql-systemd-start refuses to start without /var/lib/mysql - it does not
      # auto-init. --initialize-insecure creates the data dir with an empty-password
      # root; the auth_socket normalisation below switches it to socket auth.
      ansible.builtin.command:
        cmd: /usr/sbin/mysqld --initialize-insecure --user=mysql
      changed_when: true

    - name: Start MySQL after fresh initialization
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: started

    - name: Wait for MySQL to be ready
      ansible.builtin.wait_for:
        port: 3306
        host: 127.0.0.1
        timeout: 60

- name: Ensure root uses auth_socket (Debian)
  # Load the auth_socket plugin (community-server does not pre-load it) and
  # switch root to it if not already. Connects as OS root over the socket: works
  # with the fresh empty-password root and, idempotently, on re-runs where root
  # is already auth_socket.
  ansible.builtin.shell: |
    set -e
    sock="{{ _mysql_socket }}"
    if [ "$(mysql -u root -S "$sock" -sNe "SELECT COUNT(*) FROM information_schema.plugins WHERE plugin_name='auth_socket';")" != "1" ]; then
      mysql -u root -S "$sock" -e "INSTALL PLUGIN auth_socket SONAME 'auth_socket.so';"
    fi
    if [ "$(mysql -u root -S "$sock" -sNe "SELECT plugin FROM mysql.user WHERE user='root' AND host='localhost';")" != "auth_socket" ]; then
      mysql -u root -S "$sock" -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH auth_socket; FLUSH PRIVILEGES;"
      echo CHANGED
    fi
  register: _mysql_root_authsock
  changed_when: "'CHANGED' in _mysql_root_authsock.stdout"
  when: ansible_facts['os_family'] == 'Debian'

# ── Verify config ─────────────────────────────────────────────────────────────

- name: Verify MySQL config (lower_case_table_names=1, character_set_server=utf8)
  ansible.builtin.command:
    cmd: >
      mysql -u root -S {{ _mysql_socket }} -sNe
      "SELECT @@lower_case_table_names, @@character_set_server;"
  register: mysql_config
  changed_when: false
  failed_when: >
    mysql_config.stdout | trim != '1\tutf8mb3' and
    mysql_config.stdout | trim != '1\tutf8'

# ── Create database and user (one per instance, ADR-006) ──────────────────────
# Server install/config above is host-level (runs once). DB + user creation is
# per-instance: one database + one dedicated user each. _instances is built in
# site.yml; the default below keeps this role usable standalone (single DB).
- name: Create database and user for each instance
  ansible.builtin.include_tasks: create_db.yml
  loop: "{{ _instances | default([{'db_name': mysql_db_name, 'db_user': mysql_db_user, 'db_password': mysql_db_password | default('')}]) }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.db_name }}"
