---
# Write config BEFORE installing MySQL so the package picks it up when it
# initialises the data directory. lower_case_table_names and character-set-server
# cannot be changed after data-dir init in MySQL 8.x.

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# ── RHEL 9: add MySQL Community repo ─────────────────────────────────────────
# RHEL 9 ships MariaDB in its default repos; the community repo provides
# genuine MySQL 8.4 LTS. The RPM is idempotent - dnf skips it if already present.

- name: Install MySQL Community repository (RHEL)
  ansible.builtin.dnf:
    name: "https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_facts['os_family'] == 'RedHat'

# ── Debian/Ubuntu: add MySQL APT repo (8.4 LTS) ──────────────────────────────
# Ubuntu's default repos ship MySQL 8.0; the MySQL APT repo provides genuine
# 8.4 LTS. Add the signing key + repo before install so `mysql-community-server`
# resolves to 8.4. Idempotent - apt skips both when already present.

- name: Ensure apt keyrings directory (Debian)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] == 'Debian'

- name: Install MySQL APT signing key (Debian)
  ansible.builtin.get_url:
    url: "{{ _mysql_apt_key_url }}"
    dest: "{{ _mysql_apt_keyring }}"
    owner: root
    group: root
    mode: '0644'
    # Always refresh: a box that fetched the pre-renewal (expired) key on an
    # earlier run must pick up the renewed key, and the key rotates over time.
    force: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Add MySQL 8.4 LTS APT repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ _mysql_apt_keyring }}]
      https://repo.mysql.com/apt/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} {{ _mysql_apt_component }}
    filename: mysql
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

# Preseed debconf so mysql-community-server installs non-interactively with an
# empty root password (root is normalised to auth_socket after start, below).
# Use debconf-set-selections directly: the ansible.builtin.debconf module needs
# debconf-utils, which isn't installed on a fresh box.
- name: Preseed MySQL debconf for non-interactive install (Debian)
  ansible.builtin.shell: >-
    printf '%s\n%s\n'
    'mysql-community-server mysql-community-server/root-pass password'
    'mysql-community-server mysql-community-server/re-root-pass password'
    | debconf-set-selections
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

# ── Write config before install ───────────────────────────────────────────────

- name: Log InnoDB buffer pool sizing
  ansible.builtin.debug:
    msg: >-
      InnoDB buffer pool: {{ mysql_innodb_buffer_pool_size }}
      (RAM: {{ ansible_facts['memtotal_mb'] }} MB
      {% if mysql_innodb_buffer_pool_size_override is defined %}| override{% else %}| auto-sized at 25%{% endif %})

- name: Create MySQL config directory
  ansible.builtin.file:
    path: "{{ _mysql_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write mysqld.cnf before MySQL is installed
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ _mysql_conf_file }}"
    owner: root
    group: root
    mode: '0644'
  register: _mysqld_cnf

# ── Install and start ─────────────────────────────────────────────────────────

- name: Install MySQL server
  ansible.builtin.package:
    name: "{{ _mysql_package }}"
    state: present
  register: _mysql_install

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name: "{{ _mysql_service }}"
    state: started
    enabled: true

# A fresh install (or the Debian reinit path) applies mysqld.cnf at data-dir init,
# so no restart is needed there. But when the config changes on an ALREADY-installed
# server (e.g. adding mysql_native_password=ON on a re-run), the running server
# still has the old settings - restart it so the new options take effect before
# any DB user is created.
- name: Restart MySQL to apply config changes on an existing install
  ansible.builtin.service:
    name: "{{ _mysql_service }}"
    state: restarted
  when:
    - _mysqld_cnf is changed
    - _mysql_install is not changed

# ── RHEL 9: initialise root access ───────────────────────────────────────────
# MySQL Community on RHEL sets a temporary root password printed in the error
# log on first init. Reset it to empty so the community.mysql modules can
# connect via socket without a password (same behaviour as Ubuntu).

- name: Check MySQL root socket connectivity (RHEL)
  ansible.builtin.command:
    cmd: mysqladmin -u root ping
  register: _mysql_root_ping
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Read temporary MySQL root password from error log (RHEL)
  ansible.builtin.shell: |
    grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}' | tail -1
  register: _mysql_tmp_pass
  changed_when: false
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0

- name: Reset MySQL root to empty password (RHEL first-time init)
  ansible.builtin.shell: |
    mysql --connect-expired-password -u root \
      -p'{{ _mysql_tmp_pass.stdout }}' \
      -e "ALTER USER 'root'@'localhost' IDENTIFIED BY ''; FLUSH PRIVILEGES;"
  changed_when: true
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0
    - _mysql_tmp_pass.stdout | length > 0

# ── Debian/Ubuntu: normalise root to auth_socket ─────────────────────────────
# MySQL community-server installs non-interactively with an empty root password
# (preseeded above) and, unlike Ubuntu's own package, does not pre-configure
# auth_socket. If root socket auth is broken instead (e.g. a re-used instance
# with an unknown password), wipe + re-init to a clean empty-password data dir.
# Either path ends by normalising root to auth_socket so create_db.yml can
# connect over the socket with no password.

- name: Check MySQL root socket connectivity (Debian)
  ansible.builtin.command:
    cmd: mysql -u root -S {{ _mysql_socket }} -e "SELECT 1"
  register: _mysql_root_socket_debian
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

# Before any reinit, positively confirm there is no user data to lose. The wipe
# below is only ever safe when the data dir holds nothing but the system schemas
# (mysql/sys/performance_schema) - i.e. a genuinely fresh box. Any other database
# directory (e.g. openspecimen / os_*) means live data: refuse to wipe.
- name: Scan for existing user databases before reinit (Debian)
  ansible.builtin.find:
    paths: /var/lib/mysql
    file_type: directory
    excludes: ['mysql', 'sys', 'performance_schema']
  register: _mysql_userdbs
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0

- name: Refuse to reinit a MySQL data directory that holds user databases (Debian)
  ansible.builtin.fail:
    msg: >-
      MySQL root is not reachable over the socket with no password, but the data
      directory holds user database(s):
      {{ _mysql_userdbs.files | map(attribute='path') | map('basename') | join(', ') }}.
      Refusing to wipe /var/lib/mysql. Restore root auth manually (auth_socket, or
      the known root password) and re-run.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0
    - (_mysql_userdbs.matched | default(0)) > 0

- name: Reinitialize MySQL data directory (Debian, fresh box with broken root auth)
  # Only reached when root auth is broken AND the data dir has no user databases
  # (fresh box, or a preseed miss on first install). Wipe + --initialize-insecure
  # re-creates it with an empty-password root, and our mysqld.cnf (written before
  # install) is applied from first init. A re-used instance with live data fails
  # the guard above instead of being wiped.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0
    - (_mysql_userdbs.matched | default(0)) == 0
  block:
    - name: Stop MySQL before data directory wipe
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: stopped

    - name: Wipe MySQL data directory
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent

    - name: Initialize MySQL data directory
      # mysql-systemd-start refuses to start without /var/lib/mysql - it does not
      # auto-init. --initialize-insecure creates the data dir with an empty-password
      # root; the auth_socket normalisation below switches it to socket auth.
      ansible.builtin.command:
        cmd: /usr/sbin/mysqld --initialize-insecure --user=mysql
      changed_when: true

    - name: Start MySQL after fresh initialization
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: started

    - name: Wait for MySQL to be ready
      ansible.builtin.wait_for:
        port: 3306
        host: 127.0.0.1
        timeout: 60

- name: Ensure root uses auth_socket (Debian)
  # Load the auth_socket plugin (community-server does not pre-load it) and
  # switch root to it if not already. Connects as OS root over the socket: works
  # with the fresh empty-password root and, idempotently, on re-runs where root
  # is already auth_socket.
  ansible.builtin.shell: |
    set -e
    sock="{{ _mysql_socket }}"
    if [ "$(mysql -u root -S "$sock" -sNe "SELECT COUNT(*) FROM information_schema.plugins WHERE plugin_name='auth_socket';")" != "1" ]; then
      mysql -u root -S "$sock" -e "INSTALL PLUGIN auth_socket SONAME 'auth_socket.so';"
    fi
    if [ "$(mysql -u root -S "$sock" -sNe "SELECT plugin FROM mysql.user WHERE user='root' AND host='localhost';")" != "auth_socket" ]; then
      mysql -u root -S "$sock" -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH auth_socket; FLUSH PRIVILEGES;"
      echo CHANGED
    fi
  register: _mysql_root_authsock
  changed_when: "'CHANGED' in _mysql_root_authsock.stdout"
  when: ansible_facts['os_family'] == 'Debian'

# ── Verify config ─────────────────────────────────────────────────────────────

- name: Verify MySQL config (lower_case_table_names=1, character_set_server=utf8)
  ansible.builtin.command:
    cmd: >
      mysql -u root -S {{ _mysql_socket }} -sNe
      "SELECT @@lower_case_table_names, @@character_set_server;"
  register: mysql_config
  changed_when: false
  failed_when: >
    mysql_config.stdout | trim != '1\tutf8mb3' and
    mysql_config.stdout | trim != '1\tutf8'

# ── Create database and user (one per instance, ADR-006) ──────────────────────
# Server install/config above is host-level (runs once). DB + user creation is
# per-instance: one database + one dedicated user each. _instances is built in
# site.yml; the default below keeps this role usable standalone (single DB).
- name: Create database and user for each instance
  ansible.builtin.include_tasks: create_db.yml
  loop: "{{ _instances | default([{'db_name': mysql_db_name, 'db_user': mysql_db_user, 'db_password': mysql_db_password | default('')}]) }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.db_name }}"
