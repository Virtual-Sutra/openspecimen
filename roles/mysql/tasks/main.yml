---
# Write config BEFORE installing MySQL so the package picks it up when it
# initialises the data directory. lower_case_table_names and character-set-server
# cannot be changed after data-dir init in MySQL 8.x.

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# ── RHEL 9: add MySQL Community repo ─────────────────────────────────────────
# RHEL 9 ships MariaDB in its default repos; the community repo provides
# genuine MySQL 8.4 LTS. The RPM is idempotent — dnf skips it if already present.

- name: Install MySQL Community repository (RHEL)
  ansible.builtin.dnf:
    name: "https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_facts['os_family'] == 'RedHat'

# ── Write config before install ───────────────────────────────────────────────

- name: Log InnoDB buffer pool sizing
  ansible.builtin.debug:
    msg: >-
      InnoDB buffer pool: {{ mysql_innodb_buffer_pool_size }}
      (RAM: {{ ansible_facts['memtotal_mb'] }} MB
      {% if mysql_innodb_buffer_pool_size_override is defined %}| override{% else %}| auto-sized at 25%{% endif %})

- name: Create MySQL config directory
  ansible.builtin.file:
    path: "{{ _mysql_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write mysqld.cnf before MySQL is installed
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ _mysql_conf_file }}"
    owner: root
    group: root
    mode: '0644'

# ── Install and start ─────────────────────────────────────────────────────────

- name: Install MySQL server
  ansible.builtin.package:
    name: "{{ _mysql_package }}"
    state: present

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name: "{{ _mysql_service }}"
    state: started
    enabled: true

# ── RHEL 9: initialise root access ───────────────────────────────────────────
# MySQL Community on RHEL sets a temporary root password printed in the error
# log on first init. Reset it to empty so the community.mysql modules can
# connect via socket without a password (same behaviour as Ubuntu).

- name: Check MySQL root socket connectivity (RHEL)
  ansible.builtin.command:
    cmd: mysqladmin -u root ping
  register: _mysql_root_ping
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Read temporary MySQL root password from error log (RHEL)
  ansible.builtin.shell: |
    grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}' | tail -1
  register: _mysql_tmp_pass
  changed_when: false
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0

- name: Reset MySQL root to empty password (RHEL first-time init)
  ansible.builtin.shell: |
    mysql --connect-expired-password -u root \
      -p'{{ _mysql_tmp_pass.stdout }}' \
      -e "ALTER USER 'root'@'localhost' IDENTIFIED BY ''; FLUSH PRIVILEGES;"
  changed_when: true
  no_log: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _mysql_root_ping.rc != 0
    - _mysql_tmp_pass.stdout | length > 0

# ── Debian/Ubuntu: ensure root uses auth_socket ──────────────────────────────
# Ubuntu installs auth_socket by default, but re-used instances (or installs
# that ran ALTER USER) may have root on password auth. Use the always-present
# debian-sys-maint credentials to restore auth_socket when socket auth fails.

- name: Check MySQL root socket connectivity (Debian)
  ansible.builtin.command:
    cmd: mysql -u root -S {{ _mysql_socket }} -e "SELECT 1"
  register: _mysql_root_socket_debian
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Reset MySQL root to auth_socket via debian-sys-maint (Debian)
  ansible.builtin.command:
    cmd: >-
      mysql --defaults-extra-file=/etc/mysql/debian.cnf -e
      "ALTER USER 'root'@'localhost' IDENTIFIED WITH auth_socket; FLUSH PRIVILEGES;"
  register: _mysql_debian_maint_reset
  failed_when: false
  changed_when: _mysql_debian_maint_reset.rc == 0
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0

- name: Reinitialize MySQL data directory (Debian, all auth broken)
  # debian-sys-maint password is stale (debian.cnf out of sync with MySQL grants,
  # common on re-used instances). Wipe the data directory — MySQL re-initialises
  # on next start with auth_socket for root (Ubuntu package default), and our
  # mysqld.cnf (written before install) is applied from first init.
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _mysql_root_socket_debian.rc != 0
    - _mysql_debian_maint_reset.rc | default(0) != 0
  block:
    - name: Stop MySQL before data directory wipe
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: stopped

    - name: Wipe MySQL data directory
      ansible.builtin.file:
        path: /var/lib/mysql
        state: absent

    - name: Initialize MySQL data directory
      # Ubuntu's mysql-systemd-start refuses to start without /var/lib/mysql —
      # it does not auto-init. --initialize-insecure creates the data dir and
      # sets root to empty password (no plugin), which we switch to auth_socket below.
      ansible.builtin.command:
        cmd: mysqld --initialize-insecure --user=mysql
      changed_when: true

    - name: Start MySQL after fresh initialization
      ansible.builtin.service:
        name: "{{ _mysql_service }}"
        state: started

    - name: Wait for MySQL to be ready
      ansible.builtin.wait_for:
        port: 3306
        host: 127.0.0.1
        timeout: 60

    - name: Switch root to auth_socket after fresh init
      ansible.builtin.command:
        cmd: >-
          mysql -u root --password= -e
          "ALTER USER 'root'@'localhost' IDENTIFIED WITH auth_socket; FLUSH PRIVILEGES;"
      changed_when: true

# ── Verify config ─────────────────────────────────────────────────────────────

- name: Verify MySQL config (lower_case_table_names=1, character_set_server=utf8)
  ansible.builtin.command:
    cmd: >
      mysql -u root -S {{ _mysql_socket }} -sNe
      "SELECT @@lower_case_table_names, @@character_set_server;"
  register: mysql_config
  changed_when: false
  failed_when: >
    mysql_config.stdout | trim != '1\tutf8mb3' and
    mysql_config.stdout | trim != '1\tutf8'

# ── Create database and user ──────────────────────────────────────────────────

- name: Create OpenSpecimen database
  community.mysql.mysql_db:
    name: "{{ mysql_db_name }}"
    state: present
    login_unix_socket: "{{ _mysql_socket }}"

- name: Create OpenSpecimen database user
  community.mysql.mysql_user:
    name: "{{ mysql_db_user }}"
    password: "{{ mysql_db_password }}"
    priv: "{{ mysql_db_name }}.*:ALL"
    host: localhost
    state: present
    login_unix_socket: "{{ _mysql_socket }}"
