---
# Standalone on-demand DB backup (#98) - local MySQL. Mainly for large DBs where
# the upgrade's size gate halts: run this, then re-run with -e db_backup_confirmed=true.
# --single-transaction = consistent InnoDB snapshot without locking (no outage);
# --add-drop-database makes the dump self-restoring. RDS -> AWS snapshot; Oracle -> DBA.

- name: Assert this is a managed local MySQL database
  ansible.builtin.assert:
    that:
      - db_managed | default(true) | bool
      - db_type | default('mysql') == 'mysql'
    fail_msg: >-
      db-backup.yml supports local MySQL (db_managed=true, db_type=mysql) only.
      For RDS take an AWS snapshot (#99); for Oracle use the DBA's backup tools.

# ADR-012: resolves _mysql_target_host (self, unless mysql_host is set) and
# fails fast if a dedicated MySQL host is configured but unreachable, before
# any backup work starts.
- name: Resolve the MySQL target host
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/resolve-mysql-target.yml"

- name: Get backup timestamp
  ansible.builtin.command: date '+%d%m%Y_%H%M%S'
  register: _db_backup_ts
  changed_when: false

- name: Set DB backup file path
  ansible.builtin.set_fact:
    _db_backup_file: "{{ db_backup_dir | default(openspecimen_instance_dir ~ '/db-backups') }}/{{ _db_backup_ts.stdout }}_{{ mysql_db_name }}.sql.gz"

# ADR-012: every task below runs on the MySQL host (delegate_to is a no-op
# when co-located). _db_backup_file above still templates from THIS host's
# own vars (delegate_to only changes execution host, not variable context),
# so the path is identical either way, just physically on a different disk.
# tomcat_user doesn't exist on a MySQL-only VM, so split-host owns it root.
- name: Dump database to the MySQL host's own filesystem
  delegate_to: "{{ _mysql_target_host }}"
  block:
    - name: Ensure DB backup directory exists
      ansible.builtin.file:
        path: "{{ db_backup_dir | default(openspecimen_instance_dir ~ '/db-backups') }}"
        state: directory
        owner: "{{ 'root' if _mysql_split_host else tomcat_user }}"
        group: "{{ 'root' if _mysql_split_host else tomcat_user }}"
        mode: '0750'

    - name: Dump database (consistent, gzipped)
      # -h 127.0.0.1 (not mysql_db_host): once delegated, this task runs ON
      # the MySQL host itself and connects to its own loopback - correct for
      # both topologies, since delegate_to is a no-op when co-located.
      ansible.builtin.shell: |
        set -o pipefail
        mysqldump --single-transaction --routines --triggers --add-drop-database --databases {{ mysql_db_name }} \
          -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' -h 127.0.0.1 \
          | gzip > "{{ _db_backup_file }}"
      args:
        executable: /bin/bash
      no_log: true

    - name: Set ownership of the dump
      ansible.builtin.file:
        path: "{{ _db_backup_file }}"
        owner: "{{ 'root' if _mysql_split_host else tomcat_user }}"
        group: "{{ 'root' if _mysql_split_host else tomcat_user }}"
        mode: '0640'

    - name: Stat the dump
      ansible.builtin.stat:
        path: "{{ _db_backup_file }}"
      register: _db_backup_stat

- name: Database backup complete
  ansible.builtin.debug:
    msg:
      - "Database backup written:"
      - "  {{ _db_backup_file }}  ({{ (_db_backup_stat.stat.size / 1024 / 1024) | round(1) }} MB gzipped)"
      - "Restore later with db-restore.yml (-e db_restore_confirm=true), or manually:"
      - "  gunzip -c {{ _db_backup_file }} | mysql -u {{ mysql_db_user }} -p -h {{ mysql_db_host }}"
      - "Then re-run the upgrade with -e db_backup_confirmed=true."
