---
# External public-URL health check: curl openspecimen_app_url from the control node
# (validates the full public path - proxy/ALB/DNS/cert). Runs as a post_task (after
# apache). OPT-IN via openspecimen_verify_app_url (default false); non-fatal unless
# openspecimen_app_url_check_fatal=true. The always-on local check is in the openspecimen role.
- name: Verify app reachable via public URL
  block:
    - name: Health check via public URL ({{ openspecimen_app_url }}/ui-app/)
      # Check the UI app page (what users open) rather than the REST endpoint.
      # -k when openspecimen_app_url_insecure (self-signed cert hosts).
      ansible.builtin.shell: >
        curl -sf {{ '-k ' if (openspecimen_app_url_insecure | default(false) | bool) else '' }}-o /dev/null -w "%{http_code}"
        {{ openspecimen_app_url | regex_replace('/+$', '') }}/ui-app/
        | grep -qE '^200$'
      delegate_to: localhost
      become: false
      register: _public_health
      until: _public_health.rc == 0
      retries: "{{ openspecimen_health_retries | default(5) | int }}"
      delay: "{{ openspecimen_health_delay | default(10) | int }}"
      changed_when: false
  rescue:
    - name: Warn that app is not reachable via public URL (non-fatal)
      ansible.builtin.debug:
        msg: |
          WARNING: App not reachable via the public URL {{ openspecimen_app_url }} after
          {{ openspecimen_health_retries | default(5) }} attempts. The deployment succeeded
          (the app passed its startup and local health checks); the public URL depends on
          the front-end proxy / ALB / DNS / cert layer. Check:
            1. ALB / front-end target health (path /ui-app/ -> 200)
            2. DNS: dig +short {{ openspecimen_app_url | regex_replace('^https?://', '') | regex_replace('/.*', '') }}
            3. TLS certificate validity (HTTPS)
            4. Security group allows inbound 443
            5. Allowed Request Origins in OpenSpecimen includes {{ openspecimen_app_url }}
          To make this a hard failure, deploy with -e openspecimen_app_url_check_fatal=true

    - name: Fail when public URL check is configured as fatal
      ansible.builtin.fail:
        msg: >-
          Public URL {{ openspecimen_app_url }} not reachable after
          {{ openspecimen_health_retries | default(5) }} attempts and
          openspecimen_app_url_check_fatal=true.
      when: openspecimen_app_url_check_fatal | default(false) | bool
  when:
    - openspecimen_verify_app_url | default(false) | bool
    - openspecimen_app_url is defined
