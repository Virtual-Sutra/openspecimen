---
# External public-URL reachability check.
#
# Included as a post_task (after ALL roles, notably the apache front-end proxy)
# so it validates the full public-URL stack rather than running before the proxy
# that makes the URL reachable. Runs from the Ansible control node (Jenkins).
#
# Non-fatal by default: the app already passed its local startup check, so the
# deployment itself succeeded — reachability of the public URL depends on the
# front-end proxy / ALB / DNS and must never block the deploy. Set
# openspecimen_app_url_check_fatal=true to enforce it as a hard gate.
- name: Verify app reachable via public URL
  block:
    - name: Curl openspecimen_app_url from control node
      ansible.builtin.shell: >
        curl -sf -o /dev/null -w "%{http_code}"
        {{ openspecimen_app_url }}/openspecimen/rest/ng/config-settings/app-props
        | grep -qE '^(200|401)$'
      delegate_to: localhost
      become: false
      register: _app_url_check
      until: _app_url_check.rc == 0
      retries: 12
      delay: 10
      changed_when: false
  rescue:
    - name: Warn that app is not reachable via public URL (non-fatal)
      ansible.builtin.debug:
        msg: |
          WARNING: App is running locally but not reachable via public URL after 2 minutes.
          Deployment continues - this check is informational.

          Public URL: {{ openspecimen_app_url }}
          Customer:   {{ inventory_hostname }}

          OpenSpecimen passed the local startup check (Tomcat is up on port 8080).
          The public URL depends on the front-end proxy / ALB / DNS layer.

          If you expect the public URL to work now, check:
            1. Front-end / ALB health check - path /openspecimen/rest/ng/config-settings/app-props returns HTTP 200 or 401.
            2. DNS from the control node:
                 dig +short {{ openspecimen_app_url | regex_replace('^https?://', '') | regex_replace('/.*', '') }}
            3. ALB/security group allows inbound 443.
            4. Certificate validity (HTTPS):
                 curl -vI {{ openspecimen_app_url }} 2>&1 | grep -E 'expire|subject|issuer'
            5. Allowed Request Origins in OpenSpecimen UI includes {{ openspecimen_app_url }}

          To make this a hard failure instead, deploy with -e openspecimen_app_url_check_fatal=true

    - name: Fail when public URL check is configured as fatal
      ansible.builtin.fail:
        msg: "Public URL {{ openspecimen_app_url }} not reachable after 2 minutes and openspecimen_app_url_check_fatal=true."
      when: openspecimen_app_url_check_fatal | default(false) | bool
  when: openspecimen_app_url is defined
