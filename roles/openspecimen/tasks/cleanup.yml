---
# Tear down ONE OpenSpecimen instance so the host can be reused (ADR-006, #72).
# Called per instance from cleanup.yml; `_instance` is the loop var. DESTRUCTIVE.
#
# Removes the instance's service, its ENTIRE directory openspecimen_instance_dir
# (/usr/local/<instance_name>/: tomcat-as + data/plugins/backups/scripts/markers), its
# Apache vhost, and (local MySQL) its DB + user. Only host-level MySQL server / Java /
# Apache are left - cleanup.yml's full_wipe step removes those.

# ── Service ──────────────────────────────────────────────────────────────────
- name: "[{{ _instance.name }}] Stop and disable the service"
  ansible.builtin.systemd:
    name: "{{ _instance.service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: "[{{ _instance.name }}] Remove the systemd unit"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _instance.service_name }}.service"
    state: absent

# ── App artifacts (always, per-app scoped) ───────────────────────────────────
- name: "[{{ _instance.name }}] Remove the deployed webapp"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _instance.catalina_base }}/webapps/{{ _instance.war_name }}.war"
    - "{{ _instance.catalina_base }}/webapps/{{ _instance.war_name }}"

# Remove ONLY this instance's Apache front-end - never the whole config. Covers both
# routing modes: the domain-mode vhost (sites-available + sites-enabled link on Debian,
# conf.d on RedHat) AND the path-mode proxy snippet under openspecimen.d/. The shared
# path-mode base vhost is intentionally left (other instances may still use it); it is
# removed by full_wipe.
- name: "[{{ _instance.name }}] Remove this instance's Apache vhost + path snippet"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  # The domain-mode vhost is keyed by apache_vhost_name; the path-mode snippet is keyed
  # by war_name (unique per co-tenant). Remove the legacy apache_vhost_name-named snippet
  # too, so an instance deployed before war_name keying is fully cleaned.
  loop:
    - "/etc/apache2/sites-available/{{ _instance.apache_vhost_name }}.conf"
    - "/etc/apache2/sites-enabled/{{ _instance.apache_vhost_name }}.conf"
    - "/etc/httpd/conf.d/{{ _instance.apache_vhost_name }}.conf"
    - "/etc/apache2/openspecimen.d/{{ _instance.war_name }}.conf"
    - "/etc/httpd/openspecimen.d/{{ _instance.war_name }}.conf"
    - "/etc/apache2/openspecimen.d/{{ _instance.apache_vhost_name }}.conf"
    - "/etc/httpd/openspecimen.d/{{ _instance.apache_vhost_name }}.conf"

# Best-effort reload so the running proxy stops serving the removed instance.
# Skipped on full_wipe (Apache is removed there) and harmless if Apache is absent
# (bare Tomcat / ALB front-end).
- name: "[{{ _instance.name }}] Reload Apache after removing the vhost"
  ansible.builtin.systemd:
    name: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('httpd', 'apache2') }}"
    state: reloaded
  failed_when: false
  when: not (full_wipe | default(false) | bool)

# ── Directory ─────────────────────────────────────────────────────────────────
# Every instance is fully self-contained in openspecimen_instance_dir
# (/usr/local/<instance_name>/: tomcat-as + data/plugins/backup/scripts/markers). In
# the per-instance layout there is NO shared Tomcat binary to preserve, so cleanup
# removes the WHOLE dir - tomcat-as included. Guarded to a strict subdirectory under
# /usr/local (never /usr/local itself, never a path containing '..'). A non-/usr/local
# openspecimen_instance_dir override isn't auto-removed here; the safety net below
# still cleans data/plugins/backups and a dedicated CATALINA_BASE.
- name: "[{{ _instance.name }}] Compute instance dir"
  ansible.builtin.set_fact:
    _inst_dir: "{{ (_instance.instance_dir | default(openspecimen_instance_dir | default(''))) | regex_replace('/+$', '') }}"

- name: "[{{ _instance.name }}] Remove the complete instance directory ({{ _inst_dir }})"
  ansible.builtin.file:
    path: "{{ _inst_dir }}"
    state: absent
  when:
    - _inst_dir | length > 0
    - "'..' not in _inst_dir.split('/')"   # no traversal: '..' would resolve to an ancestor on delete
    - _inst_dir.startswith('/usr/local/')  # instances live under openspecimen_instance_dir = /usr/local/<name>
    - _inst_dir != '/usr/local'            # never the shared parent itself

# Safety net for paths an operator moved OUT of the instance dir - a dedicated
# CATALINA_BASE, or data/plugins/backups on another volume - which the wholesale
# removal above won't have caught. Idempotent (an already-removed path is a no-op).
- name: "[{{ _instance.name }}] Remove a CATALINA_BASE outside the instance dir"
  ansible.builtin.file:
    path: "{{ _instance.catalina_base }}"
    state: absent
  when:
    - _instance.catalina_base | length > 0
    - (_instance.catalina_base | regex_replace('/+$', '')) != _inst_dir
    - not (_instance.catalina_base | regex_replace('/+$', '')).startswith(_inst_dir ~ '/')

- name: "[{{ _instance.name }}] Remove data, plugins, backups and markers (safety net)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _instance.data_dir }}"
    - "{{ _instance.plugin_dir }}"
    - "{{ _instance.backup_dir }}"
    - "{{ _instance.release_marker }}"
    - "{{ _instance.deploy_success_marker }}"

# ── Database (always, per-app) ───────────────────────────────────────────────
# On a clean/fresh VM (e.g. cleanup-before-deploy) local MySQL may not be running,
# so its socket is absent and there is no DB to drop - skip rather than fail trying
# to connect (deploy reinstalls MySQL and creates the DB afterwards).
- name: "[{{ _instance.name }}] Probe local MySQL socket"
  ansible.builtin.stat:
    path: "{{ '/var/lib/mysql/mysql.sock' if ansible_facts['os_family'] == 'RedHat' else '/run/mysqld/mysqld.sock' }}"
  register: _mysql_sock
  when:
    - db_managed | default(true) | bool
    - db_type | default('mysql') == 'mysql'

- name: "[{{ _instance.name }}] Drop the database and user (local MySQL only)"
  when:
    - db_managed | default(true) | bool
    - db_type | default('mysql') == 'mysql'
    - _mysql_sock.stat.exists | default(false)
  vars:
    _socket: "{{ '/var/lib/mysql/mysql.sock' if ansible_facts['os_family'] == 'RedHat' else '/run/mysqld/mysqld.sock' }}"
  block:
    - name: "[{{ _instance.name }}] Drop database {{ _instance.db_name }}"
      community.mysql.mysql_db:
        name: "{{ _instance.db_name }}"
        state: absent
        login_unix_socket: "{{ _socket }}"

    - name: "[{{ _instance.name }}] Drop database user {{ _instance.db_user }}"
      community.mysql.mysql_user:
        name: "{{ _instance.db_user }}"
        host: localhost
        state: absent
        login_unix_socket: "{{ _socket }}"
