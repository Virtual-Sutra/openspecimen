---
# Local (on-box) health check: curl the app on the target's own Tomcat. Needs no
# DNS or front-end proxy, so it works before public DNS is in place — this is the
# reliable "is the app actually serving" check. Gated by openspecimen_verify_local
# (default true). Non-fatal by default; set openspecimen_local_check_fatal=true to
# make it a hard gate.
- name: Local health check (Tomcat on the target)
  block:
    - name: Curl app on localhost:{{ openspecimen_port }} (Tomcat)
      ansible.builtin.shell: >
        curl -sf -o /dev/null -w "%{http_code}"
        http://localhost:{{ openspecimen_port }}/openspecimen/rest/ng/config-settings/app-props
        | grep -qE '^(200|401)$'
      register: _local_health
      until: _local_health.rc == 0
      retries: "{{ openspecimen_health_retries | default(5) | int }}"
      delay: "{{ openspecimen_health_delay | default(10) | int }}"
      changed_when: false
  rescue:
    - name: Warn that app is not responding locally (non-fatal)
      ansible.builtin.debug:
        msg: |
          WARNING: App did not respond on the target's localhost:{{ openspecimen_port }}
          (Tomcat) after {{ openspecimen_health_retries | default(5) }} attempts. It passed
          its earlier startup check, so investigate the openspecimen service on
          {{ inventory_hostname }}:
            sudo journalctl -u openspecimen --since '15 min ago'
          To make this a hard failure, deploy with -e openspecimen_local_check_fatal=true

    - name: Fail when local health check is configured as fatal
      ansible.builtin.fail:
        msg: >-
          App not responding on localhost:{{ openspecimen_port }} after
          {{ openspecimen_health_retries | default(5) }} attempts and
          openspecimen_local_check_fatal=true.
      when: openspecimen_local_check_fatal | default(false) | bool
  when: openspecimen_verify_local | default(true) | bool
