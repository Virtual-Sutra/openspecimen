---
# Detect direction from openspecimen_release vs the on-target .release marker and
# the installed plugin JARs. Outcomes:
#   rollback - requested < installed (semver only) -> restore backup, end play
#   no-op    - requested == installed, .deploy_success matches, plugins present
#   deploy   - fresh, upgrade, a re-run after a failed deploy, or a plugin change
# Called as the FIRST pre_task from site.yml.

- name: Validate openspecimen_release is set (required for direction detection)
  ansible.builtin.fail:
    msg: |
      ✗ openspecimen_release is not set.

      What to do:
        Pass at run time:  -e openspecimen_release=openspecimen_v12.2.RC12
        From Jenkins:      select RELEASE_FILE in the deploy job.
  when: not (openspecimen_release | default('') | trim)

- name: Default instance direction to deploy (overridden below on rollback/noop)
  ansible.builtin.set_fact:
    _instance_direction: deploy

- name: Read installed version marker on target
  ansible.builtin.slurp:
    src: "{{ openspecimen_release_marker }}"
  register: _direction_marker
  failed_when: false
  changed_when: false

- name: Set installed release fact
  ansible.builtin.set_fact:
    _installed_release: >-
      {{ (_direction_marker.content | b64decode | trim)
         if _direction_marker.content is defined else '' }}

# Auto-rollback only between ORDERED semver releases (openspecimen_vX.Y[.Z]) where
# sort -V ranks RC12 > RC8. Master/date snapshots (openspecimen_master-DD-MM-YYYY)
# aren't version-ordered (day-first date misranks under sort -V), so rollback is
# considered only when BOTH sides are _v<digit>; everything else deploys forward.
- name: Detect direction (deploy / rollback)
  ansible.builtin.shell: |
    INSTALLED="{{ _installed_release }}"
    REQUESTED="{{ openspecimen_release }}"
    if [ -z "$INSTALLED" ] || [ "$INSTALLED" = "$REQUESTED" ]; then
      echo deploy
    elif echo "$INSTALLED" | grep -Eq '_v[0-9]' \
         && echo "$REQUESTED" | grep -Eq '_v[0-9]' \
         && [ "$(printf '%s\n%s\n' "$INSTALLED" "$REQUESTED" | sort -V | head -1)" = "$REQUESTED" ]; then
      echo rollback
    else
      echo deploy
    fi
  register: _direction
  changed_when: false

- name: Announce detected direction
  ansible.builtin.debug:
    msg: >-
      {% if _direction.stdout == 'rollback' %}
      ⤺ Downgrade detected: installed {{ _installed_release }} → requested {{ openspecimen_release }}.
      Switching to ROLLBACK flow - will restore from the backup whose .release matches {{ openspecimen_release }}.
      {% elif _installed_release %}
      → Deploy: installed {{ _installed_release }} → requested {{ openspecimen_release }}.
      {% else %}
      → Fresh install: requested {{ openspecimen_release }}.
      {% endif %}

- name: Run rollback flow when downgrade detected
  ansible.builtin.include_tasks: rollback.yml
  vars:
    target_version: "{{ openspecimen_release }}"
  when: _direction.stdout == 'rollback'

- name: Mark instance direction = rollback (skip this instance's deploy, continue loop)
  ansible.builtin.set_fact:
    _instance_direction: rollback
  when: _direction.stdout == 'rollback'

# ── Skip-if-current - same-version re-deploy with matching plugin JARs ───────
# No-op when: requested == installed .release, .deploy_success references the same
# version (prior deploy finished - no partial state), and every paid/customer plugin
# JAR is present. A re-run after a FAILED deploy still proceeds (.deploy_success
# stale/absent), so no force flag is needed to recover.
- name: Read deploy-success marker on target
  ansible.builtin.slurp:
    src: "{{ openspecimen_deploy_success_marker | default('/usr/local/openspecimen/.deploy_success') }}"
  register: _success_marker_slurp
  failed_when: false
  changed_when: false

- name: Set deploy-success-confirmed fact
  ansible.builtin.set_fact:
    _last_deploy_success_release: >-
      {{ (_success_marker_slurp.content | b64decode
          | regex_search('release:\s*(\S+)', '\1') | first)
         if (_success_marker_slurp.content is defined and _success_marker_slurp.content) else '' }}

- name: Compute expected plugin version suffix
  ansible.builtin.set_fact:
    _expected_plugin_version: "{{ openspecimen_release | regex_replace('^openspecimen_', '') }}"
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Probe installed paid plugin JARs
  ansible.builtin.find:
    paths:    "{{ openspecimen_plugin_dir }}/paid"
    patterns: "{{ item }}-{{ _expected_plugin_version }}.jar"
  loop: "{{ openspecimen_paid_plugins | default([]) }}"
  register: _installed_paid_jars
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Probe installed customer plugin JARs
  ansible.builtin.find:
    paths:    "{{ openspecimen_plugin_dir }}/zustomer"
    patterns: "{{ item }}-{{ _expected_plugin_version }}.jar"
  loop: "{{ openspecimen_customer_plugins | default([]) }}"
  register: _installed_customer_jars
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

# Orphan JARs = on disk but not in the current inventory list. Used twice: here
# (a same-version re-run with an orphan forces deploy to continue, honouring a
# plugin removal) and in main.yml's orphan-removal (deletes before the backup mv).
# Runs on any deploy direction; skipped on rollback (which restores from backup).
- name: Detect orphan paid plugin JARs (on disk, not in inventory)
  ansible.builtin.shell: |
    expected="{{ openspecimen_paid_plugins | default([]) | join(' ') }}"
    for jar in {{ openspecimen_plugin_dir }}/paid/*.jar; do
      [ -f "$jar" ] || continue
      name=$(basename "$jar" | sed 's/-[^-]*\.jar$//')
      case " $expected " in *" $name "*) ;; *) echo "$jar" ;; esac
    done
  register: _orphan_paid_jars
  changed_when: false
  when: _direction.stdout == 'deploy'

- name: Detect orphan customer plugin JARs (on disk, not in inventory)
  ansible.builtin.shell: |
    expected="{{ openspecimen_customer_plugins | default([]) | join(' ') }}"
    for jar in {{ openspecimen_plugin_dir }}/zustomer/*.jar; do
      [ -f "$jar" ] || continue
      name=$(basename "$jar" | sed 's/-[^-]*\.jar$//')
      case " $expected " in *" $name "*) ;; *) echo "$jar" ;; esac
    done
  register: _orphan_customer_jars
  changed_when: false
  when: _direction.stdout == 'deploy'

- name: Decide whether plugins are already current
  ansible.builtin.set_fact:
    _all_paid_current: >-
      {{ (_installed_paid_jars.results | default([]) | selectattr('matched', 'eq', 0) | list | length) == 0 }}
    _all_customer_current: >-
      {{ (_installed_customer_jars.results | default([]) | selectattr('matched', 'eq', 0) | list | length) == 0 }}
    _no_orphans: >-
      {{ (_orphan_paid_jars.stdout | default('') | trim) == ''
         and (_orphan_customer_jars.stdout | default('') | trim) == '' }}
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

# ── Config drift detection ────────────────────────────────────────────────────
# Probe-render openspecimen.properties to a temp location and SHA-256 compare
# with the live file. Tells us whether re-templating would actually change
# anything - without writing to the live file yet. The role's main.yml runs
# the real template task later; if config differs, main.yml's task writes the
# new content and the config-only fast path skips every WAR/plugin step.
- name: Render openspecimen.properties to probe location
  ansible.builtin.template:
    src: openspecimen.properties.j2
    dest: /tmp/.openspecimen.properties.probe
    mode: '0640'
  changed_when: false
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Compute live vs probe config checksums
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ catalina_base }}/conf/{{ openspecimen_war_name }}.properties"
    - /tmp/.openspecimen.properties.probe
  loop_control:
    label: "{{ item | basename }}"
  register: _config_stat
  changed_when: false
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Remove config probe
  ansible.builtin.file:
    path: /tmp/.openspecimen.properties.probe
    state: absent
  changed_when: false
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Set config-drift fact
  ansible.builtin.set_fact:
    _config_changed: >-
      {{ ((_config_stat.results | first).stat.checksum | default('')) !=
         ((_config_stat.results | last).stat.checksum | default('')) }}
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

# ── Fast-path selection ──────────────────────────────────────────────────────
# Plugins-only and config-only are independent - both can be true on the same
# run (plugin list AND properties both changed), and both share the
# "WAR is already at requested release, skip the WAR redeploy" optimisation.
# The combined `_skip_war_redeploy` is what main.yml gates WAR/default-plugin
# tasks on.
- name: Detect plugins-only change
  ansible.builtin.set_fact:
    _plugins_only_change: >-
      {{ _direction.stdout == 'deploy'
         and _installed_release == openspecimen_release
         and _last_deploy_success_release == openspecimen_release
         and not (_all_paid_current | default(true)
                  and _all_customer_current | default(true)
                  and _no_orphans | default(true)) }}
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Detect config-only change
  ansible.builtin.set_fact:
    _config_only_change: >-
      {{ _direction.stdout == 'deploy'
         and _installed_release == openspecimen_release
         and _last_deploy_success_release == openspecimen_release
         and (_config_changed | default(false))
         and not (_plugins_only_change | default(false)) }}
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release

- name: Announce plugins-only deploy
  ansible.builtin.debug:
    msg: >-
      ⚡ Plugins-only deploy - WAR is already at {{ openspecimen_release }}.
      Skipping zip upload, WAR backup, WAR extraction, and default-plugin
      extraction. Running plugin backup + orphan cleanup + paid/customer
      plugin install + Tomcat restart only.
      {% if _config_changed | default(false) %}
      Config also drifted - re-templating openspecimen.properties as part of the same run.
      {% endif %}
  when: _plugins_only_change | default(false)

- name: Announce config-only deploy
  ansible.builtin.debug:
    msg: >-
      ⚡ Config-only deploy - WAR is already at {{ openspecimen_release }} and
      every plugin matches inventory. Skipping zip upload, WAR backup, WAR
      extraction, default-plugin extraction, and ALL paid/customer plugin
      uploads + extractions. Re-templating openspecimen.properties and
      restarting Tomcat only.
  when: _config_only_change | default(false)

- name: Show no-op summary
  ansible.builtin.debug:
    msg:
      - "✓ Already at openspecimen_release={{ openspecimen_release }} with all plugins matching and config unchanged."
      - "  paid_plugins    : {{ openspecimen_paid_plugins | default([]) }}"
      - "  customer_plugins: {{ openspecimen_customer_plugins | default([]) }}"
      - "  Skipping the deploy (already current - nothing to do)."
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release
    - _all_paid_current | default(false)
    - _all_customer_current | default(false)
    - _no_orphans | default(false)
    - not (_config_changed | default(false))

- name: Mark instance direction = noop (nothing to deploy for this instance)
  ansible.builtin.set_fact:
    _instance_direction: noop
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release
    - _all_paid_current | default(false)
    - _all_customer_current | default(false)
    - _no_orphans | default(false)
    - not (_config_changed | default(false))

- name: Announce why deploy will continue (mismatched or orphan plugins) on a same-version run
  ansible.builtin.debug:
    msg: >-
      WAR is already at {{ openspecimen_release }} but plugin state differs -
      missing paid: {{ (_installed_paid_jars.results | default([]) | selectattr('matched', 'eq', 0) | map(attribute='item') | list) }},
      missing customer: {{ (_installed_customer_jars.results | default([]) | selectattr('matched', 'eq', 0) | map(attribute='item') | list) }},
      orphan paid: {{ _orphan_paid_jars.stdout_lines | default([]) }},
      orphan customer: {{ _orphan_customer_jars.stdout_lines | default([]) }}.
      Continuing with deploy to converge.
  when:
    - _direction.stdout == 'deploy'
    - _installed_release == openspecimen_release
    - _last_deploy_success_release == openspecimen_release
    - not (_all_paid_current | default(true) and _all_customer_current | default(true) and _no_orphans | default(true))
