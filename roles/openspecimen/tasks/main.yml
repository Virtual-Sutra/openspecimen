---
# ── Prior version check ───────────────────────────────────────────────────────
# Fresh install: the common role already ran this. Upgrade (base roles skipped):
# run it here.

- name: Prior version check
  ansible.builtin.include_role:
    name: common
    tasks_from: version_check
  when: not (_version_check_done | default(false))

# Pre-flight artifact / inventory check ran as a pre_task in site.yml.
# It populated _preflight_plugin_version, _preflight_paid_find, and
# _preflight_customer_find which the plugin deploy tasks below reuse.

# ── Detect install type ───────────────────────────────────────────────────────
# Checks the database, not the WAR. A WAR on disk with an empty DB (e.g. after
# DB reset) must be treated as fresh - using upgrade mode on an empty DB skips
# core schema creation and causes Liquibase FK failures.
# Override with: -e openspecimen_install_type=fresh|upgrade
#
# db_managed=false (external RDS/Oracle): this probe is SKIPPED - we make no
# connection to the externally-managed DB. Fresh-vs-upgrade is derived instead from
# the on-host datasource (see "Set install type" below and the site.yml db_managed note).

- name: Check for existing OpenSpecimen schema in database
  when: db_managed | default(true) | bool
  block:
    - name: Probe MySQL connectivity and query schema
      ansible.builtin.shell: |
        mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
          -h {{ mysql_db_host }} {{ mysql_db_name }} \
          -sNe "SELECT COUNT(*) FROM information_schema.tables
                WHERE table_schema='{{ mysql_db_name }}'
                AND table_name='CATISSUE_SITE';"
      register: _schema_check
      changed_when: false
      no_log: true
  rescue:
    - name: Re-run query without no_log to capture the error code
      ansible.builtin.shell: |
        mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
          -h {{ mysql_db_host }} {{ mysql_db_name }} \
          -e "SELECT 1;" 2>&1 | grep -v 'password on the command line'
      register: _mysql_error
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail with operator guidance for DB connection error
      ansible.builtin.fail:
        msg: |
          ✗ Could not connect to the MySQL database.

          Host:     {{ mysql_db_host }}
          Database: {{ mysql_db_name }}
          User:     {{ mysql_db_user }}
          Customer: {{ inventory_hostname }}

          Error from MySQL:
            {{ _mysql_error.stdout | default('(no output)') }}

          What to check:
            1. Is mysql_db_password correct?
               - For Jenkins runs, it comes from secrets/{{ inventory_hostname }}.yml (vault-encrypted).
               - Re-encrypt with: ansible-vault rekey secrets/{{ inventory_hostname }}.yml

            2. Is the database host reachable from this VM?
               Run on the target ({{ inventory_hostname }}):
                 mysqladmin -h {{ mysql_db_host }} -u {{ mysql_db_user }} -p ping

            3. Does the database '{{ mysql_db_name }}' exist?
               If not (fresh install), MySQL role usually creates it. Verify db_managed setting:
                 db_managed = {{ db_managed | default('(not set)') }}

            4. For RDS - is the security group allowing this VM's IP on port 3306?

          Common fixes:
            - Wrong password    → update secrets/{{ inventory_hostname }}.yml
            - Wrong RDS host    → update mysql_db_host in inventory/host_vars/{{ inventory_hostname }}.yml
            - Missing DB        → check db_managed is true so MySQL role creates the schema

- name: Set install type
  # Recompute every time (no 'is not defined' guard): main.yml runs once per
  # instance under the #72-p2 loop, and set_fact persists across iterations, so a
  # guard would leak instance A's value to B (and skip B's upgrade backup/dump).
  # An operator '-e openspecimen_install_type=...' still wins by var precedence.
  #
  # db_managed=true: derive from the schema probe above (schema present = upgrade).
  # db_managed=false: the schema probe was skipped (never touch the external DB), so
  # derive fresh/upgrade from whether the DB config already exists on the host
  # (_reuse_existing_config, from the context.xml datasource probe in direction.yml).
  # An existing (non-Ansible or prior) install has the datasource → upgrade (reuse
  # config); a truly fresh host has none → fresh (render config from inventory).
  ansible.builtin.set_fact:
    openspecimen_install_type: >-
      {{ ('upgrade' if (_schema_check.stdout | trim) == '1' else 'fresh')
         if (db_managed | default(true) | bool)
         else ('upgrade' if (_reuse_existing_config | default(false)) else 'fresh') }}

- name: Log deployment plan
  ansible.builtin.debug:
    msg: >-
      {% if openspecimen_install_type == 'fresh' %}
      Fresh install - deploying {{ openspecimen_release }}
      {% elif _installed_release | default('') %}
      Upgrade - installed: {{ _installed_release }} → requesting: {{ openspecimen_release }}
      {% else %}
      Upgrade - no prior release marker found → requesting: {{ openspecimen_release }}
      {% endif %}

# ── Ensure release zip is on target ──────────────────────────────────────────
# site.yml on an upgrade runs only the app roles (openspecimen/plugins/apache) -
# upload if not already present.

- name: Check whether the release zip is already on target
  ansible.builtin.stat:
    path: "/tmp/{{ openspecimen_release }}.zip"
  register: _target_zip
  when: not (_plugins_only_change | default(false) or _config_only_change | default(false))

- name: Upload release zip to target (if not already present)
  # copy has no `creates:` (that is a command/shell option) - gate on a stat so a
  # large zip already staged on the target is not re-uploaded.
  ansible.builtin.copy:
    src:  "{{ openspecimen_zip_path | expanduser }}"
    dest: "/tmp/{{ openspecimen_release }}.zip"
    mode: '0644'
  when:
    - not (_plugins_only_change | default(false) or _config_only_change | default(false))
    - not (_target_zip.stat.exists | default(false))

# ── Cache zip contents listing ────────────────────────────────────────────────
# Listed once here; reused for WAR and plugin extraction below.
# When site.yml runs, tomcat role may have already set _zip_contents.
# Skipped on plugins-only - no WAR or default-plugin extraction will run.

- name: Cache release zip contents
  ansible.builtin.shell: unzip -l /tmp/{{ openspecimen_release }}.zip
  register: _zip_contents
  changed_when: false
  when: not (_plugins_only_change | default(false) or _config_only_change | default(false))

# ── Create required directories ───────────────────────────────────────────────
# Plugin subdirectory structure matches install.sh:
#   default/   - common plugins from release zip
#   paid/      - paid enterprise plugins
#   zustomer/  - customer-specific plugins

- name: Create data, plugin and backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'
  loop:
    - "{{ openspecimen_data_dir }}"
    - "{{ openspecimen_plugin_dir }}"
    - "{{ openspecimen_plugin_dir }}/default"
    - "{{ openspecimen_plugin_dir }}/paid"
    - "{{ openspecimen_plugin_dir }}/zustomer"
    - "{{ openspecimen_backup_dir }}"
    - "{{ openspecimen_backup_dir }}/config-changes"
    - "{{ openspecimen_data_dir }}/heapdumps"
    - "{{ openspecimen_instance_dir }}/scripts"

# Operator convenience script with this instance's paths/service baked in. It lives
# in the instance's own dir (openspecimen_instance_dir/scripts/), so each co-located
# instance gets its own copy that edits ITS config - no shared dir, no name clash.
- name: Deploy the per-instance update-config operator script
  ansible.builtin.template:
    src: "{{ playbook_dir }}/scripts/update-config.sh.j2"
    dest: "{{ openspecimen_instance_dir }}/scripts/update-config.sh"
    owner: root
    group: root
    mode: '0750'

# ── openspecimen.properties ───────────────────────────────────────────────────

# Slurp the OLD openspecimen.properties before the template below overwrites it,
# so the upgrade backup snapshots the prior config (else a rollback to this
# timestamp wouldn't restore it).
- name: Read current openspecimen.properties for backup (before re-template)
  ansible.builtin.slurp:
    src: "{{ catalina_base }}/conf/{{ openspecimen_war_name }}.properties"
  register: _openspecimen_properties_pre_template
  failed_when: false
  changed_when: false
  when: openspecimen_install_type == 'upgrade'

# Named after the webapp/context (<war_name>.properties) so OpenSpecimen's
# config/<context> JNDI lookup + conf/<context>.properties fallback both resolve.
# Rendered on every deploy EXCEPT a db_managed=false upgrade, which reuses the
# existing openspecimen.properties on the host (a db_managed=false FRESH install
# still renders it from inventory). The tomcat datasource guard fails fast on an
# unseeded upgrade host.
- name: Template openspecimen.properties
  ansible.builtin.template:
    src: openspecimen.properties.j2
    dest: "{{ catalina_base }}/conf/{{ openspecimen_war_name }}.properties"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  when: not (_reuse_existing_config | default(false))

# ── Backup WAR and plugins on upgrade ────────────────────────────────────────

- name: Get backup timestamp
  ansible.builtin.command: date '+%d%m%Y_%H%M%S'
  register: backup_ts
  changed_when: false
  when: openspecimen_install_type == 'upgrade'

# ── Pre-upgrade DB backup gate (#98) ─────────────────────────────────────────
# Small DBs are dumped inline; large ones would risk the deploy SLA, so halt and
# ask the operator to back up + re-run with -e db_backup_confirmed=true. Runs
# before the service is stopped (fail fast). Local MySQL only.
- name: Measure database size for the DB-backup gate
  ansible.builtin.shell: |
    mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' -h {{ mysql_db_host }} -sN \
      -e "SELECT COALESCE(ROUND(SUM(data_length+index_length)/1024/1024),0) FROM information_schema.tables WHERE table_schema='{{ mysql_db_name }}';"
  register: _db_size_mb
  changed_when: false
  no_log: true
  when: &db_backup_when
    - openspecimen_install_type == 'upgrade'
    # Only on the WAR-changing path - plugins-only/config-only upgrades skip the
    # WAR backup, so a DB dump there would be unrestorable (no WAR) and wasteful.
    - not (_plugins_only_change | default(false) or _config_only_change | default(false))
    - db_managed | default(true) | bool
    - db_type | default('mysql') == 'mysql'
    - db_backup_enabled | default(true) | bool

- name: Set database size fact (MB)
  ansible.builtin.set_fact:
    _db_size_mb_val: "{{ _db_size_mb.stdout | default('0') | trim | int }}"
  when: *db_backup_when

- name: Halt for manual DB backup on large databases
  ansible.builtin.fail:
    msg: |
      Database {{ mysql_db_name }} is {{ _db_size_mb_val }} MB
        (> db_backup_auto_max_mb = {{ db_backup_auto_max_mb | default(2048) }} MB).

      An inline mysqldump would risk the deploy SLA. Take a DB backup first
      (consistent, no outage):
        ansible-playbook -i inventory/customers/<name>/ db-backup.yml \
          -e @secrets/<name>.yml --vault-password-file .vault-pass
      (RDS: take an AWS snapshot instead.) Then re-run with:
        -e db_backup_confirmed=true     (Jenkins: tick DB_BACKUP_CONFIRMED)

      Or skip DB backup entirely:
        -e db_backup_enabled=false      (rollback will be artifact-only; the
                                         schema-drift halt remains the safety net)
  when:
    - openspecimen_install_type == 'upgrade'
    - not (_plugins_only_change | default(false) or _config_only_change | default(false))
    - db_managed | default(true) | bool
    - db_type | default('mysql') == 'mysql'
    - db_backup_enabled | default(true) | bool
    - (_db_size_mb_val | int) > (db_backup_auto_max_mb | default(2048) | int)
    - not (db_backup_confirmed | default(false) | bool)

- name: Stop service for upgrade backup
  ansible.builtin.systemd:
    name: "{{ openspecimen_service_name | default('openspecimen') }}"
    state: stopped
  when: openspecimen_install_type == 'upgrade'

# Per-tier backup dirs are conditional so rollback doesn't clobber live state from
# a fast-path backup that skipped a tier: plugins-only backs up paid/zustomer+config,
# config-only backs up config only, full backs up all four. See docs/DEPLOY-UPGRADE.md.
- name: Create backup directory structure
  ansible.builtin.file:
    path: "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'
  loop: >-
    {{
      ['config']
      + (['plugins/paid', 'plugins/zustomer'] if not (_config_only_change | default(false)) else [])
      + (['plugins/default'] if not (_plugins_only_change | default(false) or _config_only_change | default(false)) else [])
      + (['db'] if (db_managed | default(true) | bool and (db_type | default('mysql') == 'mysql') and db_backup_enabled | default(true) | bool and not (_plugins_only_change | default(false) or _config_only_change | default(false))) else [])
    }}
  when: openspecimen_install_type == 'upgrade'

- name: Backup old WAR
  ansible.builtin.shell: |
    WEBAPPS="{{ catalina_base }}/webapps"
    DEST="{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}"
    WAR="{{ openspecimen_war_name }}"
    if [ -f "$WEBAPPS/$WAR.war" ]; then
      mv "$WEBAPPS/$WAR.war" "$DEST/"
      rm -rf "$WEBAPPS/$WAR"
    fi
  when:
    - openspecimen_install_type == 'upgrade'
    - not (_plugins_only_change | default(false) or _config_only_change | default(false))

# Snapshot the database into the same timestamped backup (#98), so a rollback
# restores WAR + schema + data together (end-to-end) - schema-drift is never a
# concern. Auto-dumps only when the DB is at/under
# db_backup_auto_max_mb; larger DBs were gated above (manual backup + confirm),
# so they fall through here without an SLA-busting inline dump.
# --add-drop-database --databases makes the restore drop+recreate the schema
# cleanly (removes tables added by migrations after the backup).
- name: Back up database (mysqldump) on upgrade
  ansible.builtin.shell: |
    set -o pipefail
    mysqldump --single-transaction --routines --triggers --add-drop-database --databases {{ mysql_db_name }} \
      -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' -h {{ mysql_db_host }} \
      | gzip > {{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/db/{{ mysql_db_name }}.sql.gz
  args:
    executable: /bin/bash
  no_log: true
  when:
    - openspecimen_install_type == 'upgrade'
    - not (_plugins_only_change | default(false) or _config_only_change | default(false))
    - db_managed | default(true) | bool
    - db_type | default('mysql') == 'mysql'
    - db_backup_enabled | default(true) | bool
    - (_db_size_mb_val | default(0) | int) <= (db_backup_auto_max_mb | default(2048) | int)

# Remove orphan JARs before the backup mv, else the backup snapshots them and a
# rollback resurrects a plugin the operator just removed from inventory.
- name: Remove orphan plugin JARs from live dirs (no longer in inventory)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([])) }}"
  when: openspecimen_install_type == 'upgrade'

# Purge the orphan from EXISTING paid/zustomer backups too (licensing: a lapsed
# license must not survive in a backup a rollback could restore). All versions
# matched; plugins/default (open-source) and the WAR are left intact.
- name: Purge orphan paid/customer plugin JARs from existing backups (licensing compliance)
  ansible.builtin.shell: |
    set -e
    deleted=0
    for jar_path in {{ ((_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([]))) | map('quote') | join(' ') }}; do
      name=$(basename "$jar_path" | sed 's/-[^-]*\.jar$//')
      [ -n "$name" ] || continue
      while IFS= read -r match; do
        echo "purging: $match"
        rm -f "$match"
        deleted=$((deleted + 1))
      done < <(find {{ openspecimen_backup_dir }} \
                 \( -path "*/plugins/paid/${name}-*.jar" \
                 -o -path "*/plugins/zustomer/${name}-*.jar" \) \
                 -type f 2>/dev/null)
    done
    echo "total purged from backups: $deleted"
  args:
    executable: /bin/bash
  register: _orphan_backup_purge
  changed_when: _orphan_backup_purge.stdout is search('purging:')
  when:
    - openspecimen_install_type == 'upgrade'
    - ((_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([]))) | length > 0

- name: Backup plugins
  ansible.builtin.shell: |
    SRC="{{ openspecimen_plugin_dir }}"
    DEST="{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/plugins"
    ls "$SRC/default/"*.jar  2>/dev/null && mv "$SRC/default/"*.jar  "$DEST/default/"   || true
    ls "$SRC/paid/"*.jar     2>/dev/null && mv "$SRC/paid/"*.jar     "$DEST/paid/"      || true
    ls "$SRC/zustomer/"*.jar 2>/dev/null && mv "$SRC/zustomer/"*.jar "$DEST/zustomer/"  || true
    ls "$SRC/"*.jar          2>/dev/null && mv "$SRC/"*.jar          "$DEST/default/"   || true
  when:
    - openspecimen_install_type == 'upgrade'
    - not (_config_only_change | default(false))

# ── Backup config files and .release marker ──────────────────────────────────
# Captures the *exact* config the OLD WAR was running against, so rollback can
# restore them as a single unit (no separate site.yml run needed for config).

# openspecimen.properties handled via the slurp+separate-backup pair above.
# Probe only the files this loop's remote_src backup task actually copies.
- name: Probe config files for backup
  ansible.builtin.stat:
    path: "{{ item.src }}"
  loop:
    - { name: setenv.sh,               src: "{{ catalina_base }}/bin/setenv.sh" }
    - { name: context.xml,             src: "{{ catalina_base }}/conf/context.xml" }
  loop_control:
    label: "{{ item.name }}"
  register: _backup_config_probe
  when: openspecimen_install_type == 'upgrade'

# openspecimen.properties is handled separately because the Template task
# above has already overwritten the live file by this point. Use the slurped
# pre-template content instead, so the backup snapshots the OLD config.
- name: Backup openspecimen.properties (pre-template content)
  ansible.builtin.copy:
    content: "{{ _openspecimen_properties_pre_template.content | b64decode }}"
    dest:    "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/config/{{ openspecimen_war_name }}.properties"
    owner:   "{{ tomcat_user }}"
    group:   "{{ tomcat_user }}"
    mode:    '0640'
  when:
    - openspecimen_install_type == 'upgrade'
    - _openspecimen_properties_pre_template.content is defined

# setenv.sh / context.xml are templated only on fresh installs, so on an upgrade
# the live file is still the OLD one - remote_src copy captures it.
- name: Backup config files that exist (setenv.sh, context.xml)
  ansible.builtin.copy:
    src:        "{{ item.item.src }}"
    dest:       "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/config/{{ item.item.name }}"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0640'
  loop: "{{ _backup_config_probe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('(skipped)') }}"
  when:
    - openspecimen_install_type == 'upgrade'
    - item.stat is defined
    - item.stat.exists

- name: Probe previous .release marker for backup
  ansible.builtin.stat:
    path: "{{ openspecimen_release_marker }}"
  register: _backup_marker_probe
  when: openspecimen_install_type == 'upgrade'

- name: Backup previous .release marker
  ansible.builtin.copy:
    src:        "{{ openspecimen_release_marker }}"
    dest:       "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/.release"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0644'
  when:
    - openspecimen_install_type == 'upgrade'
    - _backup_marker_probe.stat is defined
    - _backup_marker_probe.stat.exists

# ── Deploy WAR ────────────────────────────────────────────────────────────────
# Skipped entirely on plugins-only - the existing webapps/openspecimen.war is
# already at the requested release.

- name: Deploy openspecimen.war
  block:
    - name: Extract openspecimen.war from release zip
      # The zip always contains openspecimen.war; deploy it under the instance's
      # context filename (webapps/<war_name>.war) so Tomcat serves it at the
      # matching context path (default openspecimen.war → /openspecimen).
      ansible.builtin.shell: |
        set -eo pipefail
        WAR=$(echo "{{ _zip_contents.stdout }}" \
          | awk 'NF==4 && $NF ~ /openspecimen\.war$/ {print $NF; exit}')
        if [ -z "$WAR" ]; then
          echo "ERROR: openspecimen.war not found in release zip"
          exit 1
        fi
        unzip -p /tmp/{{ openspecimen_release }}.zip "$WAR" \
          > {{ catalina_base }}/webapps/{{ openspecimen_war_name }}.war
      args:
        executable: /bin/bash
        creates: "{{ catalina_base }}/webapps/{{ openspecimen_war_name }}.war"
      notify: restart openspecimen
  rescue:
    - name: Fail with operator guidance for WAR extraction error
      ansible.builtin.fail:
        msg: |
          ✗ Could not extract openspecimen.war from the release zip.

          Release zip:    /tmp/{{ openspecimen_release }}.zip
          Target path:    {{ catalina_base }}/webapps/{{ openspecimen_war_name }}.war
          Customer:       {{ inventory_hostname }}

          What likely happened:
            - The release zip is missing openspecimen.war (corrupt / wrong zip), OR
            - The Tomcat webapps directory is not writable, OR
            - Disk is full.

          What to check:
            1. Inspect zip contents on Jenkins VM:
                 unzip -l {{ openspecimen_zip_path | expanduser }} | grep openspecimen.war

            2. Check disk space on target:
                 df -h {{ tomcat_home }}

            3. Verify Tomcat is installed and the webapps dir exists:
                 ls -la {{ catalina_base }}/webapps/
  when: not (_plugins_only_change | default(false) or _config_only_change | default(false))

- name: Set WAR ownership
  ansible.builtin.file:
    path: "{{ catalina_base }}/webapps/{{ openspecimen_war_name }}.war"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'
  when: not (_plugins_only_change | default(false) or _config_only_change | default(false))

# ── Deploy plugins ────────────────────────────────────────────────────────────

- name: Extract default plugin JARs from release zip
  block:
    - name: Locate and extract plugin_build/*.jar
      ansible.builtin.shell: |
        set -eo pipefail
        PLUGIN_DIR=$(echo "{{ _zip_contents.stdout }}" \
          | awk 'NF==4 && $NF ~ /plugin_build\/.+\.jar$/ {sub("/[^/]+$","", $NF); print $NF; exit}')
        if [ -z "$PLUGIN_DIR" ]; then
          echo "ERROR: plugin_build/*.jar not found in release zip"
          exit 1
        fi
        unzip -jo /tmp/{{ openspecimen_release }}.zip "${PLUGIN_DIR}/*.jar" \
          -d {{ openspecimen_plugin_dir }}/default/
      args:
        executable: /bin/bash
      register: _plugin_extract
      changed_when: _plugin_extract.stdout is search('inflating:|extracting:')
  rescue:
    - name: Fail with operator guidance for default plugin extraction
      ansible.builtin.fail:
        msg: |
          ✗ Could not extract default plugins from the release zip.

          Release zip: /tmp/{{ openspecimen_release }}.zip
          Expected:    plugin_build/*.jar inside the zip

          What likely happened:
            - The release zip does not contain a plugin_build/ directory with JARs
              (wrong build, incomplete package, or this release truly has no default plugins).

          What to check:
            1. List plugin files in the zip (on Jenkins VM):
                 unzip -l {{ openspecimen_zip_path | expanduser }} | grep -E 'plugin_build/.+\.jar'

            2. Confirm with the build/release team this zip is the correct artifact.
  # Default plugins are tied to the WAR release - on plugins-only deploys the
  # WAR is unchanged so the existing default JARs are already correct.
  when: not (_plugins_only_change | default(false) or _config_only_change | default(false))

# ── Master builds: tier the bundled plugins ───────────────────────────────────
# A master zip ships every plugin as a JAR in plugin_build/, so the step above
# extracted them all into plugins/default/. There is no separate <name>-<version>.zip
# for master, so move the named paid/customer plugins out of default/ into their own
# tier (backup/licensing separation; a move, so the JAR is never loaded twice).
- name: Flag a master release for this instance
  ansible.builtin.set_fact:
    _os_is_master: "{{ openspecimen_release is match('openspecimen_master') }}"

- name: Tier bundled master paid plugins into paid/
  # PLUGIN / PLUGIN_DIR come via environment, and the body avoids bash arrays -
  # both an inlined {{ item }} in a quoted glob AND `arr=(...)` / ${arr[@]} trip
  # Ansible's split_args on the free-form command.
  ansible.builtin.shell: |
    set -eo pipefail
    moved=0
    for j in "$PLUGIN_DIR/default/$PLUGIN-"[0-9]*.jar "$PLUGIN_DIR/default/$PLUGIN.jar"; do
      if [ -f "$j" ]; then mv -f "$j" "$PLUGIN_DIR/paid/"; moved=1; fi
    done
    if [ "$moved" = 1 ]; then
      echo CHANGED
    elif ls "$PLUGIN_DIR/paid/$PLUGIN-"[0-9]*.jar >/dev/null 2>&1 || [ -f "$PLUGIN_DIR/paid/$PLUGIN.jar" ]; then
      echo "already tiered"
    else
      echo "WARN: paid plugin $PLUGIN not in the master bundle - use a full deploy to add it"
    fi
  args:
    executable: /bin/bash
  environment:
    PLUGIN_DIR: "{{ openspecimen_plugin_dir }}"
    PLUGIN: "{{ item }}"
  loop: "{{ openspecimen_paid_plugins | default([]) }}"
  register: _master_paid_tier
  changed_when: "'CHANGED' in _master_paid_tier.stdout"
  when:
    - _os_is_master | bool
    - not (_config_only_change | default(false))
  notify: restart openspecimen

- name: Tier bundled master customer plugins into zustomer/
  # See the paid task above (environment vars + no bash arrays, to satisfy split_args).
  ansible.builtin.shell: |
    set -eo pipefail
    moved=0
    for j in "$PLUGIN_DIR/default/$PLUGIN-"[0-9]*.jar "$PLUGIN_DIR/default/$PLUGIN.jar"; do
      if [ -f "$j" ]; then mv -f "$j" "$PLUGIN_DIR/zustomer/"; moved=1; fi
    done
    if [ "$moved" = 1 ]; then
      echo CHANGED
    elif ls "$PLUGIN_DIR/zustomer/$PLUGIN-"[0-9]*.jar >/dev/null 2>&1 || [ -f "$PLUGIN_DIR/zustomer/$PLUGIN.jar" ]; then
      echo "already tiered"
    else
      echo "WARN: customer plugin $PLUGIN not in the master bundle - use a full deploy to add it"
    fi
  args:
    executable: /bin/bash
  environment:
    PLUGIN_DIR: "{{ openspecimen_plugin_dir }}"
    PLUGIN: "{{ item }}"
  loop: "{{ openspecimen_customer_plugins | default([]) }}"
  register: _master_cust_tier
  changed_when: "'CHANGED' in _master_cust_tier.stdout"
  when:
    - _os_is_master | bool
    - not (_config_only_change | default(false))
  notify: restart openspecimen

# ── Deploy additional plugin zips (pinned releases: separate <name>-<version>.zip) ─
# Pre-flight already searched recursively under openspecimen_builds_dir and stored
# results in _preflight_paid_find / _preflight_customer_find. Reuse those here.
# For a master build these all self-skip (pre-flight found no separate zips →
# matched=0), so the loops are no-ops and the tiering above applies instead.

# Paid + customer plugin upload/extract: skipped on config-only fast path
# (no plugin drift - extracting them again would just rewrite identical JARs).
# Still runs on plugins-only and full deploy.
- name: Upload paid plugin zips to target
  ansible.builtin.copy:
    src:  "{{ item.files[0].path }}"
    dest: "/tmp/{{ item.files[0].path | basename }}"
    mode: '0644'
  loop: "{{ _preflight_paid_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))

- name: Extract JARs from paid plugin zips
  ansible.builtin.shell: |
    set -eo pipefail
    OUTPUT=$(unzip -jo "/tmp/{{ item.files[0].path | basename }}" "*.jar" \
      -d {{ openspecimen_plugin_dir }}/paid/ 2>&1) || { echo "$OUTPUT"; exit 1; }
    if ! echo "$OUTPUT" | grep -qE 'inflating:|extracting:'; then
      echo "ERROR: no .jar files inside paid plugin zip {{ item.files[0].path | basename }}"
      exit 2
    fi
    echo "$OUTPUT"
  args:
    executable: /bin/bash
  loop: "{{ _preflight_paid_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))
  register: _paid_plugin_extract
  changed_when: _paid_plugin_extract.stdout is search('inflating:|extracting:')
  failed_when: _paid_plugin_extract.rc | default(0) != 0

- name: Show operator guidance if a paid plugin zip had no JARs
  ansible.builtin.fail:
    msg: |
      ✗ Paid plugin zip {{ item.item.item }} contained no .jar files.

      Zip:       {{ item.item.files[0].path }}
      Plugin:    {{ item.item.item }}
      Customer:  {{ inventory_hostname }}

      What to do:
        - Inspect the zip on Jenkins VM:
            unzip -l {{ item.item.files[0].path }}
        - Re-package the plugin so the .jar is at the top level (or any level).
        - Or remove "{{ item.item.item }}" from openspecimen_paid_plugins in inventory.
  loop: "{{ _paid_plugin_extract.results | default([]) }}"
  when:
    - item.skipped is not defined
    - item.rc | default(0) == 2

- name: Remove paid plugin zips from target
  ansible.builtin.file:
    path: "/tmp/{{ item.files[0].path | basename }}"
    state: absent
  loop: "{{ _preflight_paid_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))

- name: Upload customer plugin zips to target
  ansible.builtin.copy:
    src:  "{{ item.files[0].path }}"
    dest: "/tmp/{{ item.files[0].path | basename }}"
    mode: '0644'
  loop: "{{ _preflight_customer_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))

- name: Extract JARs from customer plugin zips
  ansible.builtin.shell: |
    set -eo pipefail
    OUTPUT=$(unzip -jo "/tmp/{{ item.files[0].path | basename }}" "*.jar" \
      -d {{ openspecimen_plugin_dir }}/zustomer/ 2>&1) || { echo "$OUTPUT"; exit 1; }
    if ! echo "$OUTPUT" | grep -qE 'inflating:|extracting:'; then
      echo "ERROR: no .jar files inside customer plugin zip {{ item.files[0].path | basename }}"
      exit 2
    fi
    echo "$OUTPUT"
  args:
    executable: /bin/bash
  loop: "{{ _preflight_customer_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))
  register: _customer_plugin_extract
  changed_when: _customer_plugin_extract.stdout is search('inflating:|extracting:')
  failed_when: _customer_plugin_extract.rc | default(0) != 0

- name: Show operator guidance if a customer plugin zip had no JARs
  ansible.builtin.fail:
    msg: |
      ✗ Customer plugin zip {{ item.item.item }} contained no .jar files.

      Zip:       {{ item.item.files[0].path }}
      Plugin:    {{ item.item.item }}
      Customer:  {{ inventory_hostname }}

      What to do:
        - Inspect the zip on Jenkins VM:
            unzip -l {{ item.item.files[0].path }}
        - Re-package the plugin so the .jar is at the top level (or any level).
        - Or remove "{{ item.item.item }}" from openspecimen_customer_plugins in inventory.
  loop: "{{ _customer_plugin_extract.results | default([]) }}"
  when:
    - item.skipped is not defined
    - item.rc | default(0) == 2

- name: Remove customer plugin zips from target
  ansible.builtin.file:
    path: "/tmp/{{ item.files[0].path | basename }}"
    state: absent
  loop: "{{ _preflight_customer_find.results }}"
  when:
    - item.matched > 0
    - not (_config_only_change | default(false))

- name: Set plugin ownership
  ansible.builtin.file:
    path: "{{ openspecimen_plugin_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    recurse: true

# ── Clean up ──────────────────────────────────────────────────────────────────

- name: Remove release zip from target
  ansible.builtin.file:
    path: "/tmp/{{ openspecimen_release }}.zip"
    state: absent

# ── Prune old backups ────────────────────────────────────────────────────────
# Backup RETENTION is deliberately NOT applied here. The pre-upgrade backup was
# just taken above; pruning older backups mid-deploy would destroy rollback history
# before the new version is proven good. Retention runs at the very end of a
# SUCCESSFUL deploy - after the readiness gate AND the public-URL verify - in
# tasks/deploy-instance.yml. A failed deploy hits the rescue/auto-rollback instead
# and keeps every existing backup.

# ── Release stale Liquibase lock ──────────────────────────────────────────────
# OpenSpecimen runs Liquibase at boot, taking a row-lock in DATABASECHANGELOGLOCK.
# If a previous start was killed mid-migration (e.g. an aborted deploy), the lock
# stays LOCKED=1 and the next boot waits on it ~5 min then fails
# "Context [/openspecimen] startup failed". The service is stopped at this point,
# so nothing legitimately holds the lock - release a stale one. MySQL only.
# Best-effort (failed_when: false): tolerates the table not existing yet (fresh
# install) and the "password on the command line" warning without aborting; if it
# cannot clear the lock for any reason, the fail-fast readiness check below
# surfaces the resulting startup failure within seconds, with full diagnostics.
- name: Release stale Liquibase changelog lock (MySQL)
  ansible.builtin.shell: |
    mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
      -h {{ mysql_db_host }} {{ mysql_db_name }} \
      -sNe "UPDATE DATABASECHANGELOGLOCK SET LOCKED=0, LOCKGRANTED=NULL, LOCKEDBY=NULL WHERE LOCKED=1;"
  register: _liquibase_lock_clear
  changed_when: false
  failed_when: false
  no_log: true
  # db_managed=false: skip - we never write to an externally-managed DB. A stale
  # lock on an external DB is the DB owner's responsibility (REVISIT).
  when:
    - (db_type | default('mysql')) == 'mysql'
    - db_managed | default(true) | bool

# ── Start service ─────────────────────────────────────────────────────────────

# Truncate catalina.out first so the startup wait below only ever matches THIS
# run's "Server startup in" line. catalina.out is append-only and survives a
# (non-full-wipe) cleanup, so a stale line from a previous deploy could otherwise
# satisfy the wait before the app has actually started.
- name: Truncate catalina.out before (re)start
  ansible.builtin.copy:
    dest: "{{ catalina_base }}/logs/catalina.out"
    content: ""
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'
  changed_when: false

- name: Start and enable openspecimen service
  ansible.builtin.systemd:
    name: "{{ openspecimen_service_name | default('openspecimen') }}"
    state: started
    enabled: true
    daemon_reload: true

# ── Wait for app to be ready ──────────────────────────────────────────────────
# Phase 1: wait until catalina.out logs "Server startup in" AFTER the service's
#   last activation timestamp (append-only log, so the timestamp filter avoids a
#   stale match from the previous run).
# Phase 2 (opt-in): if app_url is set, curl it from the control node (real network
#   path, not a loopback) to confirm the front-end is live.

- name: Wait for Tomcat startup completion
  block:
    - name: Wait for service active and startup in catalina.out since last activation
      # Service / catalina_base / lookback come via environment so the Python body
      # has NO Jinja - inline {{ }} in a shell body can trip Ansible's split_args.
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import subprocess, datetime, re, sys, os
        result = subprocess.run(
            ['systemctl', 'show', os.environ['OS_SERVICE'], '-p', 'ActiveEnterTimestamp', '--value'],
            capture_output=True, text=True)
        # Strip microseconds then the timezone word (systemd + Tomcat share the local
        # clock; strptime('%Z') only parses UTC/GMT reliably).
        ts_str = re.sub(r'(\d{2}:\d{2}:\d{2})\.\d+', r'\1', result.stdout.strip())
        ts_str = re.sub(r'\s\S+$', '', ts_str)
        if not ts_str:
            sys.exit(1)
        try:
            svc_start = datetime.datetime.strptime(ts_str, '%a %Y-%m-%d %H:%M:%S')
        except ValueError:
            sys.exit(1)
        # Bound the scan to the last OS_LOOKBACK_MIN minutes so a stale service-start
        # timestamp does not sweep in unrelated old errors.
        cutoff = max(svc_start, datetime.datetime.now()
                     - datetime.timedelta(minutes=int(os.environ['OS_LOOKBACK_MIN'])))
        log_re = re.compile(r'^(\d{2}-\w{3}-\d{4} \d{2}:\d{2}:\d{2})\.')
        # Fail-fast markers: Tomcat logs one when the webapp context aborts, so we
        # fail in seconds (rc 2) instead of spinning the full retry window.
        fail_markers = ('One or more listeners failed to start',
                        'startup failed due to previous errors')
        try:
            with open(os.environ['OS_CATALINA_BASE'] + '/logs/catalina.out') as f:
                for line in f:
                    m = log_re.match(line)
                    if not m:
                        continue
                    try:
                        log_ts = datetime.datetime.strptime(m.group(1), '%d-%b-%Y %H:%M:%S')
                    except ValueError:
                        continue
                    if log_ts < cutoff:
                        continue
                    if 'Server startup in' in line:
                        sys.exit(0)
                    if any(marker in line for marker in fail_markers):
                        sys.exit(2)
        except FileNotFoundError:
            pass
        sys.exit(1)
        PYEOF
      environment:
        OS_SERVICE: "{{ openspecimen_service_name | default('openspecimen') }}"
        OS_CATALINA_BASE: "{{ catalina_base }}"
        OS_LOOKBACK_MIN: "{{ openspecimen_health_lookback_min | default(20) }}"
      become: true
      register: health_check
      # rc 0 = started, rc 2 = startup failed (abort), rc 1 = still starting (retry).
      until: health_check.rc != 1
      failed_when: health_check.rc == 2
      retries: 90
      delay: 10
      changed_when: false
  rescue:
    - name: Show service status on failure
      ansible.builtin.shell: systemctl status {{ openspecimen_service_name | default('openspecimen') }} --no-pager -l 2>&1 || true
      become: true
      register: _service_status
      changed_when: false

    - name: Print service status
      ansible.builtin.debug:
        var: _service_status.stdout_lines

    # Liquibase logs the failing changeset and its Reason just before the generic
    # Tomcat listeners-failed message. Surface that trail explicitly: the plain
    # tail below is often crowded out by the manager/ROOT/docs webapp deploys that
    # Tomcat runs AFTER the app context has already failed.
    - name: Extract migration / startup failure trail from catalina.out
      ansible.builtin.shell: |
        set -o pipefail
        LOG="$OS_CATALINA_BASE/logs/catalina.out"
        [ -f "$LOG" ] || { echo "(catalina.out not found)"; exit 0; }
        grep -nE 'Running Changeset|Migration failed|liquibase\.exception|Failed SQL|Reason:|Caused by:|One or more listeners failed|startup failed due to previous' "$LOG" \
          | tail -40 || true
      args:
        executable: /bin/bash
      environment:
        OS_CATALINA_BASE: "{{ catalina_base }}"
      become: true
      register: _migration_trail
      changed_when: false

    - name: Print migration / startup failure trail
      ansible.builtin.debug:
        var: _migration_trail.stdout_lines

    - name: Tail catalina.out for diagnostics
      ansible.builtin.shell: "tail -100 {{ catalina_base }}/logs/catalina.out 2>&1 || echo '(catalina.out not found)'"
      become: true
      register: _catalina_tail
      changed_when: false

    - name: Print catalina.out
      ansible.builtin.debug:
        var: _catalina_tail.stdout_lines

    # The OpenSpecimen application log(s) (data/logs/*os*.log) are written by the
    # app itself, separately from Tomcat's catalina.out - an ERROR/Exception raised
    # inside the app (as opposed to a Tomcat-level listener/deploy failure) can show
    # up here with more detail than catalina.out carries. Pull it as a second
    # diagnostic source whenever a startup failure was already detected above, not
    # as a replacement for the catalina.out checks. Globs *os*.log rather than a
    # fixed os.<instance>.log name - the app can name its log after the node rather
    # than the instance (HA), so a fixed name risks silently matching nothing.
    # OS_DATA_DIR comes via environment, and the body avoids bash arrays - same as
    # the paid/customer plugin-tiering tasks above (environment vars + no bash
    # arrays, to satisfy split_args): an inlined {{ }} AND `arr=(...)`/${arr[@]}
    # each independently trip Ansible's split_args on the free-form command.
    - name: Extract failure trail from the OpenSpecimen app log(s)
      ansible.builtin.shell: |
        set -o pipefail
        if ! ls "$OS_DATA_DIR"/logs/*os*.log >/dev/null 2>&1; then
          echo "(no $OS_DATA_DIR/logs/*os*.log files found)"
          exit 0
        fi
        for f in "$OS_DATA_DIR"/logs/*os*.log; do
          grep -nH -E 'ERROR|Exception|Caused by:|Migration failed|liquibase\.exception' "$f" || true
        done | tail -40
      args:
        executable: /bin/bash
      environment:
        OS_DATA_DIR: "{{ openspecimen_data_dir }}"
      become: true
      register: _app_log_trail
      changed_when: false

    - name: Print OpenSpecimen app log failure trail
      ansible.builtin.debug:
        var: _app_log_trail.stdout_lines

    # The trails/tail above cover the common failure shapes, but a failure that
    # doesn't match any of those grep patterns needs the whole file. Fetched onto
    # the control node (deploy_report_dir) so the CI email can attach the complete
    # files, not just excerpts - a separate (non-dot-prefixed) naming scheme from
    # .failure-diagnostics-*.txt/.component-versions-*.json on purpose: those are
    # read back as text and round-tripped through a JSON env var across the CI
    # caller's workspace-clean step, whereas these are real files handed to that
    # same caller via its own native stash/unstash (too large/binary-unsafe for
    # the JSON round-trip) - two different hand-off mechanisms, so two different
    # naming families. Same per-instance-only disambiguation caveat as
    # .failure-diagnostics-*.txt above: a multi-host run sharing the default
    # instance name ('openspecimen') would collide in deploy_report_dir - an
    # existing, accepted limitation of that mechanism, not introduced here.
    - name: Fetch full failure log files for the CI email
      when: deploy_report_dir | default('') | trim | length > 0
      become: true
      block:
        # failed_when: false - catalina.out may legitimately not exist yet (very
        # early startup failure); this must never mask the real failure below.
        # No size cap (full file, as-is): catalina.out is truncated immediately
        # before every service (re)start (see "Truncate catalina.out before
        # (re)start" above), so this is naturally bounded to one deploy attempt,
        # not the instance's entire lifetime.
        - name: Fetch full catalina.out for the CI email
          ansible.builtin.fetch:
            src: "{{ catalina_base }}/logs/catalina.out"
            dest: "{{ deploy_report_dir }}/catalina-{{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}.out"
            flat: true
          failed_when: false
          changed_when: false

        # Enumerated first (rather than fetching a glob directly - fetch takes a
        # single src) so each matched file can be fetched individually below.
        # Same *os*.log glob rationale as the trail extraction above (app can
        # name its log after the node, not the instance, under HA).
        - name: Find OpenSpecimen app log files for the CI email
          ansible.builtin.find:
            paths: "{{ openspecimen_data_dir }}/logs"
            patterns: "*os*.log"
          register: _app_log_files
          failed_when: false

        # No size cap here either (full file, as-is, unlike catalina.out this has
        # no truncate-on-restart equivalent in this role) - deliberate: fidelity
        # over a bounded transfer, for the rare failure-diagnosis path this is.
        - name: Fetch full OpenSpecimen app log(s) for the CI email
          ansible.builtin.fetch:
            src: "{{ item.path }}"
            dest: "{{ deploy_report_dir }}/os-{{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}-{{ item.path | basename }}"
            flat: true
          loop: "{{ _app_log_files.files | default([]) }}"
          loop_control:
            label: "{{ item.path | basename }}"
          failed_when: false
          changed_when: false

    # Written on the control node into deploy_report_dir when the caller passes it
    # (no-op for CLI runs) - same mechanism as .component-versions-*.json above, so
    # the CI (Jenkins) email can attach the failure trail instead of it only being
    # visible in the console log. Named per instance (email globs
    # .failure-diagnostics-*.txt) so a multi-instance run's failures don't overwrite
    # each other.
    - name: Record failure diagnostics for the CI email
      ansible.builtin.copy:
        content: |
          Customer:  {{ inventory_hostname }}
          Instance:  {{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}
          Release:   {{ openspecimen_release }}
          Service:   {{ openspecimen_service_name | default('openspecimen') }} ({{ catalina_base }})

          === Migration / startup failure trail (catalina.out) ===
          {{ _migration_trail.stdout | default('(none)', true) }}

          === OpenSpecimen app log failure trail (data/logs/*os*.log) ===
          {{ _app_log_trail.stdout | default('(none)', true) }}

          === Last 100 catalina.out lines ===
          {{ _catalina_tail.stdout | default('(none)', true) }}

          (Full catalina.out and app log file(s) are attached separately, if fetched successfully.)
        dest: "{{ deploy_report_dir }}/.failure-diagnostics-{{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}.txt"
        mode: '0644'
      delegate_to: localhost
      become: false
      changed_when: false
      when: deploy_report_dir | default('') | trim | length > 0

    - name: Fail after diagnostics
      ansible.builtin.fail:
        msg: |
          ✗ OpenSpecimen failed to start (a startup failure was logged, or it did
            not finish within {{ (90 * 10 / 60) | int }} minutes).

          Customer:  {{ inventory_hostname }}
          Release:   {{ openspecimen_release }}
          Service:   {{ openspecimen_service_name | default('openspecimen') }} ({{ catalina_base }})

          What likely happened (most common):
            1. Database migration failure (Liquibase)
               → search catalina.out above for 'liquibase' or 'ChangeLog'
               → check RDS parameter group: lower_case_table_names=1, utf8 (NOT utf8mb4)

            2. Database connection failure at startup
               → search catalina.out for 'Could not get JDBC Connection' or 'Communications link failure'
               → verify mysql_db_host and mysql_db_password

            3. Out of memory / heap dump
               → check {{ openspecimen_data_dir }}/heapdumps/
               → increase tomcat_heap_max_override (MB)

            4. Port {{ openspecimen_port }} already in use
               → ss -tlnp | grep {{ openspecimen_port }}  (on target)

            5. WAR deployment failed at Tomcat layer
               → check {{ catalina_base }}/logs/localhost.*.log

          Diagnostics:
            - Full service status: shown above
            - Last 100 catalina.out lines: shown above
            - App log failure trail (data/logs/*os*.log): shown above
            - Full log:  sudo journalctl -u {{ openspecimen_service_name | default('openspecimen') }} --since '{{ openspecimen_health_lookback_min | default(20) }} min ago'

# Phase 2 (external public-URL reachability) is intentionally NOT here. It now
# runs as a post_task in site.yml (roles/openspecimen/tasks/
# verify-public-url.yml) so it executes AFTER the apache front-end proxy is
# configured - otherwise it would check the URL before the proxy that serves it.

- name: Deployment complete
  ansible.builtin.debug:
    msg: >-
      {% if openspecimen_install_type == 'fresh' %}
      Fresh install complete - {{ openspecimen_release }}
      {% else %}
      Upgrade complete - {{ _installed_release | default('unknown') }} → {{ openspecimen_release }}
      {% endif %}
      | IP: {{ ansible_facts['default_ipv4']['address'] }}

- name: Record deployed release version
  ansible.builtin.copy:
    content: "{{ openspecimen_release }}\n"
    dest: "{{ openspecimen_release_marker }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'

# Deploy record + success flag, written ONLY here as the last step of the deploy.
# direction.yml's skip-if-current reads the `release:` line (regex) and short-
# circuits a re-deploy when it matches the requested release (so the zip is never
# re-copied for an already-installed release). A run that fails before this point
# leaves the file stale and the next run does a full deploy automatically.
- name: Record successful deploy (host-side deploy details)
  ansible.builtin.copy:
    content: |
      release: {{ openspecimen_release }}
      instance: {{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}
      service: {{ openspecimen_service_name | default('openspecimen') }}
      node_name: {{ openspecimen_node_name | default('openspecimen') }}
      tomcat: {{ os_versions.tomcat | default('') }}
      java: {{ os_versions.java.track | default('') }}
      java_build: {{ openspecimen_java_build | default('') }}
      app_url: {{ openspecimen_app_url | default('') }}
      context_path: {{ openspecimen_context_path | default('/openspecimen') }}
      http_port: {{ openspecimen_port }}
      ajp_port: {{ openspecimen_ajp_port | default('') }}
      catalina_base: {{ catalina_base }}
      db_name: {{ mysql_db_name }}
      db_host: {{ mysql_db_host }}
      db_managed: {{ db_managed | default(true) }}
      paid_plugins: {{ openspecimen_paid_plugins | default([]) | to_json }}
      customer_plugins: {{ openspecimen_customer_plugins | default([]) | to_json }}
      install_type: {{ openspecimen_install_type | default('unknown') }}
      timestamp: {{ ansible_date_time.iso8601 | default('') }}
    dest: "{{ openspecimen_deploy_success_marker }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'
