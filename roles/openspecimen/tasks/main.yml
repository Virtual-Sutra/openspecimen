---
# ── Prior version check ───────────────────────────────────────────────────────
# site.yml: common role already ran this and set _version_check_done=true.
# deploy.yml: common does not run, so include_role runs the check here.

- name: Prior version check
  ansible.builtin.include_role:
    name: common
    tasks_from: version_check
  when: not (_version_check_done | default(false))

# Pre-flight artifact / inventory check ran as a pre_task in site.yml / deploy.yml.
# It populated _preflight_plugin_version, _preflight_paid_find, and
# _preflight_customer_find which the plugin deploy tasks below reuse.

# ── Detect install type ───────────────────────────────────────────────────────
# Checks the database, not the WAR. A WAR on disk with an empty DB (e.g. after
# DB reset) must be treated as fresh — using upgrade mode on an empty DB skips
# core schema creation and causes Liquibase FK failures.
# Override with: -e openspecimen_install_type=fresh|upgrade

- name: Check for existing OpenSpecimen schema in database
  block:
    - name: Probe MySQL connectivity and query schema
      ansible.builtin.shell: |
        mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
          -h {{ mysql_db_host }} {{ mysql_db_name }} \
          -sNe "SELECT COUNT(*) FROM information_schema.tables
                WHERE table_schema='{{ mysql_db_name }}'
                AND table_name='CATISSUE_SITE';"
      register: _schema_check
      changed_when: false
      no_log: true
  rescue:
    - name: Re-run query without no_log to capture the error code
      ansible.builtin.shell: |
        mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
          -h {{ mysql_db_host }} {{ mysql_db_name }} \
          -e "SELECT 1;" 2>&1 | grep -v 'password on the command line'
      register: _mysql_error
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail with operator guidance for DB connection error
      ansible.builtin.fail:
        msg: |
          ✗ Could not connect to the MySQL database.

          Host:     {{ mysql_db_host }}
          Database: {{ mysql_db_name }}
          User:     {{ mysql_db_user }}
          Customer: {{ inventory_hostname }}

          Error from MySQL:
            {{ _mysql_error.stdout | default('(no output)') }}

          What to check:
            1. Is mysql_db_password correct?
               - For Jenkins runs, it comes from secrets/{{ inventory_hostname }}.yml (vault-encrypted).
               - Re-encrypt with: ansible-vault rekey secrets/{{ inventory_hostname }}.yml

            2. Is the database host reachable from this VM?
               Run on the target ({{ inventory_hostname }}):
                 mysqladmin -h {{ mysql_db_host }} -u {{ mysql_db_user }} -p ping

            3. Does the database '{{ mysql_db_name }}' exist?
               If not (fresh install), MySQL role usually creates it. Verify db_managed setting:
                 db_managed = {{ db_managed | default('(not set)') }}

            4. For RDS — is the security group allowing this VM's IP on port 3306?

          Common fixes:
            - Wrong password    → update secrets/{{ inventory_hostname }}.yml
            - Wrong RDS host    → update mysql_db_host in inventory/host_vars/{{ inventory_hostname }}.yml
            - Missing DB        → check db_managed is true so MySQL role creates the schema

- name: Set install type
  ansible.builtin.set_fact:
    openspecimen_install_type: "{{ 'upgrade' if (_schema_check.stdout | trim) == '1' else 'fresh' }}"
  when: openspecimen_install_type is not defined

- name: Log deployment plan
  ansible.builtin.debug:
    msg: >-
      {% if openspecimen_install_type == 'fresh' %}
      Fresh install — deploying {{ openspecimen_release }}
      {% elif _installed_release | default('') %}
      Upgrade — installed: {{ _installed_release }} → requesting: {{ openspecimen_release }}
      {% else %}
      Upgrade — no prior release marker found → requesting: {{ openspecimen_release }}
      {% endif %}

# ── Ensure release zip is on target ──────────────────────────────────────────
# deploy.yml (upgrade) runs only this role — upload if not already present.

- name: Upload release zip to target (if not already present)
  ansible.builtin.copy:
    src:  "{{ openspecimen_zip_path | expanduser }}"
    dest: "/tmp/{{ openspecimen_release }}.zip"
    mode: '0644'
  args:
    creates: "/tmp/{{ openspecimen_release }}.zip"
  when: not (_plugins_only_change | default(false))

# ── Cache zip contents listing ────────────────────────────────────────────────
# Listed once here; reused for WAR and plugin extraction below.
# When site.yml runs, tomcat role may have already set _zip_contents.
# Skipped on plugins-only — no WAR or default-plugin extraction will run.

- name: Cache release zip contents
  ansible.builtin.shell: unzip -l /tmp/{{ openspecimen_release }}.zip
  register: _zip_contents
  changed_when: false
  when: not (_plugins_only_change | default(false))

# ── Create required directories ───────────────────────────────────────────────
# Plugin subdirectory structure matches install.sh:
#   default/   — common plugins from release zip
#   paid/      — paid enterprise plugins
#   zustomer/  — customer-specific plugins

- name: Create data, plugin and backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'
  loop:
    - "{{ openspecimen_data_dir }}"
    - "{{ openspecimen_plugin_dir }}"
    - "{{ openspecimen_plugin_dir }}/default"
    - "{{ openspecimen_plugin_dir }}/paid"
    - "{{ openspecimen_plugin_dir }}/zustomer"
    - "{{ openspecimen_backup_dir }}"
    - "{{ openspecimen_backup_dir }}/config-changes"
    - "{{ openspecimen_data_dir }}/heapdumps"
    - /usr/local/openspecimen/scripts

- name: Deploy update-config.sh operator script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/update-config.sh"
    dest: /usr/local/openspecimen/scripts/update-config.sh
    owner: root
    group: root
    mode: '0750'

# ── openspecimen.properties ───────────────────────────────────────────────────

- name: Template openspecimen.properties
  ansible.builtin.template:
    src: openspecimen.properties.j2
    dest: "{{ tomcat_home }}/conf/openspecimen.properties"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0640'

# ── Backup WAR and plugins on upgrade ────────────────────────────────────────

- name: Get backup timestamp
  ansible.builtin.command: date '+%d%m%Y_%H%M%S'
  register: backup_ts
  changed_when: false
  when: openspecimen_install_type == 'upgrade'

- name: Stop service for upgrade backup
  ansible.builtin.systemd:
    name: openspecimen
    state: stopped
  when: openspecimen_install_type == 'upgrade'

# On plugins-only deploys, deliberately omit plugins/default from the backup
# tree. Rollback (rollback.yml line 274) wipes a live plugin tier only if the
# corresponding backup tier exists — an empty plugins/default/ in this backup
# would cause a future rollback to that timestamp to wipe live default plugins
# (which are tied to the WAR and aren't changing here). Skipping the directory
# also makes the `Backup plugins` mv into default/ safely no-op (no dest dir),
# keeping the live default JARs in place.
- name: Create backup directory structure
  ansible.builtin.file:
    path: "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0755'
  loop: "{{ ['plugins/paid', 'plugins/zustomer', 'config'] + (['plugins/default'] if not (_plugins_only_change | default(false)) else []) }}"
  when: openspecimen_install_type == 'upgrade'

- name: Backup old WAR
  ansible.builtin.shell: |
    WEBAPPS="{{ tomcat_home }}/webapps"
    DEST="{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}"
    if [ -f "$WEBAPPS/openspecimen.war" ]; then
      mv "$WEBAPPS/openspecimen.war" "$DEST/"
      rm -rf "$WEBAPPS/openspecimen"
    fi
  when:
    - openspecimen_install_type == 'upgrade'
    - not (_plugins_only_change | default(false))

# Remove orphan plugin JARs BEFORE the backup mv — without this, the backup
# would snapshot the orphan and a rollback to that timestamp would resurrect
# the plugin the operator just removed from inventory.
- name: Remove orphan plugin JARs from live dirs (no longer in inventory)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([])) }}"
  when: openspecimen_install_type == 'upgrade'

# Also purge the orphan from EXISTING backups under paid/ and zustomer/. The
# rationale is licensing: paid + customer plugins ride on contractual entitlements,
# so a lapsed license must not survive in a backup that a future rollback could
# restore. Scoped strictly to plugins/paid/ and plugins/zustomer/ — plugins/default/
# (open-source, from the release zip) is left intact, as is the WAR.
# Matches every version of the orphan plugin (e.g. os-hl7-v12.1.jar,
# os-hl7-v12.2.RC8.jar) so backups taken under prior releases are also cleaned.
- name: Purge orphan paid/customer plugin JARs from existing backups (licensing compliance)
  ansible.builtin.shell: |
    set -e
    deleted=0
    for jar_path in {{ ((_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([]))) | map('quote') | join(' ') }}; do
      name=$(basename "$jar_path" | sed 's/-[^-]*\.jar$//')
      [ -n "$name" ] || continue
      while IFS= read -r match; do
        echo "purging: $match"
        rm -f "$match"
        deleted=$((deleted + 1))
      done < <(find {{ openspecimen_backup_dir }} \
                 \( -path "*/plugins/paid/${name}-*.jar" \
                 -o -path "*/plugins/zustomer/${name}-*.jar" \) \
                 -type f 2>/dev/null)
    done
    echo "total purged from backups: $deleted"
  args:
    executable: /bin/bash
  register: _orphan_backup_purge
  changed_when: _orphan_backup_purge.stdout is search('purging:')
  when:
    - openspecimen_install_type == 'upgrade'
    - ((_orphan_paid_jars.stdout_lines | default([])) + (_orphan_customer_jars.stdout_lines | default([]))) | length > 0

- name: Backup plugins
  ansible.builtin.shell: |
    SRC="{{ openspecimen_plugin_dir }}"
    DEST="{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/plugins"
    ls "$SRC/default/"*.jar  2>/dev/null && mv "$SRC/default/"*.jar  "$DEST/default/"   || true
    ls "$SRC/paid/"*.jar     2>/dev/null && mv "$SRC/paid/"*.jar     "$DEST/paid/"      || true
    ls "$SRC/zustomer/"*.jar 2>/dev/null && mv "$SRC/zustomer/"*.jar "$DEST/zustomer/"  || true
    ls "$SRC/"*.jar          2>/dev/null && mv "$SRC/"*.jar          "$DEST/default/"   || true
  when: openspecimen_install_type == 'upgrade'

# ── Backup config files and .release marker ──────────────────────────────────
# Captures the *exact* config the OLD WAR was running against, so rollback can
# restore them as a single unit (no separate site.yml run needed for config).

- name: Probe config files for backup
  ansible.builtin.stat:
    path: "{{ item.src }}"
  loop:
    - { name: openspecimen.properties, src: "{{ tomcat_home }}/conf/openspecimen.properties" }
    - { name: setenv.sh,               src: "{{ tomcat_home }}/bin/setenv.sh" }
    - { name: context.xml,             src: "{{ tomcat_home }}/conf/context.xml" }
  loop_control:
    label: "{{ item.name }}"
  register: _backup_config_probe
  when: openspecimen_install_type == 'upgrade'

- name: Backup config files that exist
  ansible.builtin.copy:
    src:        "{{ item.item.src }}"
    dest:       "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/config/{{ item.item.name }}"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0640'
  loop: "{{ _backup_config_probe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('(skipped)') }}"
  when:
    - openspecimen_install_type == 'upgrade'
    - item.stat is defined
    - item.stat.exists

- name: Probe previous .release marker for backup
  ansible.builtin.stat:
    path: "{{ openspecimen_release_marker }}"
  register: _backup_marker_probe
  when: openspecimen_install_type == 'upgrade'

- name: Backup previous .release marker
  ansible.builtin.copy:
    src:        "{{ openspecimen_release_marker }}"
    dest:       "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout }}/.release"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0644'
  when:
    - openspecimen_install_type == 'upgrade'
    - _backup_marker_probe.stat is defined
    - _backup_marker_probe.stat.exists

# ── Deploy WAR ────────────────────────────────────────────────────────────────
# Skipped entirely on plugins-only — the existing webapps/openspecimen.war is
# already at the requested release.

- name: Deploy openspecimen.war
  block:
    - name: Extract openspecimen.war from release zip
      ansible.builtin.shell: |
        set -eo pipefail
        WAR=$(echo "{{ _zip_contents.stdout }}" \
          | awk 'NF==4 && $NF ~ /openspecimen\.war$/ {print $NF; exit}')
        if [ -z "$WAR" ]; then
          echo "ERROR: openspecimen.war not found in release zip"
          exit 1
        fi
        unzip -p /tmp/{{ openspecimen_release }}.zip "$WAR" \
          > {{ tomcat_home }}/webapps/openspecimen.war
      args:
        executable: /bin/bash
        creates: "{{ tomcat_home }}/webapps/openspecimen.war"
      notify: restart openspecimen
  rescue:
    - name: Fail with operator guidance for WAR extraction error
      ansible.builtin.fail:
        msg: |
          ✗ Could not extract openspecimen.war from the release zip.

          Release zip:    /tmp/{{ openspecimen_release }}.zip
          Target path:    {{ tomcat_home }}/webapps/openspecimen.war
          Customer:       {{ inventory_hostname }}

          What likely happened:
            - The release zip is missing openspecimen.war (corrupt / wrong zip), OR
            - The Tomcat webapps directory is not writable, OR
            - Disk is full.

          What to check:
            1. Inspect zip contents on Jenkins VM:
                 unzip -l {{ openspecimen_zip_path | expanduser }} | grep openspecimen.war

            2. Check disk space on target:
                 df -h {{ tomcat_home }}

            3. Verify Tomcat is installed and the webapps dir exists:
                 ls -la {{ tomcat_home }}/webapps/
  when: not (_plugins_only_change | default(false))

- name: Set WAR ownership
  ansible.builtin.file:
    path: "{{ tomcat_home }}/webapps/openspecimen.war"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'
  when: not (_plugins_only_change | default(false))

# ── Deploy plugins ────────────────────────────────────────────────────────────

- name: Extract default plugin JARs from release zip
  block:
    - name: Locate and extract plugin_build/*.jar
      ansible.builtin.shell: |
        set -eo pipefail
        PLUGIN_DIR=$(echo "{{ _zip_contents.stdout }}" \
          | awk 'NF==4 && $NF ~ /plugin_build\/.+\.jar$/ {sub("/[^/]+$","", $NF); print $NF; exit}')
        if [ -z "$PLUGIN_DIR" ]; then
          echo "ERROR: plugin_build/*.jar not found in release zip"
          exit 1
        fi
        unzip -jo /tmp/{{ openspecimen_release }}.zip "${PLUGIN_DIR}/*.jar" \
          -d {{ openspecimen_plugin_dir }}/default/
      args:
        executable: /bin/bash
      register: _plugin_extract
      changed_when: _plugin_extract.stdout is search('inflating:|extracting:')
  rescue:
    - name: Fail with operator guidance for default plugin extraction
      ansible.builtin.fail:
        msg: |
          ✗ Could not extract default plugins from the release zip.

          Release zip: /tmp/{{ openspecimen_release }}.zip
          Expected:    plugin_build/*.jar inside the zip

          What likely happened:
            - The release zip does not contain a plugin_build/ directory with JARs
              (wrong build, incomplete package, or this release truly has no default plugins).

          What to check:
            1. List plugin files in the zip (on Jenkins VM):
                 unzip -l {{ openspecimen_zip_path | expanduser }} | grep -E 'plugin_build/.+\.jar'

            2. Confirm with the build/release team this zip is the correct artifact.
  # Default plugins are tied to the WAR release — on plugins-only deploys the
  # WAR is unchanged so the existing default JARs are already correct.
  when: not (_plugins_only_change | default(false))

# ── Deploy additional plugin zips ─────────────────────────────────────────────
# Pre-flight already searched recursively under openspecimen_builds_dir and
# stored results in _preflight_paid_find / _preflight_customer_find.
# Reuse those here — no second find needed.

- name: Upload paid plugin zips to target
  ansible.builtin.copy:
    src:  "{{ item.files[0].path }}"
    dest: "/tmp/{{ item.files[0].path | basename }}"
    mode: '0644'
  loop: "{{ _preflight_paid_find.results }}"
  when: item.matched > 0

- name: Extract JARs from paid plugin zips
  ansible.builtin.shell: |
    set -eo pipefail
    OUTPUT=$(unzip -jo "/tmp/{{ item.files[0].path | basename }}" "*.jar" \
      -d {{ openspecimen_plugin_dir }}/paid/ 2>&1) || { echo "$OUTPUT"; exit 1; }
    if ! echo "$OUTPUT" | grep -qE 'inflating:|extracting:'; then
      echo "ERROR: no .jar files inside paid plugin zip {{ item.files[0].path | basename }}"
      exit 2
    fi
    echo "$OUTPUT"
  args:
    executable: /bin/bash
  loop: "{{ _preflight_paid_find.results }}"
  when: item.matched > 0
  register: _paid_plugin_extract
  changed_when: _paid_plugin_extract.stdout is search('inflating:|extracting:')
  failed_when: _paid_plugin_extract.rc | default(0) != 0

- name: Show operator guidance if a paid plugin zip had no JARs
  ansible.builtin.fail:
    msg: |
      ✗ Paid plugin zip {{ item.item.item }} contained no .jar files.

      Zip:       {{ item.item.files[0].path }}
      Plugin:    {{ item.item.item }}
      Customer:  {{ inventory_hostname }}

      What to do:
        - Inspect the zip on Jenkins VM:
            unzip -l {{ item.item.files[0].path }}
        - Re-package the plugin so the .jar is at the top level (or any level).
        - Or remove "{{ item.item.item }}" from openspecimen_paid_plugins in inventory.
  loop: "{{ _paid_plugin_extract.results | default([]) }}"
  when:
    - item.skipped is not defined
    - item.rc | default(0) == 2

- name: Remove paid plugin zips from target
  ansible.builtin.file:
    path: "/tmp/{{ item.files[0].path | basename }}"
    state: absent
  loop: "{{ _preflight_paid_find.results }}"
  when: item.matched > 0

- name: Upload customer plugin zips to target
  ansible.builtin.copy:
    src:  "{{ item.files[0].path }}"
    dest: "/tmp/{{ item.files[0].path | basename }}"
    mode: '0644'
  loop: "{{ _preflight_customer_find.results }}"
  when: item.matched > 0

- name: Extract JARs from customer plugin zips
  ansible.builtin.shell: |
    set -eo pipefail
    OUTPUT=$(unzip -jo "/tmp/{{ item.files[0].path | basename }}" "*.jar" \
      -d {{ openspecimen_plugin_dir }}/zustomer/ 2>&1) || { echo "$OUTPUT"; exit 1; }
    if ! echo "$OUTPUT" | grep -qE 'inflating:|extracting:'; then
      echo "ERROR: no .jar files inside customer plugin zip {{ item.files[0].path | basename }}"
      exit 2
    fi
    echo "$OUTPUT"
  args:
    executable: /bin/bash
  loop: "{{ _preflight_customer_find.results }}"
  when: item.matched > 0
  register: _customer_plugin_extract
  changed_when: _customer_plugin_extract.stdout is search('inflating:|extracting:')
  failed_when: _customer_plugin_extract.rc | default(0) != 0

- name: Show operator guidance if a customer plugin zip had no JARs
  ansible.builtin.fail:
    msg: |
      ✗ Customer plugin zip {{ item.item.item }} contained no .jar files.

      Zip:       {{ item.item.files[0].path }}
      Plugin:    {{ item.item.item }}
      Customer:  {{ inventory_hostname }}

      What to do:
        - Inspect the zip on Jenkins VM:
            unzip -l {{ item.item.files[0].path }}
        - Re-package the plugin so the .jar is at the top level (or any level).
        - Or remove "{{ item.item.item }}" from openspecimen_customer_plugins in inventory.
  loop: "{{ _customer_plugin_extract.results | default([]) }}"
  when:
    - item.skipped is not defined
    - item.rc | default(0) == 2

- name: Remove customer plugin zips from target
  ansible.builtin.file:
    path: "/tmp/{{ item.files[0].path | basename }}"
    state: absent
  loop: "{{ _preflight_customer_find.results }}"
  when: item.matched > 0

- name: Set plugin ownership
  ansible.builtin.file:
    path: "{{ openspecimen_plugin_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    recurse: true

# ── Clean up ──────────────────────────────────────────────────────────────────

- name: Remove release zip from target
  ansible.builtin.file:
    path: "/tmp/{{ openspecimen_release }}.zip"
    state: absent

# ── Prune old backups ────────────────────────────────────────────────────────
# Keeps the most recent N timestamped backup subdirectories; older ones are
# deleted. Retention is set by openspecimen_backup_retention (default 3 in
# inventory/group_vars/all.yml). config-changes/ is excluded — it's a flat
# log directory for the update-config.sh operator script, not a snapshot.
# Sort by mtime so retention is robust to timestamp filename format.

- name: List existing timestamped backup directories
  ansible.builtin.find:
    paths:       "{{ openspecimen_backup_dir }}"
    file_type:   directory
    excludes:    "config-changes"
    recurse:     false
  register: _backup_dirs
  changed_when: false

- name: Prune backups beyond openspecimen_backup_retention ({{ openspecimen_backup_retention }})
  ansible.builtin.file:
    path:  "{{ item.path }}"
    state: absent
  loop: "{{ (_backup_dirs.files | sort(attribute='mtime', reverse=true))[openspecimen_backup_retention | int :] }}"
  when: _backup_dirs.files | length > (openspecimen_backup_retention | int)

# ── Start service ─────────────────────────────────────────────────────────────

- name: Start and enable openspecimen service
  ansible.builtin.systemd:
    name: openspecimen
    state: started
    enabled: true
    daemon_reload: true

# ── Wait for app to be ready ──────────────────────────────────────────────────
# Phase 1 — internal readiness: wait until Tomcat logs "Server startup in"
#   AFTER the most recent service activation timestamp. The timestamp filter
#   prevents a stale match on upgrade — catalina.out is append-only so a plain
#   grep would hit the previous run's startup line immediately.
# Phase 2 — external reachability (optional): if openspecimen_app_url is set,
#   curl that URL from the Ansible control node to confirm the ALB / reverse-
#   proxy path is live. delegate_to: localhost exercises the real network stack
#   rather than a loopback from the server to itself.

- name: Wait for Tomcat startup completion
  block:
    - name: Wait for service active and startup in catalina.out since last activation
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import subprocess, datetime, re, sys
        result = subprocess.run(
            ['systemctl', 'show', 'openspecimen', '-p', 'ActiveEnterTimestamp', '--value'],
            capture_output=True, text=True)
        # Normalise: strip microseconds then timezone word — both systemd and
        # Tomcat use the same local clock so TZ is irrelevant for comparison,
        # and strptime('%Z') only reliably parses UTC/GMT on most Python builds.
        ts_str = re.sub(r'(\d{2}:\d{2}:\d{2})\.\d+', r'\1', result.stdout.strip())
        ts_str = re.sub(r'\s\S+$', '', ts_str)
        if not ts_str:
            sys.exit(1)
        try:
            svc_start = datetime.datetime.strptime(ts_str, '%a %Y-%m-%d %H:%M:%S')
        except ValueError:
            sys.exit(1)
        log_re = re.compile(r'^(\d{2}-\w{3}-\d{4} \d{2}:\d{2}:\d{2})\.')
        try:
            with open('{{ tomcat_home }}/logs/catalina.out') as f:
                for line in f:
                    m = log_re.match(line)
                    if m:
                        try:
                            log_ts = datetime.datetime.strptime(m.group(1), '%d-%b-%Y %H:%M:%S')
                            if log_ts >= svc_start and 'Server startup in' in line:
                                sys.exit(0)
                        except ValueError:
                            pass
        except FileNotFoundError:
            pass
        sys.exit(1)
        PYEOF
      become: true
      register: health_check
      until: health_check.rc == 0
      retries: 90
      delay: 10
      changed_when: false
  rescue:
    - name: Show service status on failure
      ansible.builtin.shell: systemctl status openspecimen --no-pager -l 2>&1 || true
      become: true
      register: _service_status
      changed_when: false

    - name: Print service status
      ansible.builtin.debug:
        var: _service_status.stdout_lines

    - name: Tail catalina.out for diagnostics
      ansible.builtin.shell: "tail -100 {{ tomcat_home }}/logs/catalina.out 2>&1 || echo '(catalina.out not found)'"
      become: true
      register: _catalina_tail
      changed_when: false

    - name: Print catalina.out
      ansible.builtin.debug:
        var: _catalina_tail.stdout_lines

    - name: Fail after diagnostics
      ansible.builtin.fail:
        msg: |
          ✗ OpenSpecimen did not start within {{ (90 * 10 / 60) | int }} minutes.

          Customer:  {{ inventory_hostname }}
          Release:   {{ openspecimen_release }}
          Service:   openspecimen ({{ tomcat_home }})

          What likely happened (most common):
            1. Database migration failure (Liquibase)
               → search catalina.out above for 'liquibase' or 'ChangeLog'
               → check RDS parameter group: lower_case_table_names=1, utf8 (NOT utf8mb4)

            2. Database connection failure at startup
               → search catalina.out for 'Could not get JDBC Connection' or 'Communications link failure'
               → verify mysql_db_host and mysql_db_password

            3. Out of memory / heap dump
               → check {{ openspecimen_data_dir }}/heapdumps/
               → increase tomcat_heap_max_override (MB)

            4. Port 8080 already in use
               → ss -tlnp | grep 8080  (on target)

            5. WAR deployment failed at Tomcat layer
               → check {{ tomcat_home }}/logs/localhost.*.log

          Diagnostics:
            - Full service status: shown above
            - Last 100 catalina.out lines: shown above
            - Full log:  sudo journalctl -u openspecimen --since '1 hour ago'

# Phase 2: external URL reachability — only runs when openspecimen_app_url is set.
# Runs from the Ansible control node (Jenkins) so it validates the full
# ALB/proxy stack, not just local Tomcat connectivity.
- name: Verify app reachable via public URL
  block:
    - name: Curl openspecimen_app_url from control node
      ansible.builtin.shell: >
        curl -sf -o /dev/null -w "%{http_code}"
        {{ openspecimen_app_url }}/openspecimen/rest/ng/config-settings/app-props
        | grep -qE '^(200|401)$'
      delegate_to: localhost
      become: false
      register: _app_url_check
      until: _app_url_check.rc == 0
      retries: 12
      delay: 10
      changed_when: false
  rescue:
    - name: Fail with operator guidance for public URL check
      ansible.builtin.fail:
        msg: |
          ✗ App is running locally but not reachable via public URL after 2 minutes.

          Public URL: {{ openspecimen_app_url }}
          Customer:   {{ inventory_hostname }}

          OpenSpecimen passed the local startup check (Tomcat is up on port 8080).
          The failure is somewhere in the ALB / reverse-proxy / DNS layer.

          What to check:
            1. ALB health check
               → AWS Console → EC2 → Target Groups → check target health
               → Health check path should be /openspecimen/rest/ng/config-settings/app-props
               → Returns HTTP 200 or 401 when healthy.

            2. DNS resolution from Jenkins VM:
                 dig +short {{ openspecimen_app_url | regex_replace('^https?://', '') | regex_replace('/.*', '') }}

            3. Security group on ALB allows inbound 443 from your IP.

            4. Certificate validity if HTTPS:
                 curl -vI {{ openspecimen_app_url }} 2>&1 | grep -E 'expire|subject|issuer'

            5. Allowed Request Origins in OpenSpecimen UI:
               Settings → Common → Allowed Request Origins → must include {{ openspecimen_app_url }}
  when: openspecimen_app_url is defined

- name: Deployment complete
  ansible.builtin.debug:
    msg: >-
      {% if openspecimen_install_type == 'fresh' %}
      Fresh install complete — {{ openspecimen_release }}
      {% else %}
      Upgrade complete — {{ _installed_release | default('unknown') }} → {{ openspecimen_release }}
      {% endif %}
      | IP: {{ ansible_facts['default_ipv4']['address'] }}

- name: Record deployed release version
  ansible.builtin.copy:
    content: "{{ openspecimen_release }}\n"
    dest: "{{ openspecimen_release_marker }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'

# Explicit success flag written ONLY here, as the absolute last step of the
# deploy. The skip-if-current logic in roles/openspecimen/tasks/direction.yml
# requires this file to match the requested release before it will short-circuit
# a re-deploy. If a previous run failed before this point — even partway through
# WAR/plugin extraction — the file is stale and the next run proceeds with a
# full deploy without needing -e force_deploy=true.
- name: Record successful deploy
  ansible.builtin.copy:
    content: |
      release: {{ openspecimen_release }}
      paid_plugins: {{ openspecimen_paid_plugins | default([]) | to_json }}
      customer_plugins: {{ openspecimen_customer_plugins | default([]) | to_json }}
      timestamp: {{ ansible_date_time.iso8601 | default('') }}
      install_type: {{ openspecimen_install_type | default('unknown') }}
    dest: "{{ openspecimen_deploy_success_marker | default('/usr/local/openspecimen/.deploy_success') }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    mode: '0644'
