---
# Rollback flow — included from two places:
#
#   1. Top-level rollback.yml  (operator runs explicitly)
#   2. site.yml / deploy.yml pre_task — when the requested release is older
#      than the installed release (downgrade direction detected)
#
# Backup selection (in order of precedence):
#   1. backup_timestamp   : restore from this specific timestamped directory
#   2. target_version     : restore from the backup whose .release matches this
#                           (used by the auto-rollback path — pass the requested
#                           openspecimen_release as target_version)
#   3. (neither)          : restore from the most recent backup (mtime)
#
# Safety: halts before stopping the service if Liquibase has applied changesets
# after the backup was created. Override with allow_downgrade=true.

# ── 1. Resolve which backup to restore ───────────────────────────────────────

- name: List timestamped backup directories on target
  ansible.builtin.find:
    paths:     "{{ openspecimen_backup_dir }}"
    file_type: directory
    excludes:  "config-changes"
    recurse:   false
  register: _backup_dirs

- name: Fail with operator guidance if no backups exist
  ansible.builtin.fail:
    msg: |
      ✗ No timestamped backups found under {{ openspecimen_backup_dir }}.

      Customer:  {{ inventory_hostname }}

      What likely happened:
        - This is the first deploy and no upgrade has occurred yet, OR
        - All backups were pruned by openspecimen_backup_retention, OR
        - The target node was rebuilt and previous backups are lost.

      What to check:
        ls -la {{ openspecimen_backup_dir }}/

      How to fix:
        - There is nothing to roll back to. To deploy an older version,
          run deploy.yml with -e openspecimen_release=<older-version> and
          -e allow_downgrade=true, and place the older release zip in
          openspecimen_builds_dir.
  when: _backup_dirs.files | length == 0

# Compute most-recent backup (used when neither backup_timestamp nor
# target_version is provided).
- name: Compute most-recent backup path
  ansible.builtin.set_fact:
    _latest_backup_path: "{{ (_backup_dirs.files | sort(attribute='mtime', reverse=true) | first).path }}"
  when: _backup_dirs.files | length > 0

# Find the backup whose .release marker matches target_version (used by the
# auto-rollback path triggered from site.yml when a downgrade is detected).
- name: Find backup directory matching target_version
  ansible.builtin.shell: |
    set -eo pipefail
    for d in "{{ openspecimen_backup_dir }}"/*/; do
      [ -d "$d" ] || continue
      [ -f "${d}.release" ] || continue
      v=$(tr -d '[:space:]' < "${d}.release")
      if [ "$v" = "{{ target_version }}" ]; then
        echo "${d%/}"
        exit 0
      fi
    done
    exit 1
  args:
    executable: /bin/bash
  register: _target_version_match
  failed_when: false
  changed_when: false
  when:
    - target_version is defined
    - target_version | default('') | trim
    - not (backup_timestamp is defined and backup_timestamp | default('') | trim)

- name: Resolve backup directory to restore from
  ansible.builtin.set_fact:
    _restore_path: >-
      {%- if backup_timestamp is defined and backup_timestamp | trim -%}
        {{ openspecimen_backup_dir.rstrip('/') }}/{{ backup_timestamp | trim }}
      {%- elif target_version is defined and target_version | default('') | trim -%}
        {%- if _target_version_match.rc | default(1) == 0 -%}
          {{ _target_version_match.stdout | trim }}
        {%- else -%}
          NO_MATCH
        {%- endif -%}
      {%- else -%}
        {{ _latest_backup_path }}
      {%- endif -%}

- name: Fail when target_version has no matching backup
  ansible.builtin.fail:
    msg: |
      ✗ No backup found for version {{ target_version }} on {{ inventory_hostname }}.

      Available backups (most recent first):
      {% for f in (_backup_dirs.files | sort(attribute='mtime', reverse=true)) %}
        - {{ f.path | basename }}   (mtime {{ '%Y-%m-%d %H:%M:%S' | strftime(f.mtime) }})
      {% endfor %}

      How to fix:
        - Pick a version that has a backup directory above, OR
        - Restore the database from an RDS snapshot taken before that version's
          rollout and re-run with -e allow_downgrade=true on deploy.yml.
  when: _restore_path == 'NO_MATCH'

- name: Verify the resolved backup exists
  ansible.builtin.stat:
    path: "{{ _restore_path }}"
  register: _restore_stat

- name: Fail with operator guidance if the requested timestamp is missing
  ansible.builtin.fail:
    msg: |
      ✗ Backup directory not found: {{ _restore_path }}

      Customer:  {{ inventory_hostname }}
      Requested: {{ backup_timestamp | default('(latest)') }}

      Available backups (most recent first):
      {% for f in (_backup_dirs.files | sort(attribute='mtime', reverse=true)) %}
        - {{ f.path | basename }}   (mtime {{ '%Y-%m-%d %H:%M:%S' | strftime(f.mtime) }})
      {% endfor %}

      How to fix:
        ansible-playbook -i inventory/customers/{{ inventory_hostname }}/ rollback.yml \
          -e backup_timestamp=<one-of-the-timestamps-above>
  when: not _restore_stat.stat.exists

# ── 2. Verify the backup contains a WAR (sanity check) ───────────────────────

- name: Verify the backup contains openspecimen.war
  ansible.builtin.stat:
    path: "{{ _restore_path }}/openspecimen.war"
  register: _war_stat

- name: Fail if the backup is incomplete (no WAR)
  ansible.builtin.fail:
    msg: |
      ✗ Backup is incomplete: {{ _restore_path }}/openspecimen.war is missing.

      This backup directory may have been partially deleted, or was created
      by an older version of the playbook that did not back up the WAR.
      Pick a different timestamp from the list above.
  when: not _war_stat.stat.exists

- name: Show planned rollback
  ansible.builtin.debug:
    msg:
      - "Restoring from: {{ _restore_path }}"
      - "Backup mtime  : {{ '%Y-%m-%d %H:%M:%S' | strftime(_restore_stat.stat.mtime) }}"
      - "WAR size      : {{ (_war_stat.stat.size / 1024 / 1024) | round(1) }} MB"

# ── 2b. Schema-incompatible downgrade detection ──────────────────────────────

- name: Read live release marker (for diagnostics)
  ansible.builtin.slurp:
    src: "{{ openspecimen_release_marker }}"
  register: _live_marker_slurp
  failed_when: false
  changed_when: false

- name: Read backup release marker (for diagnostics)
  ansible.builtin.slurp:
    src: "{{ _restore_path }}/.release"
  register: _backup_marker_slurp
  failed_when: false
  changed_when: false

- name: Count Liquibase migrations applied after the backup
  ansible.builtin.shell: |
    set -eo pipefail
    mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' \
      -h {{ mysql_db_host }} {{ mysql_db_name }} \
      -sNe "SELECT COUNT(*) FROM DATABASECHANGELOG
            WHERE DATEEXECUTED > FROM_UNIXTIME({{ _restore_stat.stat.mtime | int }});"
  args:
    executable: /bin/bash
  register: _changelog_count
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - db_type | default('mysql') == 'mysql'
    - mysql_db_password is defined

- name: Halt rollback if schema has moved forward since backup
  ansible.builtin.fail:
    msg: |
      ✗ Schema-incompatible downgrade detected.

      Customer:           {{ inventory_hostname }}
      Live release:       {{ (_live_marker_slurp.content | b64decode | trim) if _live_marker_slurp.content is defined else '(no marker)' }}
      Backup release:     {{ (_backup_marker_slurp.content | b64decode | trim) if _backup_marker_slurp.content is defined else '(no marker)' }}
      Backup mtime:       {{ '%Y-%m-%d %H:%M:%S' | strftime(_restore_stat.stat.mtime) }}
      New migrations:     {{ _changelog_count.stdout | trim }} row(s) in DATABASECHANGELOG since backup

      What likely happened:
        OpenSpecimen applied Liquibase migrations after this backup was created.
        Rolling back the WAR without rolling back the schema would leave the older
        application running against a newer schema — risk of runtime errors, missing
        columns, or refused startup.

      What to check (list the offending changesets):
        mysql -u {{ mysql_db_user }} -p -h {{ mysql_db_host }} {{ mysql_db_name }} \
          -e "SELECT ID, AUTHOR, FILENAME, DATEEXECUTED FROM DATABASECHANGELOG \
              WHERE DATEEXECUTED > FROM_UNIXTIME({{ _restore_stat.stat.mtime | int }}) \
              ORDER BY DATEEXECUTED ASC;"

      How to fix (pick one):
        1. Use a MORE RECENT backup that postdates the new migrations.
        2. Restore the database from an RDS snapshot taken before
           {{ '%Y-%m-%d %H:%M:%S' | strftime(_restore_stat.stat.mtime) }}, then re-run.
        3. Override (use only after manual schema fix or confirmed-safe downgrade):
             ansible-playbook ... -e allow_downgrade=true
           — in Jenkins: tick the ALLOW_DOWNGRADE checkbox on the deploy job.
  when:
    - not (allow_downgrade | default(false) | bool)
    - _changelog_count is defined
    - _changelog_count.stdout is defined
    - (_changelog_count.stdout | trim | int) > 0

- name: Warn that schema-downgrade detection was bypassed
  ansible.builtin.debug:
    msg: >-
      ⚠ allow_downgrade=true — skipping schema-downgrade detection.
      Proceeding with the rollback. Make sure the database schema is
      compatible with the target WAR before continuing.
  when:
    - allow_downgrade | default(false) | bool
    - _changelog_count is defined
    - (_changelog_count.stdout | default('0') | trim | int) > 0

# ── 3. Stop the service ──────────────────────────────────────────────────────

- name: Stop openspecimen service
  ansible.builtin.systemd:
    name:  openspecimen
    state: stopped

# ── 4. Restore WAR (replace the live one) ────────────────────────────────────

- name: Remove current WAR + expanded webapp directory
  ansible.builtin.file:
    path:  "{{ item }}"
    state: absent
  loop:
    - "{{ tomcat_home }}/webapps/openspecimen.war"
    - "{{ tomcat_home }}/webapps/openspecimen"

- name: Restore openspecimen.war from backup
  ansible.builtin.copy:
    src:        "{{ _restore_path }}/openspecimen.war"
    dest:       "{{ tomcat_home }}/webapps/openspecimen.war"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0644'

# ── 5. Restore plugins — all three tiers ─────────────────────────────────────

- name: Probe backup plugin subdirectories
  ansible.builtin.stat:
    path: "{{ _restore_path }}/plugins/{{ item }}"
  loop: [default, paid, zustomer]
  register: _backup_plugin_stat

- name: Wipe current plugin tier (only when backup has it)
  ansible.builtin.shell: |
    rm -f {{ openspecimen_plugin_dir }}/{{ item.item }}/*.jar
  loop: "{{ _backup_plugin_stat.results }}"
  when: item.stat.exists
  changed_when: true

- name: Restore plugin JARs from backup
  ansible.builtin.shell: |
    if compgen -G "{{ _restore_path }}/plugins/{{ item.item }}/*.jar" > /dev/null; then
      cp {{ _restore_path }}/plugins/{{ item.item }}/*.jar {{ openspecimen_plugin_dir }}/{{ item.item }}/
      chown {{ tomcat_user }}:{{ tomcat_user }} {{ openspecimen_plugin_dir }}/{{ item.item }}/*.jar
      chmod 0644 {{ openspecimen_plugin_dir }}/{{ item.item }}/*.jar
      echo "restored"
    else
      echo "empty"
    fi
  args:
    executable: /bin/bash
  loop: "{{ _backup_plugin_stat.results }}"
  when: item.stat.exists
  register: _restore_plugins
  changed_when: _restore_plugins.stdout == 'restored'

# ── 6. Restore MySQL connector JAR if backed up ──────────────────────────────

- name: Probe backup lib directory
  ansible.builtin.stat:
    path: "{{ _restore_path }}/lib"
  register: _backup_lib_stat

- name: Restore MySQL connector JAR from backup lib/
  ansible.builtin.shell: |
    if compgen -G "{{ _restore_path }}/lib/mysql-connector*.jar" > /dev/null; then
      rm -f {{ tomcat_home }}/lib/mysql-connector*.jar
      cp {{ _restore_path }}/lib/mysql-connector*.jar {{ tomcat_home }}/lib/
      chown {{ tomcat_user }}:{{ tomcat_user }} {{ tomcat_home }}/lib/mysql-connector*.jar
      chmod 0644 {{ tomcat_home }}/lib/mysql-connector*.jar
      echo "restored"
    else
      echo "skipped"
    fi
  args:
    executable: /bin/bash
  when: _backup_lib_stat.stat.exists
  register: _restore_connector
  changed_when: _restore_connector.stdout == 'restored'

# ── 7. Restore config files from <backup>/config/ ────────────────────────────

- name: Probe backup config files
  ansible.builtin.stat:
    path: "{{ _restore_path }}/config/{{ item.name }}"
  loop:
    - { name: openspecimen.properties, dest: "{{ tomcat_home }}/conf/openspecimen.properties", mode: '0640' }
    - { name: setenv.sh,               dest: "{{ tomcat_home }}/bin/setenv.sh",                mode: '0755' }
    - { name: context.xml,             dest: "{{ tomcat_home }}/conf/context.xml",             mode: '0640' }
  loop_control:
    label: "{{ item.name }}"
  register: _backup_config_stat
  changed_when: false

- name: Restore config files from backup
  ansible.builtin.copy:
    src:        "{{ _restore_path }}/config/{{ item.item.name }}"
    dest:       "{{ item.item.dest }}"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       "{{ item.item.mode }}"
  loop: "{{ _backup_config_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists

- name: Warn when backup has no config snapshot
  ansible.builtin.debug:
    msg: >-
      NOTE: backup {{ _restore_path | basename }} has no config/ subdirectory.
      The live openspecimen.properties / setenv.sh / context.xml are left in
      place. If config was changed between this backup and now, re-run
      site.yml to re-template them from inventory.
  when: not (_backup_config_stat.results | map(attribute='stat.exists') | select | list | length > 0)

# ── 8. Update the release marker to reflect the rolled-back version ──────────

- name: Probe backed-up release marker (if present)
  ansible.builtin.stat:
    path: "{{ _restore_path }}/.release"
  register: _backup_release_marker

- name: Restore release marker from backup
  ansible.builtin.copy:
    src:        "{{ _restore_path }}/.release"
    dest:       "{{ openspecimen_release_marker }}"
    remote_src: true
    owner:      "{{ tomcat_user }}"
    group:      "{{ tomcat_user }}"
    mode:       '0644'
  when: _backup_release_marker.stat.exists

- name: Warn when no release marker is in the backup
  ansible.builtin.debug:
    msg: >-
      NOTE: backup {{ _restore_path | basename }} has no .release marker.
      The on-disk marker still shows the previous (rolled-forward) version
      and may incorrectly block the next deploy as a downgrade. If that
      happens, remove {{ openspecimen_release_marker }} manually before
      re-running deploy.yml.
  when: not _backup_release_marker.stat.exists

# ── 9. Start service and wait for readiness ──────────────────────────────────

- name: Start openspecimen service
  ansible.builtin.systemd:
    name:  openspecimen
    state: started
    daemon_reload: true

- name: Wait for the app to respond
  ansible.builtin.shell: >
    curl -sf -o /dev/null -w "%{http_code}"
    http://localhost:{{ openspecimen_port }}/openspecimen/rest/ng/config-settings/app-props
    | grep -qE '^(200|401)$'
  register: _rollback_health
  until: _rollback_health.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Rollback complete
  ansible.builtin.debug:
    msg: >-
      ✓ Rolled back to {{ _restore_path | basename }}
      (mtime {{ '%Y-%m-%d %H:%M:%S' | strftime(_restore_stat.stat.mtime) }})
      on {{ inventory_hostname }}.
