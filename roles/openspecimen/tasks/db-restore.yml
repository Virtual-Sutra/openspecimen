---
# Standalone DB restore (#98) - local MySQL. Companion to db-backup.yml. Restores a
# gzipped mysqldump (made with --add-drop-database, so it drops+recreates the schema).
# DESTRUCTIVE: overwrites the live DB; requires -e db_restore_confirm=true.
# Leaves the service STOPPED - the on-disk WAR may be newer than the restored schema
# (starting it would re-migrate the DB forward), so deploy the matching release first.
# Dump selection: db_backup_file (exact) > newest *.sql.gz under db_backup_dir.
# RDS -> AWS snapshot (#99); Oracle -> DBA tooling.

- name: Assert this is a managed local MySQL database
  ansible.builtin.assert:
    that:
      - db_managed | default(true) | bool
      - db_type | default('mysql') == 'mysql'
    fail_msg: >-
      db-restore.yml supports local MySQL (db_managed=true, db_type=mysql) only.
      For RDS restore the AWS snapshot (#99); for Oracle use the DBA's tools.

- name: Require explicit confirmation (destructive)
  ansible.builtin.fail:
    msg: |
      Refusing to restore without confirmation - this OVERWRITES the live
      database {{ mysql_db_name }} and DISCARDS all data written since the dump.

      Re-run with: -e db_restore_confirm=true
      Pick a dump with -e db_backup_file=<path/to/dump.sql.gz>, or omit it to
      restore the newest dump under
      {{ db_backup_dir | default(openspecimen_instance_dir ~ '/db-backups') }}.
  when: not (db_restore_confirm | default(false) | bool)

# ADR-012: resolves _mysql_target_host (self, unless mysql_host is set) and
# fails fast if a dedicated MySQL host is configured but unreachable, before
# any restore work starts. The dump lives on the MySQL host for split-host
# (db-backup.yml wrote it there) - find/stat below must look there too.
- name: Resolve the MySQL target host
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/resolve-mysql-target.yml"

- name: Find newest dump in db_backup_dir (when db_backup_file not given)
  ansible.builtin.find:
    paths:    "{{ db_backup_dir | default(openspecimen_instance_dir ~ '/db-backups') }}"
    patterns: "*.sql.gz"
  register: _db_dumps
  when: not (db_backup_file is defined and db_backup_file | trim)
  delegate_to: "{{ _mysql_target_host }}"

- name: Resolve dump file to restore
  ansible.builtin.set_fact:
    _restore_dump: >-
      {%- if db_backup_file is defined and db_backup_file | trim -%}
        {{ db_backup_file | trim }}
      {%- elif (_db_dumps.files | default([]) | length) > 0 -%}
        {{ (_db_dumps.files | sort(attribute='mtime', reverse=true) | first).path }}
      {%- else -%}
        NONE
      {%- endif -%}

- name: Fail when no dump is available
  ansible.builtin.fail:
    msg: |
      No database dump found.
      Pass -e db_backup_file=<path/to/dump.sql.gz>, or create one first:
        ansible-playbook -i inventory/customers/<name>/ db-backup.yml ...
      (searched {{ db_backup_dir | default(openspecimen_instance_dir ~ '/db-backups') }} for *.sql.gz)
  when: _restore_dump == 'NONE'

- name: Verify the dump exists
  ansible.builtin.stat:
    path: "{{ _restore_dump }}"
  register: _restore_dump_stat
  delegate_to: "{{ _mysql_target_host }}"

- name: Fail if the dump file is missing
  ansible.builtin.fail:
    msg: "Dump not found: {{ _restore_dump }}"
  when: not _restore_dump_stat.stat.exists

- name: Show planned restore
  ansible.builtin.debug:
    msg:
      - "Restoring database {{ mysql_db_name }} from:"
      - "  {{ _restore_dump }}  ({{ (_restore_dump_stat.stat.size / 1024 / 1024) | round(1) }} MB gzipped)"
      - "This OVERWRITES the live database and discards data written since the dump."

- name: Stop openspecimen service before restore
  ansible.builtin.systemd:
    name: "{{ openspecimen_service_name | default('openspecimen') }}"
    state: stopped
  failed_when: false

- name: Restore database from dump
  # -h 127.0.0.1, not mysql_db_host: see db-backup.yml's "Dump database"
  # comment for why (connects to the delegated host's own loopback).
  ansible.builtin.shell: |
    set -o pipefail
    gunzip -c "{{ _restore_dump }}" \
      | mysql -u {{ mysql_db_user }} -p'{{ mysql_db_password }}' -h 127.0.0.1
  args:
    executable: /bin/bash
  no_log: true
  delegate_to: "{{ _mysql_target_host }}"

- name: Restore complete - service left stopped
  ansible.builtin.debug:
    msg:
      - "Database {{ mysql_db_name }} restored from {{ _restore_dump | basename }}."
      - "The service is STOPPED on purpose. Before starting:"
      - "  - if the on-disk WAR already matches this dump's version:"
      - "      systemctl start openspecimen"
      - "  - otherwise deploy the matching release FIRST:"
      - "      ansible-playbook -i inventory/customers/<name>/ site.yml -e openspecimen_release=<that-version> ..."
      - "  Starting a NEWER WAR against this restored schema re-runs Liquibase and migrates it forward again."
