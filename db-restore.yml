---
# Standalone DB restore (local MySQL), companion to db-backup.yml. Thin wrapper
# around roles/openspecimen/tasks/db-restore.yml.
# DESTRUCTIVE - overwrites the live DB, discards data since the dump; requires
# -e db_restore_confirm=true. Stops the service and leaves it stopped (deploy the
# matching WAR before starting). Restores the newest dump under db_backup_dir, or
# -e db_backup_file=<path> for a specific one.

- name: Restore OpenSpecimen database
  hosts: openspecimen
  become: true

  tasks:
    - name: Include db-restore tasks from openspecimen role
      ansible.builtin.include_role:
        name:       openspecimen
        tasks_from: db-restore
