---
# Standalone database restore (local MySQL). Companion to db-backup.yml. Thin
# wrapper around roles/openspecimen/tasks/db-restore.yml.
#
# DESTRUCTIVE - overwrites the live database and discards data written since the
# dump. Requires -e db_restore_confirm=true. Stops the service and leaves it
# stopped; deploy the matching WAR before starting (see the role tasks).
#
# Usage:
#   # restore the newest dump under db_backup_dir
#   ansible-playbook -i inventory/customers/<name>/ db-restore.yml \
#     -e db_restore_confirm=true \
#     -e @secrets/<name>.yml --vault-password-file .vault-pass
#
#   # restore a specific dump
#   ... -e db_backup_file=/usr/local/openspecimen/db-backups/<ts>_<db>.sql.gz

- name: Restore OpenSpecimen database
  hosts: openspecimen
  become: true

  tasks:
    - name: Include db-restore tasks from openspecimen role
      ansible.builtin.include_role:
        name:       openspecimen
        tasks_from: db-restore
