---
# Application-only re-deploy — skips MySQL, Java, and Tomcat setup.
# Use this for version upgrades after the initial site.yml run.
#
# What it does:
#   1. Stops the openspecimen service
#   2. Backs up old WAR + default plugins to backup/<timestamp>/
#   3. Deploys new WAR and plugins from the release zip
#   4. Starts the service and waits for health check
#
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ deploy.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password>
#
# Dry run (shows what would change, does not deploy):
#   ansible-playbook -i inventory/customers/<name>/ deploy.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password> --check

- name: Re-deploy OpenSpecimen (upgrade)
  hosts: openspecimen
  become: true
  vars:
    # Default to upgrade; override with -e openspecimen_install_type=fresh for DB recovery
    openspecimen_install_type: "{{ openspecimen_install_type | default('upgrade') }}"

  pre_tasks:
    # Detect deploy vs rollback direction. On downgrade, the rollback flow
    # is invoked automatically and the play ends — the openspecimen role
    # below does not run.
    - name: Detect direction (deploy or rollback)
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: direction

    # Verify the release zip and every paid/customer plugin zip exists on the
    # control node before the openspecimen role runs. Fails fast if missing.
    - name: Pre-flight artifact check
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: preflight

  roles:
    - openspecimen
    - role: plugins
      when: customer_plugins | default([]) | length > 0
