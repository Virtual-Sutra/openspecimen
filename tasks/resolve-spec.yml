---
# Resolve the component version spec for a single release into `os_versions`
# (ADR-002 / #90). Caller sets `_spec_release` (e.g. openspecimen_v12.2.RC12 or an
# openspecimen_master-DD-MM-YYYY snapshot). Loaded once host-level (shared Java)
# and once per instance in tasks/deploy-instance.yml (per-instance Tomcat).
#
# master-* snapshots roll continuously and share ONE spec, so any master-* key
# normalises to 'master' -> component-specs/master.yml.

- name: "Spec: normalise release key ({{ _spec_release | default('') }})"
  ansible.builtin.set_fact:
    _release_key: "{{ _spec_release | default('') | regex_replace('^openspecimen_', '') | regex_replace('^master-.*$', 'master') }}"

- name: "Spec: locate component-specs/{{ _release_key }}.yml"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/component-specs/{{ _release_key }}.yml"
  register: _spec_stat
  delegate_to: localhost
  become: false

# Use the real spec when present, else the empty placeholder. include_vars must
# ALWAYS run with a real file: a set_fact reset of component_spec would SHADOW
# include_vars (set_fact outranks include_vars, so component_spec would stay {}),
# and merely skipping include_vars would leak the previous release's spec across
# instances. Loading _empty.yml gives a fresh component_spec={} with neither flaw.
- name: "Spec: choose spec file (real spec, else empty placeholder)"
  ansible.builtin.set_fact:
    _spec_file: "{{ playbook_dir }}/component-specs/{{ (_release_key ~ '.yml') if _spec_stat.stat.exists else '_empty.yml' }}"

- name: "Spec: load {{ _spec_file | basename }}"
  ansible.builtin.include_vars:
    file: "{{ _spec_file }}"

- name: "Spec: warn when no component spec exists for {{ _release_key }}"
  ansible.builtin.debug:
    msg: >-
      No component-specs/{{ _release_key }}.yml found - using built-in defaults
      (Java 17). Generate one with discover-versions.yml (ops) and add it under
      component-specs/.
  when: not _spec_stat.stat.exists

- name: "Spec: compute os_versions (spec + customer override)"
  ansible.builtin.set_fact:
    os_versions: >-
      {{ {'java': {'track': '17'}, 'tomcat': '', 'mysql': {'track': ''}, 'apache': {'track': ''}}
         | combine(component_spec | default({}), recursive=true)
         | combine(component_versions_override | default({}), recursive=true) }}
