---
# Resolve where MySQL actually runs and how to reach it (ADR-012, split-host).
# Included from site.yml (before the mysql role runs) and from the DB
# backup/restore task files - the one place this topology decision lives, so
# provisioning and backup/restore always agree on the target.
#
# Co-located (mysql_host undefined): _mysql_target_host == inventory_hostname,
# so delegate_to at every call site becomes a documented no-op (self-
# delegation, no host gets registered below) - byte-identical to before this
# file existed.
- name: Resolve the MySQL target host
  ansible.builtin.set_fact:
    _mysql_target_host: "{{ mysql_host | default(inventory_hostname, true) }}"
    _mysql_split_host:  "{{ mysql_host is defined }}"
    _mysql_is_ec2:      "{{ (mysql_host | default('')) is match('^i-[0-9a-f]{8,17}$') }}"

# Register the dedicated MySQL host as a real delegation target, with its own
# connection vars as genuine per-host vars (module params - a legitimate use
# of `omit`). Every call site below then just does `delegate_to:
# "{{ _mysql_target_host }}"` with NO vars: override at all.
#
# This is deliberate, not incidental: an earlier version of this file computed
# _mysql_conn_user/_mysql_conn_key/_mysql_conn_proxy as plain facts and had
# each call site apply them through a task-level `vars:` block (`ansible_user:
# "{{ _mysql_conn_user if _mysql_split_host else omit }}"`, etc.). That's
# broken - assigning `omit` to a magic connection var (ansible_user,
# ansible_ssh_private_key_file, ansible_ssh_common_args) via a task/role
# `vars:` block does NOT fall through to the enclosing host's own value the
# way a module parameter does; it silently corrupts the connection to use no
# key/user/proxy at all. That fired for every co-located customer (mysql_host
# unset) on every task carrying that vars: block. add_host avoids this
# entirely: co-located call sites never set these keys anywhere, so they use
# the play's own connection unmodified (self-delegation, byte-identical to
# before this file existed); split-host call sites delegate to a host that
# already carries real values as its own hostvars.
- name: Register the dedicated MySQL host as a delegation target
  ansible.builtin.add_host:
    name: "{{ mysql_host }}"
    ansible_host: "{{ mysql_host }}"
    ansible_user: "{{ mysql_ssh_user | default('ubuntu') }}"
    ansible_ssh_private_key_file: >-
      {{ (mysql_ssh_private_key_file
          | default('~/.ssh/' ~ (customer | default(openspecimen_instance_name | default('openspecimen'))) ~ '-mysql-deploy', true))
         if not _mysql_is_ec2 else omit }}
    ansible_ssh_common_args: >-
      {{ ('-o ProxyCommand="aws --region ' ~ (aws_region | default(''))
          ~ ' ec2-instance-connect open-tunnel --instance-id ' ~ mysql_host
          ~ ' --remote-port %p"') if _mysql_is_ec2 else omit }}
  when: _mysql_split_host
  changed_when: false

# Fail fast with a clear, specific message instead of letting a network-layer
# failure surface as a raw SSH connection-timeout stack trace from deep inside
# whatever task happens to be first to actually delegate. Port-only (no auth
# attempted here) - a network-reachable-but-auth-failing host still passes
# this and fails later with its own (also clear) SSH error, correctly
# distinguishing "can't reach it at all" from "reached it, wrong key".
# Skipped for an EICE target: the tunnel itself only exists for the duration
# of the delegated connection, so there is nothing to probe here.
- name: Verify the MySQL host is reachable before attempting to use it
  ansible.builtin.wait_for:
    host: "{{ mysql_host }}"
    port: 22
    timeout: 10
  delegate_to: localhost
  become: false
  when:
    - _mysql_split_host
    - not _mysql_is_ec2
  register: _mysql_reachability
  failed_when: false

- name: Fail with an actionable message when the MySQL host is unreachable
  ansible.builtin.fail:
    msg: >-
      MySQL host '{{ mysql_host }}' is not reachable on port 22 - check the
      VPN tunnel/network path and that the host is up before retrying. (Key
      auth was not even attempted; this is a network-layer failure, not a
      credentials problem.)
  when:
    - _mysql_split_host
    - not _mysql_is_ec2
    - _mysql_reachability is failed or (_mysql_reachability.elapsed | default(0)) >= 10
