---
# Per-instance app deploy wrapper (#72 part 2). Looped from site.yml over
# `_instances`; shims the flat vars off `_instance`, then includes direction ->
# preflight -> openspecimen -> plugins -> apache -> verify per instance.
# Facts are reset each iteration below: set_fact is host-scoped and persists, so a
# conditional set_fact skipped this iteration would otherwise leak the prior one.

- name: "[{{ _instance.name }}] Shim flat vars from instance"
  ansible.builtin.set_fact:
    openspecimen_release:               "{{ _instance.release }}"
    # Reset the zip path to the per-instance default each iteration (no leak from a
    # prior instance). A global -e openspecimen_zip_path shadows this; otherwise the
    # find below resolves the real location under builds_dir by release.
    openspecimen_zip_path:              "{{ openspecimen_builds_dir }}/{{ _instance.release }}.zip"
    openspecimen_release_marker:        "{{ _instance.release_marker }}"
    openspecimen_deploy_success_marker: "{{ _instance.deploy_success_marker }}"
    openspecimen_data_dir:              "{{ _instance.data_dir }}"
    openspecimen_plugin_dir:            "{{ _instance.plugin_dir }}"
    openspecimen_backup_dir:            "{{ _instance.backup_dir }}"
    openspecimen_paid_plugins:          "{{ _instance.paid_plugins }}"
    openspecimen_customer_plugins:      "{{ _instance.customer_plugins }}"
    openspecimen_port:                  "{{ _instance.http_port | int }}"
    openspecimen_ajp_port:              "{{ _instance.ajp_port | int }}"
    openspecimen_shutdown_port:         "{{ _instance.shutdown_port | int }}"
    openspecimen_app_url:               "{{ _instance.app_url }}"
    openspecimen_node_name:             "{{ _instance.node_name }}"
    openspecimen_service_name:          "{{ _instance.service_name }}"
    openspecimen_context_path:          "{{ _instance.context_path }}"
    openspecimen_war_name:              "{{ _instance.war_name }}"
    catalina_home:                      "{{ _instance.catalina_home }}"
    catalina_base:                      "{{ _instance.catalina_base }}"
    mysql_db_name:                      "{{ _instance.db_name }}"
    mysql_db_user:                      "{{ _instance.db_user }}"
    mysql_db_password:                  "{{ _instance.db_password }}"
    mysql_db_host:                      "{{ _instance.db_host }}"
    # Reset per-instance facts so nothing leaks from a prior iteration.
    _instance_direction:   ""
    _installed_release:    ""
    _version_check_done:   false
    _plugins_only_change:  false
    _config_only_change:   false
    _config_changed:       false
    _setenv_changed:       false
    _inst_zip_find:        {files: []}
    openspecimen_java_home: ""
    openspecimen_java_build: ""

- name: "[{{ _instance.name }}] Detect direction (deploy / rollback / noop)"
  ansible.builtin.include_role:
    name: openspecimen
    tasks_from: direction

# Record the version installed BEFORE this run so the CI (Jenkins) email can show
# 'last deployed version'. Written on the control node into deploy_report_dir when
# the caller passes it (no-op for CLI runs), now (before the WAR deploy) so it
# survives a later failure, and on ANY direction (deploy/rollback/noop). Named per
# instance so a multi-instance run records each instance's prior version (the email
# globs .prior-release-*) instead of the loop overwriting one file.
- name: "[{{ _instance.name }}] Record prior installed version for the CI email"
  ansible.builtin.copy:
    content: "{{ _installed_release | default('') }}\n"
    dest: "{{ deploy_report_dir }}/.prior-release-{{ _instance.name }}"
    mode: '0644'
  delegate_to: localhost
  become: false
  changed_when: false
  when: deploy_report_dir | default('') | trim | length > 0

- name: "[{{ _instance.name }}] Deploy (skipped when rollback/noop)"
  when: _instance_direction == 'deploy'
  block:
    # Per-instance component spec: THIS instance's release drives its own Tomcat /
    # connector versions (os_versions), independent of the other instances.
    - name: "[{{ _instance.name }}] Resolve component spec for {{ openspecimen_release }}"
      ansible.builtin.include_tasks: tasks/resolve-spec.yml
      vars:
        _spec_release: "{{ openspecimen_release }}"

    # Record the resolved component versions (os_versions: tomcat/java/mysql/apache,
    # spec + customer overrides) so the CI email can attach them for the deployed
    # release. Written on the control node into deploy_report_dir when the caller
    # passes it (no-op for CLI runs). Only the deploy path writes it, so a
    # rollback/noop leaves no stale file and the email omits the section. Named per
    # instance (email globs .component-versions-*.json) so a multi-instance deploy
    # writes one file each instead of overwriting a single file.
    - name: "[{{ _instance.name }}] Record deployed component versions for the CI email"
      ansible.builtin.copy:
        content: "{{ {'release': openspecimen_release, 'instance': _instance.name, 'components': os_versions} | to_nice_json }}\n"
        dest: "{{ deploy_report_dir }}/.component-versions-{{ _instance.name }}.json"
        mode: '0644'
      delegate_to: localhost
      become: false
      changed_when: false
      when: deploy_report_dir | default('') | trim | length > 0

    # Resolve THIS instance's release zip. If the configured openspecimen_zip_path
    # exists (a global -e override, or a flat builds_dir layout) use it as-is;
    # otherwise search builds_dir recursively for <release>.zip (Jenkins nests zips
    # under <job>/workspace/). This is what lets each instance pull its own version.
    - name: "[{{ _instance.name }}] Stat configured zip path"
      ansible.builtin.stat:
        path: "{{ openspecimen_zip_path | expanduser }}"
      delegate_to: localhost
      become: false
      register: _inst_zip_stat
      changed_when: false

    - name: "[{{ _instance.name }}] Find {{ openspecimen_release }}.zip under builds_dir"
      ansible.builtin.find:
        paths: "{{ openspecimen_builds_dir }}"
        patterns: "{{ openspecimen_release }}.zip"
        recurse: true
      delegate_to: localhost
      become: false
      register: _inst_zip_find
      changed_when: false
      when: not _inst_zip_stat.stat.exists

    - name: "[{{ _instance.name }}] Use the found zip for this instance"
      ansible.builtin.set_fact:
        openspecimen_zip_path: "{{ (_inst_zip_find.files | sort(attribute='mtime') | last).path }}"
      when:
        - not _inst_zip_stat.stat.exists
        - _inst_zip_find.files | default([]) | length > 0

    - name: "[{{ _instance.name }}] Fail when no zip found for {{ openspecimen_release }}"
      ansible.builtin.fail:
        msg: >-
          No {{ openspecimen_release }}.zip found at {{ openspecimen_zip_path }} or
          anywhere under {{ openspecimen_builds_dir }} for instance '{{ _instance.name }}'.
          Upload that release zip, or set the instance's release to one present in builds_dir.
      when:
        - not _inst_zip_stat.stat.exists
        - _inst_zip_find.files | default([]) | length == 0

    - name: "[{{ _instance.name }}] Pre-flight artifact check"
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: preflight

    # Per-instance JDK (os_versions.java.track from this instance's spec). Installs
    # the JDK (idempotent; JDKs coexist) and sets openspecimen_java_home, which the
    # tomcat runtime below pins into this instance's setenv.sh + systemd unit - so
    # two instances can run on different Java majors. Runs every deploy because the
    # runtime config below is re-templated every deploy and needs openspecimen_java_home.
    - name: "[{{ _instance.name }}] Per-instance Java (JDK + JAVA_HOME)"
      ansible.builtin.include_role:
        name: java

    # Per-instance Tomcat INSTALL: own CATALINA_HOME (binary at os_versions.tomcat)
    # + golden conf + DB connectors, all from THIS instance's zip. The binary is
    # laid down only when CATALINA_HOME is absent - a fresh instance installs its
    # pinned Tomcat; to change an existing instance's Tomcat version, clean up
    # that instance first. App-only upgrades skip this include entirely (the
    # openspecimen role uploads its own zip).
    - name: "[{{ _instance.name }}] Check this instance's Tomcat install"
      ansible.builtin.stat:
        path: "{{ catalina_home }}/bin/startup.sh"
      register: _inst_tomcat_stat

    - name: "[{{ _instance.name }}] Detect the installed Tomcat version"
      # Tomcat's own version script. "Server version: Apache Tomcat/9.0.59" gives
      # the version to compare against the spec's tomcat_version. JAVA_HOME comes
      # from the existing setenv.sh (this only runs on a prior install). If it can't
      # be read, stdout is empty -> treated as a version mismatch -> reinstall.
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ catalina_home }}/bin/version.sh 2>/dev/null
        | awk -F/ '/^Server version:/{print $2}' | tr -d '[:space:]'
      args:
        executable: /bin/bash
      register: _inst_tomcat_ver
      changed_when: false
      failed_when: false
      when: _inst_tomcat_stat.stat.exists

    - name: "[{{ _instance.name }}] Decide whether Tomcat needs (re)installing"
      # (Re)install when Tomcat is absent OR the installed version differs from the
      # spec's tomcat_version. Compare the first three components (server.number is
      # 4-part). An unreadable/empty version also forces a reinstall (fail-safe).
      ansible.builtin.set_fact:
        _inst_tomcat_needs_install: >-
          {{ (not _inst_tomcat_stat.stat.exists)
             or ((_inst_tomcat_ver.stdout | default('') | trim).split('.')[:3] | join('.') != os_versions.tomcat) }}

    - name: "[{{ _instance.name }}] Log Tomcat (re)install decision"
      ansible.builtin.debug:
        msg: >-
          {% if not _inst_tomcat_stat.stat.exists %}Fresh Tomcat install: {{ os_versions.tomcat }}.
          {% elif _inst_tomcat_needs_install | bool %}Tomcat upgrade: installed {{ _inst_tomcat_ver.stdout | default('unknown') | trim }} -> spec {{ os_versions.tomcat }} - re-installing binaries.
          {% else %}Tomcat already at {{ os_versions.tomcat }} - no reinstall.{% endif %}

    - name: "[{{ _instance.name }}] Install/upgrade this instance's Tomcat (binary + conf + connectors)"
      ansible.builtin.include_role:
        name: tomcat
        tasks_from: main
      when: _inst_tomcat_needs_install | bool

    - name: "[{{ _instance.name }}] Per-instance Tomcat runtime (CATALINA_BASE, ports, unit)"
      ansible.builtin.include_role:
        name: tomcat
        tasks_from: instance

    - name: "[{{ _instance.name }}] OpenSpecimen role (WAR + config + default plugins)"
      ansible.builtin.include_role:
        name: openspecimen

    - name: "[{{ _instance.name }}] Plugins role"
      ansible.builtin.include_role:
        name: plugins
      when: customer_plugins | default([]) | length > 0

    - name: "[{{ _instance.name }}] Apache reverse proxy"
      ansible.builtin.include_role:
        name: apache
      when: apache_enabled | default(false)

    # Apply pending restarts BEFORE the readiness gate - a mid-restart Tomcat makes
    # Apache serve the 503 downtime page.
    - name: "[{{ _instance.name }}] Apply pending restarts for this instance"
      ansible.builtin.meta: flush_handlers

    # Authoritative readiness gate: don't finish until the instance actually SERVES.
    # Apache-fronted instances answer a direct localhost hit with a 302/403 (Host !=
    # app.url), so probe app_url/ui-app/ through the local Apache (--resolve to
    # 127.0.0.1); else probe localhost:port accepting 200|302|401|403. Gated on the
    # same apache_enabled as the include above. See docs/TROUBLESHOOTING.md.
    - name: "[{{ _instance.name }}] Build the readiness-check command"
      ansible.builtin.set_fact:
        _ready_cmd: >-
          {% set _app = openspecimen_app_url | default('') | trim -%}
          {% if _app | length > 0 and (apache_enabled | default(false) | bool) -%}
          {% set _hp = _app | regex_replace('^https?://', '') | regex_replace('/.*$', '') -%}
          {% set _h = _hp.split(':')[0] -%}
          {% set _p = _hp.split(':')[1] if ':' in _hp else ('443' if _app.startswith('https') else '80') -%}
          curl -sf -k -o /dev/null -w "%{http_code}" --resolve {{ _h }}:{{ _p }}:127.0.0.1 {{ _app | regex_replace('/+$', '') }}/ui-app/ | grep -qE '^200$'
          {%- else -%}
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:{{ openspecimen_port }}{{ openspecimen_context_path | default('/openspecimen') }}/rest/ng/config-settings/app-props | grep -qE '^(200|302|401|403)$'
          {%- endif %}

    - name: "[{{ _instance.name }}] Wait until OpenSpecimen serves the app (post-restart)"
      ansible.builtin.shell: "{{ _ready_cmd }}"
      register: _instance_ready
      until: _instance_ready.rc == 0
      retries: "{{ openspecimen_health_retries | default(90) | int }}"
      delay: "{{ openspecimen_health_delay | default(10) | int }}"
      changed_when: false
      become: true

    - name: "[{{ _instance.name }}] Verify app reachable via public URL (opt-in)"
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: verify-public-url

  # ── Graceful auto-rollback on a failed upgrade ──────────────────────────────
  # Any failure above (WAR/plugin extract, startup gate, readiness, public-URL
  # verify) after the pre-upgrade backup was taken lands here. Restore the prior
  # version from that exact backup (WAR + config + plugins, plus the DB dump for
  # managed MySQL; RDS/Oracle restore artifacts + warn to restore a snapshot), then
  # re-fail so the deploy is still reported unsuccessful. Opt out with
  # -e openspecimen_rollback_on_failure=false. Fresh installs / an incomplete backup
  # roll back nothing (there is no prior version to restore).
  rescue:
    - name: "[{{ _instance.name }}] Deploy failed - record the error"
      ansible.builtin.set_fact:
        _deploy_error: "{{ ansible_failed_result.msg | default('see the failed task output above') }}"

    - name: "[{{ _instance.name }}] Probe the pre-deploy backup WAR (is a restore possible?)"
      ansible.builtin.stat:
        path: "{{ openspecimen_backup_dir }}/{{ backup_ts.stdout | default('') | trim }}/{{ openspecimen_war_name }}.war"
      register: _rb_war
      when:
        - openspecimen_rollback_on_failure | default(true) | bool
        - backup_ts is defined
        - backup_ts.stdout is defined
        - backup_ts.stdout | default('') | trim | length > 0

    - name: "[{{ _instance.name }}] Decide whether an auto-rollback can run"
      ansible.builtin.set_fact:
        _can_rollback: "{{ _rb_war.stat.exists | default(false) | bool }}"

    - name: "[{{ _instance.name }}] Announce the auto-rollback decision"
      ansible.builtin.debug:
        msg: >-
          ✗ Deploy of {{ openspecimen_release }} failed on instance '{{ _instance.name }}'.
          {% if _can_rollback %}Restoring the prior version from backup {{ backup_ts.stdout | trim }} ...{% else %}No complete pre-deploy backup to restore (fresh install, backup not taken, or rollback-on-failure disabled) - leaving the current state for inspection.{% endif %}

    - name: "[{{ _instance.name }}] Auto-rollback to the prior version"
      when: _can_rollback | bool
      block:
        - name: "[{{ _instance.name }}] Restore from pre-deploy backup {{ backup_ts.stdout | trim }}"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/openspecimen/tasks/rollback.yml"
          vars:
            backup_timestamp: "{{ backup_ts.stdout | trim }}"
        - name: "[{{ _instance.name }}] Mark instance rolled back"
          ansible.builtin.set_fact:
            _rolled_back: true
      rescue:
        - name: "[{{ _instance.name }}] Auto-rollback ITSELF failed - record it"
          ansible.builtin.set_fact:
            _rollback_error: "{{ ansible_failed_result.msg | default('see the rollback output above') }}"

    - name: "[{{ _instance.name }}] Fail - deploy unsuccessful"
      ansible.builtin.fail:
        msg: |
          ✗ Deploy of {{ openspecimen_release }} FAILED on instance '{{ _instance.name }}'.
          {% if _rolled_back | default(false) %}
          ✓ Rolled back to the prior version from backup {{ backup_ts.stdout | trim }}
            (WAR + config + plugins{{ ' + database' if (_db_restored | default(false)) else '' }}). The instance is running the previous version.
          {% if not (_db_restored | default(false)) %}
            NOTE: the database was NOT restored (RDS/Oracle, or DB backup was
            disabled/manual) - restore your DB snapshot or manual backup taken
            before this deploy to complete the rollback.
          {% endif %}
          {% elif _rollback_error is defined %}
          ✗ Auto-rollback ALSO failed: {{ _rollback_error }}
            The instance may be in a partial state - restore manually:
              ansible-playbook -i inventory/customers/{{ inventory_hostname }}/ rollback.yml -e backup_timestamp={{ backup_ts.stdout | default('<ts>') | trim }}
          {% else %}
          No auto-rollback was performed (fresh install, no complete backup, or
          openspecimen_rollback_on_failure=false) - the current state is left as-is.
          {% endif %}
          Original deploy error: {{ _deploy_error | default('see above') }}
