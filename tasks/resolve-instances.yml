---
# Resolve `_instances` — a single OpenSpecimen instance from the flat customer
# vars (ADR-009). One instance per customer folder is the deployment model; a
# multi-instance VM is expressed as multiple customer folders, each overriding
# the colliding values (port, context_path, service_name, catalina_base,
# mysql_db_name) explicitly. There is no list, no name/index derivation, and no
# `-e instance=<name>` selection any more.
#
# `_instances` stays a one-element list so every playbook that acts on it
# (site.yml, cleanup.yml, status.yml, update-*.yml) shares one shape. The single
# entry is byte-for-byte the legacy single-host layout.

- name: Resolve the single instance from flat vars
  ansible.builtin.set_fact:
    _instances:
      # Instance label (used in task headers, loop labels, backup-file prefixes).
      # Default to the service name so a co-located instance (e.g. openspecimen-test)
      # is clearly identified in the deploy/verify output instead of every instance
      # reading as 'openspecimen'.
      - name:          "{{ openspecimen_instance_name | default(openspecimen_service_name | default('openspecimen'), true) }}"
        service_name:  "{{ openspecimen_service_name | default('openspecimen') }}"
        context_path:  "{{ openspecimen_context_path | default('/openspecimen') }}"
        # WAR filename = context with the leading slash stripped ('#' for nested
        # paths): openspecimen.war → /openspecimen, openspecimen-test.war →
        # /openspecimen-test. Drives cleanup's webapp removal.
        war_name:      "{{ (openspecimen_context_path | default('/openspecimen')) | regex_replace('^/', '') | regex_replace('/', '#') }}"
        catalina_home: "{{ catalina_home | default(tomcat_home) }}"
        catalina_base: "{{ catalina_base | default(tomcat_home) }}"
        # Instance root dir. Co-located instances live under /usr/local/openspecimen/
        # <name>/ (so dirname of their catalina_base is the instance root); the legacy
        # single instance has catalina_base == the shared CATALINA_HOME, so this
        # resolves to the shared root and cleanup's safety guard skips removing it.
        # An explicit openspecimen_instance_dir overrides the derivation.
        instance_dir:  "{{ openspecimen_instance_dir | default((catalina_base | default(tomcat_home)) | dirname, true) }}"
        # Apache vhost basename for THIS instance (sites-available/<name>.conf +
        # sites-enabled link on Debian, conf.d/<name>.conf on RedHat). Same default
        # the apache role uses, so cleanup removes exactly this instance's vhost.
        apache_vhost_name: "{{ apache_vhost_name | default(openspecimen_service_name | default('openspecimen'), true) }}"
        http_port:     "{{ openspecimen_port | int }}"
        ajp_port:      "{{ (apache_ajp_port | default(openspecimen_ajp_port | default(8009))) | int }}"
        shutdown_port: "{{ openspecimen_shutdown_port | default(8005) | int }}"
        data_dir:      "{{ openspecimen_data_dir }}"
        plugin_dir:    "{{ openspecimen_plugin_dir }}"
        backup_dir:    "{{ openspecimen_backup_dir }}"
        release_marker:        "{{ openspecimen_release_marker }}"
        deploy_success_marker: "{{ openspecimen_deploy_success_marker }}"
        release:       "{{ openspecimen_release | default('') }}"
        db_name:       "{{ mysql_db_name }}"
        db_user:       "{{ mysql_db_user }}"
        db_password:   "{{ mysql_db_password | default('') }}"
        db_host:       "{{ mysql_db_host }}"
        # Empty → the tomcat role's own auto-sizing / tomcat_heap_*_override wins
        # in setenv.sh (matches the legacy single-instance default exactly).
        heap_max:      ""
        heap_min:      ""
        app_url:       "{{ openspecimen_app_url | default('') }}"
        # node.name is the app's instance identity (written to openspecimen.properties).
        # Default to the distinct service name so two co-located instances never both
        # advertise node.name=openspecimen. An explicit openspecimen_node_name wins.
        node_name:     "{{ openspecimen_node_name | default(openspecimen_service_name | default('openspecimen'), true) }}"
        paid_plugins:      "{{ openspecimen_paid_plugins | default([]) }}"
        customer_plugins:  "{{ openspecimen_customer_plugins | default([]) }}"
