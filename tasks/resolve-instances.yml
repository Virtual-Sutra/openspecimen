---
# Resolve `_instances` from openspecimen_instances (ADR-006, #72).
#
# openspecimen_instances is the deployment model (single source of truth).
# group_vars/all.yml ships a ONE-instance default using the standard single-host
# layout; a customer inventory overrides it with N entries to run multiple
# instances (infrequent). Here we normalise each entry, deriving the per-instance
# fields (service_name, catalina_base, ports, dirs, markers) from name + index
# when not given explicitly, assert ports are unique, and apply -e instance=<name>
# selection. Every playbook that acts on instances (site.yml, cleanup.yml,
# rollback, status, update-*) imports this so they share one resolution.

- name: Require at least one instance
  ansible.builtin.fail:
    msg: >-
      openspecimen_instances is empty/undefined. group_vars/all.yml ships a
      single default; if you override it in inventory, declare at least one
      instance (name + db_name + db_user + db_password + app_url).
  when: (openspecimen_instances | default([]) | length) == 0

- name: Normalise declared instances (derive per-instance fields)
  ansible.builtin.set_fact:
    _instances: "{{ _instances | default([]) + [_derived] }}"
  loop: "{{ openspecimen_instances | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  vars:
    _derived:
      name: "{{ item.name }}"
      context_path: "{{ item.context_path | default('/openspecimen') }}"
      service_name: "{{ item.service_name | default('openspecimen-' ~ item.name) }}"
      # Per-instance standalone Tomcat: HOME == BASE under the instance root, so
      # each instance owns its own Tomcat binary + version. The single default
      # instance (group_vars/all.yml) pins both to tomcat_home (legacy layout).
      catalina_home: "{{ item.catalina_home | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/tomcat') }}"
      catalina_base: "{{ item.catalina_base | default(item.catalina_home | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/tomcat')) }}"
      http_port: "{{ item.http_port | default((openspecimen_port_base | default(8080) | int) + idx * 10) }}"
      ajp_port: "{{ item.ajp_port | default((openspecimen_ajp_port_base | default(8009) | int) + idx * 10) }}"
      shutdown_port: "{{ item.shutdown_port | default((openspecimen_shutdown_port_base | default(8005) | int) + idx * 10) }}"
      # Per-instance Apache vhost ports. Two instances behind one Apache on the same
      # host either use different ServerNames (set app_url) or different HTTPS ports
      # (e.g. set apache_https_port: 8443 on the second instance).
      apache_http_port: "{{ item.apache_http_port | default(80) }}"
      apache_https_port: "{{ item.apache_https_port | default(443) }}"
      data_dir: "{{ item.data_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/data') }}"
      plugin_dir: "{{ item.plugin_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/plugins') }}"
      backup_dir: "{{ item.backup_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/backup') }}"
      release_marker: "{{ item.release_marker | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/.release') }}"
      deploy_success_marker: "{{ item.deploy_success_marker | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/.deploy_success') }}"
      release: "{{ item.release | default(openspecimen_release | default('')) }}"
      db_name: "{{ item.db_name }}"
      db_user: "{{ item.db_user }}"
      db_password: "{{ item.db_password | default('') }}"
      db_host: "{{ item.db_host | default(mysql_db_host) }}"
      heap_max: "{{ item.heap_max | default('') }}"
      heap_min: "{{ item.heap_min | default('') }}"
      app_url: "{{ item.app_url | default('') }}"
      node_name: "{{ item.node_name | default(item.name) }}"
      paid_plugins: "{{ item.paid_plugins | default([]) }}"
      customer_plugins: "{{ item.customer_plugins | default([]) }}"
  when: (openspecimen_instances | default([]) | length) > 0

- name: Assert instance ports are unique across the host
  ansible.builtin.assert:
    that:
      - (_instances | map(attribute='http_port') | list | unique | length) == (_instances | length)
      - (_instances | map(attribute='ajp_port') | list | unique | length) == (_instances | length)
      - (_instances | map(attribute='shutdown_port') | list | unique | length) == (_instances | length)
    fail_msg: >-
      http/ajp/shutdown ports must be unique across openspecimen_instances -
      set explicit *_port values or space the instances out.

# Instances MAY share a default Apache port (80/443) via name-based vhosts (give
# each a distinct app_url -> ServerName). But a NON-default Apache port emits its
# own `Listen`, so two instances on the same non-default port would be a duplicate
# bind that fails `apachectl -t` and wedges the deploy. Forbid that.
- name: Assert non-default Apache ports are unique across the host
  ansible.builtin.assert:
    that:
      - (_instances | map(attribute='apache_http_port') | map('int') | reject('equalto', 80) | list | unique | length)
        == (_instances | map(attribute='apache_http_port') | map('int') | reject('equalto', 80) | list | length)
      - (_instances | map(attribute='apache_https_port') | map('int') | reject('equalto', 443) | list | unique | length)
        == (_instances | map(attribute='apache_https_port') | map('int') | reject('equalto', 443) | list | length)
    fail_msg: >-
      Two instances share the same NON-default Apache port. Instances may share
      80/443 (name-based vhosts via distinct app_url), but a custom
      apache_http_port/apache_https_port must be unique per instance.

- name: Limit to a single instance when -e instance=<name>
  ansible.builtin.set_fact:
    _instances: "{{ _instances | selectattr('name', 'equalto', instance) | list }}"
  when: instance is defined and instance | trim

- name: Fail when -e instance matches no declared instance
  ansible.builtin.fail:
    msg: "instance='{{ instance }}' matches none of: {{ openspecimen_instances | default([{'name': 'openspecimen'}]) | map(attribute='name') | list }}"
  when:
    - instance is defined and instance | trim
    - (_instances | length) == 0
