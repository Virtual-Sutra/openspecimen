---
# Per-instance status (#102). Looped from status.yml.
- name: "[{{ _instance.name }}] Read release marker"
  ansible.builtin.slurp:
    src: "{{ _instance.release_marker }}"
  register: _release
  failed_when: false

- name: "[{{ _instance.name }}] Read heap"
  ansible.builtin.command:
    cmd: "grep -oP '\\-Xm[sx][0-9]+[mMgG]' {{ _instance.catalina_base }}/bin/setenv.sh"
  register: _heap
  changed_when: false
  failed_when: false

# Shared Tomcat: context.xml holds one <Resource> per co-tenant, so scope the read to
# THIS app's OSP-MANAGED marker block; otherwise (single Resource) read the whole file.
- name: "[{{ _instance.name }}] Read pool maxActive"
  ansible.builtin.shell:
    cmd: >-
      {{ ('sed -n "/BEGIN OSP-MANAGED datasource: ' ~ _instance.war_name ~ ' -->/,/END OSP-MANAGED datasource: ' ~ _instance.war_name ~ ' -->/p" '
          if (openspecimen_shared_tomcat | default(false) | bool)
          else 'cat ') }} {{ _instance.catalina_base }}/conf/context.xml | grep -oP 'maxActive="\K[^"]+' | head -1
  register: _pool
  changed_when: false
  failed_when: false

- name: "[{{ _instance.name }}] Read app.url"
  ansible.builtin.command:
    cmd: "grep '^app\\.url=' {{ _instance.catalina_base }}/conf/{{ _instance.war_name }}.properties"
  register: _app_url
  changed_when: false
  failed_when: false

- name: "[{{ _instance.name }}] Service state"
  ansible.builtin.command:
    cmd: "systemctl is-active {{ _instance.service_name }}"
  register: _svc
  changed_when: false
  failed_when: false

- name: "[{{ _instance.name }}] HTTP health"
  ansible.builtin.shell: >
    curl -sf -o /dev/null -w "%{http_code}"
    http://localhost:{{ _instance.http_port }}{{ _instance.context_path }}/rest/ng/config-settings/app-props
  register: _http
  changed_when: false
  failed_when: false

- name: "[{{ _instance.name }}] Report"
  ansible.builtin.debug:
    msg:
      - "Instance  : {{ _instance.name }} ({{ _instance.service_name }})"
      - "Release   : {{ (_release.content | b64decode | trim) if _release.content is defined else '(marker not found)' }}"
      - "Service   : {{ _svc.stdout | default('unknown') }}"
      - "HTTP      : {{ _http.stdout | default('no response') }} (port {{ _instance.http_port }})"
      - "Heap      : {{ _heap.stdout_lines | join('  ') | default('(not found)') }}"
      - "Pool max  : {{ _pool.stdout | default('(not found)') }}"
      - "App URL   : {{ _app_url.stdout | default('(not set)') }}"
