---
# Credential variables for OpenSpecimen deployment.
#
# Copy this file, fill in the values, and keep it out of version control.
# Pass at deploy time with: -e @secrets/<name>.yml
#
# Alternatively, pass individual credentials directly on the command line:
#   -e mysql_db_password=<password>

# ── MySQL / RDS credentials ───────────────────────────────────────────────────
# Required when db_type: mysql (local or RDS).
mysql_db_password: ""

# ── Oracle credentials ────────────────────────────────────────────────────────
# Required when db_type: oracle. Remove if not used.
# oracle_db_password: ""
