---
# ═══════════════════════════════════════════════════════════════════════════════
# Customer secrets template — copy, fill in, then encrypt:
#
#   cp secrets/_template.yml secrets/<customer-name>.yml
#   # fill in values below
#   ansible-vault encrypt secrets/<customer-name>.yml
#
# Use at deploy time:
#   ansible-playbook -i inventory/customers/<customer-name>/ site.yml \
#     -e @secrets/<customer-name>.yml --vault-password-file .vault-pass
# ═══════════════════════════════════════════════════════════════════════════════

# ── MySQL / RDS credentials ───────────────────────────────────────────────────
# Required when db_type: mysql (local or RDS).
mysql_db_password: ""

# ── Oracle credentials ────────────────────────────────────────────────────────
# Required when db_type: oracle. Remove if not used.
# oracle_db_password: ""
