---
# Tear down OpenSpecimen so a (test) VM can be reused (ADR-006). DESTRUCTIVE -
# requires -e cleanup_confirm=true. Default: per-instance teardown (service, webapp,
# data/plugins/backups/markers, local-MySQL DB+user), leaving the shared Tomcat/
# MySQL/Java for a fast re-deploy; -e instance=<name> limits to one.
# -e full_wipe=true ALSO removes the shared bits (whole /usr/local/openspecimen,
# MySQL server+data, OpenJDK, Apache+vhost) for a from-scratch host reset.

- name: Clean up OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml

    - name: Require explicit confirmation (destructive)
      ansible.builtin.fail:
        msg: |
          Refusing to clean up without confirmation. This REMOVES OpenSpecimen
          {{ 'and WIPES the host (Tomcat, MySQL + data, Java)' if (full_wipe | default(false) | bool) else 'instance(s): ' ~ (_instances | map(attribute='name') | list) }}.
          Re-run with -e cleanup_confirm=true.
      when: not (cleanup_confirm | default(false) | bool)

  tasks:
    - name: Tear down each instance
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: cleanup
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"

    - name: Reload systemd after removing units
      ansible.builtin.systemd:
        daemon_reload: true

    # ── Full host wipe (opt-in) ──────────────────────────────────────────────
    - name: Full host wipe (shared Tomcat, MySQL + data, Java)
      when: full_wipe | default(false) | bool
      block:
        - name: Stop and disable MySQL
          ansible.builtin.systemd:
            name: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('mysqld', 'mysql') }}"
            state: stopped
            enabled: false
          failed_when: false

        - name: Stop and disable Apache
          ansible.builtin.systemd:
            name: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('httpd', 'apache2') }}"
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove the OpenSpecimen Apache vhost
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apache2/sites-available/openspecimen.conf
            - /etc/apache2/sites-enabled/openspecimen.conf
            - /etc/httpd/conf.d/openspecimen.conf

        - name: Remove the OpenSpecimen tree (Tomcat binary + all instances)
          ansible.builtin.file:
            path: /usr/local/openspecimen
            state: absent

        - name: Purge MySQL + Java packages (Debian)
          ansible.builtin.apt:
            name:
              - mysql-server
              - mysql-community-server
              - openjdk-17-jdk
              - apache2
            state: absent
            purge: true
            autoremove: true
          failed_when: false
          when: ansible_facts['os_family'] == 'Debian'

        - name: Remove MySQL + Java packages (RHEL)
          ansible.builtin.dnf:
            name:
              - mysql-community-server
              - java-17-openjdk-devel
              - httpd
              - mod_ssl
            state: absent
            autoremove: true
          failed_when: false
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Remove the MySQL data directory
          ansible.builtin.file:
            path: /var/lib/mysql
            state: absent

        - name: Full wipe complete
          ansible.builtin.debug:
            msg: "Host wiped - Tomcat, MySQL (incl. /var/lib/mysql) and Java removed. A fresh site.yml run will reinstall everything."
