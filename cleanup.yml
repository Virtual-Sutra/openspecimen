---
# Tear down OpenSpecimen so a VM can be reused (ADR-006/009). DESTRUCTIVE -
# requires -e cleanup_confirm=true. Runs against ONE customer folder = ONE instance.
# Default: tear down THIS instance only - its service+unit, its complete instance
# directory (/usr/local/openspecimen/<name>/ for a co-located instance), only its
# own Apache vhost, and its local-MySQL DB+user - leaving the shared Tomcat/MySQL/
# Java and any co-located instance untouched.
# -e full_wipe=true is HOST-WIDE: it removes EVERY instance (all openspecimen*
# services/units, the whole /usr/local/openspecimen tree, all openspecimen*.conf
# vhosts) plus the shared Tomcat, Java and MySQL server+data - a from-scratch reset.

- name: Clean up OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml

    - name: Require explicit confirmation (destructive)
      ansible.builtin.fail:
        msg: |
          Refusing to clean up without confirmation. Re-run with -e cleanup_confirm=true.
          {% if full_wipe | default(false) | bool %}
          ⚠  FULL WIPE requested. This is HOST-WIDE, not scoped to one instance:
             it removes ALL OpenSpecimen instances on this host (every service +
             systemd unit, the whole /usr/local/openspecimen tree, and every
             openspecimen*.conf Apache vhost) AND the shared Tomcat, Java, and the
             MySQL server INCLUDING /var/lib/mysql - every database on the box.
             A co-located prod instance WILL be destroyed too.
          {% else %}
          This removes OpenSpecimen instance(s): {{ _instances | map(attribute='name') | list }}
          (service, webapp, instance directory, local DB+user). Shared Tomcat/MySQL/
          Java and other instances are left intact.
          {% endif %}
      when: not (cleanup_confirm | default(false) | bool)

    - name: Warn before host-wide full wipe
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  ⚠  FULL WIPE - HOST-WIDE, ALL INSTANCES"
          - "============================================================"
          - "  Removing EVERY OpenSpecimen instance on {{ inventory_hostname }}:"
          - "    - all openspecimen* systemd services + units"
          - "    - the entire /usr/local/openspecimen tree (all instances)"
          - "    - all openspecimen*.conf Apache vhosts"
          - "  plus shared Tomcat, Java, and MySQL server + /var/lib/mysql"
          - "  (ALL databases). A co-located prod instance is destroyed too."
          - "============================================================"
      when: full_wipe | default(false) | bool

  tasks:
    - name: Tear down each instance
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: cleanup
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"

    - name: Reload systemd after removing units
      ansible.builtin.systemd:
        daemon_reload: true

    # ── Full host wipe (opt-in) ──────────────────────────────────────────────
    - name: Full host wipe (shared Tomcat, MySQL + data, Java)
      when: full_wipe | default(false) | bool
      block:
        - name: Stop and disable MySQL
          ansible.builtin.systemd:
            name: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('mysqld', 'mysql') }}"
            state: stopped
            enabled: false
          failed_when: false

        - name: Stop and disable Apache
          ansible.builtin.systemd:
            name: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('httpd', 'apache2') }}"
            state: stopped
            enabled: false
          failed_when: false

        # Full wipe is host-wide: the per-instance loop above only tore down the
        # resolved instance, so find and remove EVERY OpenSpecimen instance's
        # systemd unit + Apache vhost (a co-located prod instance would otherwise
        # leave an orphaned unit/vhost pointing at the now-deleted tree).
        - name: Find all OpenSpecimen systemd units
          ansible.builtin.find:
            paths: /etc/systemd/system
            patterns: "openspecimen*.service"
          register: _all_units

        - name: Stop and disable every OpenSpecimen service
          ansible.builtin.systemd:
            name: "{{ item.path | basename }}"
            state: stopped
            enabled: false
          loop: "{{ _all_units.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          failed_when: false

        - name: Remove every OpenSpecimen systemd unit
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ _all_units.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

        - name: Reload systemd after removing all units
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Find all OpenSpecimen Apache vhosts
          ansible.builtin.find:
            paths:
              - /etc/apache2/sites-available
              - /etc/apache2/sites-enabled
              - /etc/httpd/conf.d
            patterns: "openspecimen*.conf"
          register: _all_vhosts
          failed_when: false

        - name: Remove every OpenSpecimen Apache vhost
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ _all_vhosts.files }}"
          loop_control:
            label: "{{ item.path }}"

        # path-mode drop-in dirs (openspecimen.d/) sit outside the vhost dirs above.
        - name: Remove the path-mode Apache drop-in directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apache2/openspecimen.d
            - /etc/httpd/openspecimen.d

        # Every instance is its own sibling dir /usr/local/<instance_name> now, so wipe
        # them ALL (default openspecimen + any co-located openspecimen-*), not just the
        # default tree. Matches the openspecimen* unit/vhost globs used elsewhere here.
        - name: Find all OpenSpecimen instance dirs under /usr/local
          ansible.builtin.find:
            paths: /usr/local
            patterns: 'openspecimen*'
            file_type: directory
            recurse: false
          register: _osp_full_wipe_dirs

        - name: Remove the OpenSpecimen trees (Tomcat binaries + all instances)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ _osp_full_wipe_dirs.files | map(attribute='path') | list }}"

        - name: Purge MySQL + Java packages (Debian)
          ansible.builtin.apt:
            name:
              - mysql-server
              - mysql-community-server
              - openjdk-17-jdk
              - apache2
            state: absent
            purge: true
            autoremove: true
          failed_when: false
          when: ansible_facts['os_family'] == 'Debian'

        - name: Remove MySQL + Java packages (RHEL)
          ansible.builtin.dnf:
            name:
              - mysql-community-server
              - java-17-openjdk-devel
              - httpd
              - mod_ssl
            state: absent
            autoremove: true
          failed_when: false
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Remove the MySQL data directory
          ansible.builtin.file:
            path: /var/lib/mysql
            state: absent

        - name: Full wipe complete
          ansible.builtin.debug:
            msg: "Host wiped - Tomcat, MySQL (incl. /var/lib/mysql) and Java removed. A fresh site.yml run will reinstall everything."
