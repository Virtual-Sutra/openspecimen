---
# ═══════════════════════════════════════════════════════════════════════════════
# Customer-specific variable overrides
#
# All variables are commented out — their default values (from
# inventory/group_vars/all.yml) are shown in the comment.
# Uncomment and set only the values that differ for this customer.
#
# Credentials (mysql_db_password, oracle_db_password) belong in the Vault
# file at secrets/<customer-name>.yml, not here.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Database topology ─────────────────────────────────────────────────────────
# Role: mysql
#
# db_type controls the JDBC driver and connection URL used by Tomcat.
# db_managed controls whether Ansible installs MySQL on this VM.
#
# Common combinations:
#   Local MySQL (default):  db_type: mysql  / db_managed: true
#   AWS RDS:                db_type: mysql  / db_managed: false  + mysql_db_host: <rds-endpoint>
#   Oracle:                 db_type: oracle / db_managed: false  + oracle_db_* vars below

# db_type:    mysql       # default: mysql  |  options: mysql, oracle
# db_managed: true        # default: true   |  set false for RDS or Oracle

# ── Release selection ─────────────────────────────────────────────────────────
# Role: openspecimen
#
# openspecimen_release must match the zip filename (without .zip).
# openspecimen_version is a display label used in the completion message.
# Both must be set — there is no default.

# openspecimen_release: ""    # must match the zip filename exactly
# openspecimen_port:    8080

# ── Builds directory ──────────────────────────────────────────────────────────
# Override if this customer's builds are stored in a different path.
# openspecimen_builds_dir: /opt/openspecimen/builds

# ── Application paths ─────────────────────────────────────────────────────────
# Role: openspecimen / tomcat
# Override if the customer requires non-default install locations.

# tomcat_home:             /usr/local/openspecimen/tomcat-as
# openspecimen_data_dir:   /usr/local/openspecimen/data
# openspecimen_plugin_dir: /usr/local/openspecimen/plugins
# openspecimen_backup_dir: /usr/local/openspecimen/backup

# ── Public URL ────────────────────────────────────────────────────────────────
# Role: openspecimen
#
# Required when the app is accessed via a hostname that differs from the
# server's own address — ALB, reverse proxy, or VPN gateway.
# Maps to app.url in openspecimen.properties.
# After deploy, also set: Settings → Common → Allowed Request Origins.
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/3342041156

# openspecimen_app_url: "https://openspecimen.customer-domain.com"

# ── High Availability ─────────────────────────────────────────────────────────
# Role: openspecimen
#
# Required when running more than one OpenSpecimen node behind a load balancer.
# Must be unique per node; must not contain whitespace; do not change after
# the first start.
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/1193082943

# openspecimen_node_name: ""

# ── JVM heap ─────────────────────────────────────────────────────────────────
# Role: tomcat
# Default: auto-sized — max(2048 MB, RAM × 0.5). OpenSpecimen enforces 2 GB min.
# Override by setting the _override variables (integer MB, no unit suffix):

# tomcat_heap_max_override: "4096"   # sets -Xmx4096m  (default: max(2048, RAM×0.5))
# tomcat_heap_min_override: "512"    # sets -Xms512m   (default: 512)

# ── JDBC connection pool ──────────────────────────────────────────────────────
# Role: tomcat
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/4191944759
# Only change if the customer reports connection pool exhaustion or timeouts.

# tomcat_pool_max_active:             100
# tomcat_pool_min_idle:               10
# tomcat_pool_initial_size:           10
# tomcat_pool_max_wait_ms:            10000
# tomcat_pool_validation_interval_ms: 60000
# tomcat_pool_eviction_interval_ms:   60000
# tomcat_pool_min_evictable_idle_ms:  60000
# tomcat_pool_abandoned_timeout_s:    300
# tomcat_pool_abandon_pct:            60

# ── MySQL (db_type: mysql, db_managed: true — local install) ─────────────────
# Role: mysql
# mysql_db_password lives in secrets/<customer-name>.yml (Vault-encrypted).

# mysql_db_name:                openspecimen   # default: openspecimen
# mysql_db_user:                openspecimen   # default: openspecimen
# mysql_bind_address:           "127.0.0.1"    # default: 127.0.0.1
# mysql_max_allowed_packet: "64M"              # default: 64M
# mysql_innodb_buffer_pool_size_override: "2048"  # integer MB; default: auto (RAM × 0.25)

# ── MySQL / RDS (db_type: mysql, db_managed: false — external DB) ─────────────
# Role: mysql (skipped), tomcat (JDBC URL)
# Set mysql_db_host to the RDS endpoint or private DB server IP.
# mysql_db_password lives in secrets/<customer-name>.yml.

# mysql_db_host: "REPLACE_WITH_RDS_ENDPOINT_OR_DB_PRIVATE_IP"
# mysql_db_name: openspecimen
# mysql_db_user: openspecimen

# ── Oracle (db_type: oracle, db_managed: false) ───────────────────────────────
# Role: tomcat (JDBC URL and driver), mysql (skipped)
# oracle_db_password lives in secrets/<customer-name>.yml.
#
# Use service name (preferred) OR SID — not both.
#   Service name → jdbc:oracle:thin:@//host:port/service_name
#   SID (legacy) → jdbc:oracle:thin:@host:port:sid
#
# Required DB grants before first deploy (run as sysdba):
#   GRANT CONNECT, RESOURCE,
#         CREATE ANY TABLE, DROP ANY TABLE,
#         CREATE ANY TRIGGER, DROP ANY TRIGGER,
#         CREATE ANY VIEW, DROP ANY VIEW,
#         CREATE ANY PROCEDURE, DROP ANY PROCEDURE,
#         CREATE ANY SEQUENCE, DROP ANY SEQUENCE
#   TO <oracle_db_user>;

# oracle_db_host:    "REPLACE_WITH_ORACLE_HOST"
# oracle_db_port:    1521
# oracle_db_service: "REPLACE_WITH_SERVICE_NAME"   # preferred — set this OR oracle_db_sid
# oracle_db_sid:     "REPLACE_WITH_SID"            # legacy Oracle 11g only
# oracle_db_user:    openspecimen
