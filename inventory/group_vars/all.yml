---
# ═══════════════════════════════════════════════════════════════════════════════
# OpenSpecimen Deployment - Default Variables
# Pass sensitive values at run time: -e mysql_db_password=<password>
# ═══════════════════════════════════════════════════════════════════════════════

# ── Database type ─────────────────────────────────────────────────────────────
# mysql  → uses MySQL/MariaDB (including RDS for MySQL/Aurora MySQL)
# oracle → uses Oracle DB (requires oracle_db_* vars below)
db_type:    mysql

# true  = Ansible installs and manages MySQL on this VM (default)
# false = skip the mysql role; DB is external - RDS, Aurora, Oracle, etc.
db_managed: true

# Apache front-end management, mirroring db_managed:
# true  = Ansible manages this instance's Apache reverse-proxy config (vhost / path
#         snippet / reload) on every deploy (default).
# false = skip ALL Apache config changes - the front-end is managed outside Ansible
#         (a hand-maintained vhost, or an operator-owned shared vhost for co-tenants).
#         The app (WAR + config) still deploys and the readiness gate probes Tomcat
#         directly; the on-host Apache config is left exactly as-is.
apache_managed: true

# ── Release ───────────────────────────────────────────────────────────────────
# openspecimen_release is the zip filename without the .zip extension.
# It must be set per deployment - no default is provided here.
# Override in inventory/customers/<name>/group_vars/openspecimen.yml
# or pass at run time: -e openspecimen_release=<release-name>
openspecimen_release: ""    # must be set; matches the zip filename without .zip
openspecimen_port:    8080

# ── Artifact path ─────────────────────────────────────────────────────────────
# Pass openspecimen_zip_path at run time pointing to the downloaded release zip:
#   -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip
#
# The default below is a fallback for environments where zips are stored at a
# well-known location; override as needed.
openspecimen_builds_dir: /opt/openspecimen/builds
openspecimen_zip_path:   "{{ openspecimen_builds_dir }}/{{ openspecimen_release }}.zip"

# ── Plugins ───────────────────────────────────────────────────────────────────
# Plugin names (no version, no extension). The role derives the zip filename at
# runtime: <name>-<version>.zip where version = openspecimen_release stripped of
# the "openspecimen_" prefix (e.g. openspecimen_v12.2.RC12 → v12.2.RC12).
# Zips must exist in openspecimen_builds_dir on the control node before the run.
# Default plugins ship in the release zip and are deployed automatically.
#
# openspecimen_paid_plugins     → JARs extracted to plugins/paid/
# openspecimen_customer_plugins → JARs extracted to plugins/zustomer/
openspecimen_paid_plugins:     []
openspecimen_customer_plugins: []

# ── Instance identity & paths ─────────────────────────────────────────────────
# openspecimen_instance_name is the SINGLE identity for this instance. It names:
#   • the install dir            openspecimen_instance_dir (/usr/local/<name>/{tomcat-as,data,plugins,backup,…})
#   • the systemd service        <name>
#   • the HA node (node.name)    <name>
#   • the Apache vhost           <name>
#   • the WAR + Tomcat context   <name>.war → /<name> → config/<name>
#   • the JNDI datasource        jdbc/<name>
# Default 'openspecimen' → every value below resolves to today's layout exactly
# (fully backward-compatible; nothing moves on an existing host). A co-located 2nd
# instance on one VM sets ONLY openspecimen_instance_name (plus its port and public
# routing, and its own DB when separate) — all of the below then follow automatically.
openspecimen_instance_name: openspecimen
openspecimen_instance_dir:  "/usr/local/{{ openspecimen_instance_name }}"

tomcat_home:                "{{ openspecimen_instance_dir }}/tomcat-as"
openspecimen_data_dir:      "{{ openspecimen_instance_dir }}/data"
openspecimen_plugin_dir:    "{{ openspecimen_instance_dir }}/plugins"
openspecimen_backup_dir:    "{{ openspecimen_instance_dir }}/backup"
openspecimen_release_marker: "{{ openspecimen_instance_dir }}/.release"

# ── Single-instance layout (ADR-009) ──────────────────────────────────────────
# One OpenSpecimen instance per customer folder. The flat vars below describe it;
# tasks/resolve-instances.yml assembles them into the single _instances entry the
# app roles consume. Service, context, node and the install dir all derive from
# openspecimen_instance_name (above), so the default is the standard single-host
# layout (service 'openspecimen', context /openspecimen, ports 8080/8009/8005).
#
# A co-located 2nd instance on one VM is a separate customer folder that sets
# openspecimen_instance_name (e.g. openspecimen-test) — service/node/vhost/dir/war/
# datasource then all follow — plus only the values that genuinely can't derive from
# the name: openspecimen_port (e.g. 8090) and, when it needs its own database,
# mysql_db_name / mysql_db_user. See ADR-009 (supersedes ADR-006/007).
catalina_home:              "{{ tomcat_home }}"
catalina_base:              "{{ tomcat_home }}"
openspecimen_service_name:  "{{ openspecimen_instance_name }}"
openspecimen_context_path:  "/{{ openspecimen_instance_name }}"
openspecimen_ajp_port:      "{{ apache_ajp_port | default(8009) | int }}"
openspecimen_shutdown_port: 8005
openspecimen_node_name:     "{{ openspecimen_instance_name }}"

# Written ONLY at the very last task of a successful deploy. Read by
# roles/openspecimen/tasks/direction.yml - the skip-if-current shortcut requires
# this file to match the requested release. If the previous deploy failed before
# reaching the end, the file is stale and the next run will redeploy
# automatically.
openspecimen_deploy_success_marker: "{{ openspecimen_instance_dir }}/.deploy_success"

# Number of timestamped backup directories under openspecimen_backup_dir to keep.
# Older backups are pruned at the end of every deploy. Override per customer in
# inventory/customers/<name>/group_vars/all/20-customer.yml for a longer window.
openspecimen_backup_retention: 3

# Gracefully restore the prior version when an UPGRADE deploy fails (any step after
# the pre-upgrade backup: WAR/plugin extract, startup, readiness, public-URL verify).
# On failure the pre-deploy backup is restored end-to-end (WAR + config + plugins,
# plus the DB dump for managed MySQL; RDS/Oracle restore artifacts and warn to restore
# a snapshot), then the deploy still reports FAILED. Set to false to leave a failed
# deploy in place for debugging (-e openspecimen_rollback_on_failure=false). Fresh
# installs have no prior backup, so nothing is rolled back there.
openspecimen_rollback_on_failure: true

# ── High Availability (optional) ──────────────────────────────────────────────
# openspecimen_node_name defaults to 'openspecimen' above. When running multiple
# OpenSpecimen nodes behind a load balancer, OVERRIDE it per customer folder with
# a unique name (no whitespace) - do not re-declare it here.
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/1193082943

# Public URL for OpenSpecimen - required when the app is accessed via a hostname
# that differs from the server's own address (reverse proxy, ALB, VPN gateway).
# Used for: email links (password resets, survey invites), SAML redirects.
# Maps to app.url in openspecimen.properties.
# Post-deploy: also set Settings → Common → Allowed Request Origins to this URL
# to avoid HTTP 405 errors when the browser Origin header carries this hostname.
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/3342041156
# openspecimen_app_url: "https://openspecimen.yourdomain.com"

# ── Post-deploy health check ──────────────────────────────────────────────────
# The primary readiness check is Phase 1 (Tomcat startup / catalina.out) in the
# openspecimen role - it always runs, is local, and needs no DNS.
#
# The local HTTP readiness gate (curls the app-props REST endpoint until the app
# serves) runs by default. On a SLOW environment where the app is up but takes too
# long to answer HTTP within the retry budget, disable it with
# openspecimen_readiness_http_check: false - the deploy then relies on the Tomcat
# startup wait plus the optional public-URL check below. Its retry budget is
# openspecimen_health_retries x openspecimen_health_delay, each curl capped at
# openspecimen_health_timeout seconds.
openspecimen_readiness_http_check: true
openspecimen_health_timeout: 30
#
# The optional public-URL check below curls openspecimen_app_url from the control
# node to validate the front-end proxy / ALB / DNS path. It is OFF by default;
# enable it (openspecimen_verify_app_url: true) only once the public hostname
# resolves. It also requires openspecimen_app_url to be set, is non-fatal unless
# openspecimen_app_url_check_fatal=true.
openspecimen_verify_app_url: false
openspecimen_health_retries: 5
openspecimen_health_delay:   10

# ── Java ──────────────────────────────────────────────────────────────────────
# java_package is detected automatically from ansible_facts['os_family']:
#   Debian/Ubuntu → openjdk-17-jdk
#   RHEL 9        → java-17-openjdk-devel
# Override here only if you need a non-default JDK package.
# java_package: openjdk-17-jdk

# ── Tomcat ────────────────────────────────────────────────────────────────────
tomcat_user: openspecimen
# tomcat_heap_max and tomcat_heap_min are auto-sized from instance RAM in
# roles/tomcat/defaults/main.yml - see CONFIG-REFERENCE.md for the formula.
# Override per customer with tomcat_heap_max_override / tomcat_heap_min_override (MB).
#
# Co-location memory guardrail: on each deploy, the tomcat role sums the -Xmx of
# every OpenSpecimen instance's setenv.sh on the host + the MySQL InnoDB buffer +
# an OS reserve + a per-JVM off-heap estimate, and compares to RAM. The default
# 50%-of-RAM heap is NOT co-location-aware, so when a 2nd instance shares the host
# you MUST set tomcat_heap_max_override per customer folder. Action on
# over-subscription: fail | warn | off.
openspecimen_memory_guardrail:  fail
openspecimen_mem_os_reserve_mb: 1024   # RAM reserved for the OS + page cache
openspecimen_mem_jvm_offheap_mb: 512   # off-heap (metaspace/threads/direct) per JVM

# ── Tomcat JDBC Connection Pool ───────────────────────────────────────────────
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/4191944759
tomcat_pool_max_active:              100
tomcat_pool_min_idle:                10
tomcat_pool_initial_size:            10
tomcat_pool_max_wait_ms:             10000
tomcat_pool_validation_interval_ms:  60000
tomcat_pool_eviction_interval_ms:    60000
tomcat_pool_min_evictable_idle_ms:   60000
tomcat_pool_abandoned_timeout_s:     300
tomcat_pool_abandon_pct:             60

# ── MySQL ─────────────────────────────────────────────────────────────────────
mysql_db_name:       openspecimen
mysql_db_user:       openspecimen
mysql_db_password:   ~                    # required - pass via -e mysql_db_password=<password>

# 127.0.0.1 (unchanged) unless mysql_host is set (ADR-012, split-host - a
# dedicated MySQL VM), in which case 0.0.0.0 so the OpenSpecimen host can
# actually reach it. Must stay this exact conditional form - a flat literal
# change here would expose every co-located customer's MySQL to the network.
mysql_bind_address: "{{ '0.0.0.0' if mysql_host is defined else '127.0.0.1' }}"

# Host seen by Tomcat's JDBC URL. 127.0.0.1 (unchanged) when co-located; set
# to the RDS endpoint hostname when using RDS; defaults to mysql_host (ADR-012,
# split-host) when that's set - override explicitly only if the JDBC path
# differs from the SSH target (uncommon).
mysql_db_host: "{{ mysql_host | default('127.0.0.1') }}"

# mysql_innodb_buffer_pool_size is auto-sized from instance RAM in
# roles/mysql/defaults/main.yml (25% of RAM on shared VM).
# Override per customer with mysql_innodb_buffer_pool_size_override (MB).

mysql_max_allowed_packet: "64M"

# ── Oracle (db_type: oracle) ──────────────────────────────────────────────────
# Uncomment and populate when db_type: oracle. Set db_managed: false.
# Use either service name (preferred) OR SID - not both.
#
#   Service name → jdbc:oracle:thin:@//host:port/service_name  (modern, preferred)
#   SID          → jdbc:oracle:thin:@host:port:sid              (legacy, Oracle 11g)
#
# Note: The thin JDBC driver (used here) is pure Java - no Oracle client or
#       ORACLE_HOME installation is required on the Tomcat host.
#
# Required DB user grants (run as sysdba or DBA before first deploy):
#   GRANT CONNECT, RESOURCE,
#         CREATE ANY TABLE,     DROP ANY TABLE,
#         CREATE ANY TRIGGER,   DROP ANY TRIGGER,
#         CREATE ANY VIEW,      DROP ANY VIEW,
#         CREATE ANY PROCEDURE, DROP ANY PROCEDURE,
#         CREATE ANY SEQUENCE,  DROP ANY SEQUENCE
#   TO <oracle_db_user>;
#
# Ref: https://openspecimen.atlassian.net/wiki/spaces/CAT/pages/1115693/Database+Configuration
#
# oracle_db_host:     "oracle.yourdomain.com"
# oracle_db_port:     1521
# oracle_db_service:  "ORCL"          # service name - set this OR oracle_db_sid, not both
# oracle_db_sid:      "ORCL"          # SID - legacy Oracle 11g; leave unset if using service name
# oracle_db_user:     openspecimen
# oracle_db_password: "changeme"      # pass via -e oracle_db_password=<password>
