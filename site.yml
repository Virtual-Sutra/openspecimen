---
# Unified deploy playbook - handles both fresh install and upgrade.
#
# The openspecimen role auto-detects fresh vs upgrade (DB schema check) and
# direction.yml detects deploy / rollback / no-op from the on-target .release
# marker. Deploy scope is selected automatically:
#   - Fresh install (no .release marker) -> FULL: base roles (common, java,
#       mysql, tomcat) run, then the app roles.
#   - Upgrade (existing install)         -> FAST app-only: base roles are
#       skipped; app roles (openspecimen, plugins, apache) run.
#   - force_deploy=true                  -> FULL (fully unified): base roles are
#       re-run even on an upgrade.
# The base roles are also tagged `base`, so you can force the choice directly:
#   --skip-tags base   (app-only)      --tags base   (base only).
#
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ site.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password>
#
#   # Full re-deploy (re-run base roles on an existing install):
#   #   ... -e force_deploy=true

- name: Deploy OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    # Detect deploy vs rollback direction by comparing openspecimen_release
    # against the on-target .release marker. On downgrade, the rollback flow
    # is invoked automatically and the play ends - the roles below do not run.
    - name: Detect direction (deploy or rollback)
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: direction

    # Verify the release zip and every paid/customer plugin zip exists on the
    # control node before any role runs. Fails fast if anything is missing.
    # (Only reached on forward / fresh deploys - rollback ended the play.)
    - name: Pre-flight artifact check
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: preflight

    # Choose deploy scope: FULL (base + app) on a fresh install (no .release
    # marker, set by direction.yml above) or when force_deploy is set; otherwise
    # FAST app-only (base roles skipped) on an upgrade.
    - name: Determine deploy scope (full base+app vs app-only)
      ansible.builtin.set_fact:
        _full_deploy: >-
          {{ ((_installed_release | default('') | trim) | length == 0)
             or (force_deploy | default(false) | bool) }}

  roles:
    # ── Base roles - fresh install or force_deploy only (skipped on fast upgrades)
    - role: common
      when: _full_deploy
      tags: [base]
    - role: java
      when: _full_deploy
      tags: [base]
    - role: mysql
      when:
        - _full_deploy
        - db_managed | default(true)
      tags: [base]
    - role: tomcat
      when: _full_deploy
      tags: [base]

    # ── App roles - always run (install and upgrade)
    - openspecimen
    - role: plugins
      when: customer_plugins | default([]) | length > 0
    - role: apache
      when: apache_enabled | default(false)

  post_tasks:
    # The primary readiness check is Phase 1 (Tomcat startup) in the openspecimen
    # role - always runs, local, no DNS needed. This optional public-URL (app_url)
    # check runs ONLY when openspecimen_verify_app_url is enabled (default false;
    # turn on once public DNS exists). It runs after ALL roles (notably apache) so
    # the proxy that serves the URL is in place.
    - name: Verify app reachable via public URL (opt-in)
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: verify-public-url
