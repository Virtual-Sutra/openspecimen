---
# Full fresh deployment — runs all roles in order.
#
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ site.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password>

- name: Deploy OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    # Verify the release zip and every paid/customer plugin zip exists on the
    # control node before any role runs. Fails fast if anything is missing.
    - name: Pre-flight artifact check
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: preflight

  roles:
    - common
    - java
    - role: mysql
      when: db_managed | default(true)
    - tomcat
    - openspecimen
    - role: plugins
      when: customer_plugins | default([]) | length > 0
    - role: apache
      when: apache_enabled | default(false)
