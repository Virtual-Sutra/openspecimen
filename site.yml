---
# Unified deploy playbook - handles both fresh install and upgrade.
#
# The openspecimen role auto-detects fresh vs upgrade (DB schema check) and
# direction.yml detects deploy / rollback / no-op from the on-target .release
# marker. Deploy scope is selected automatically:
#   - Fresh install (no .release marker) -> FULL: base roles (common, java,
#       mysql, tomcat) run, then the app roles.
#   - Upgrade (existing install)         -> FAST app-only: base roles are
#       skipped; app roles (openspecimen, plugins, apache) run.
#   - force_deploy=true                  -> FULL (fully unified): base roles are
#       re-run even on an upgrade.
# The base roles are also tagged `base`, so you can force the choice directly:
#   --skip-tags base   (app-only)      --tags base   (base only).
#
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ site.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password>
#
#   # Full re-deploy (re-run base roles on an existing install):
#   #   ... -e force_deploy=true

- name: Deploy OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    # ── Resolve the instance list (ADR-006, #72) ─────────────────────────────
    # openspecimen_instances is the deployment model (single source of truth).
    # group_vars/all.yml ships a ONE-instance default using the standard
    # single-host layout; a customer inventory overrides it with N entries to run
    # multiple instances (infrequent). Here we normalise each entry, deriving the
    # per-instance fields (service_name, catalina_base, ports, dirs, markers) from
    # name + index when not given explicitly. Roles consume `_instances`.
    - name: Require at least one instance
      ansible.builtin.fail:
        msg: >-
          openspecimen_instances is empty/undefined. group_vars/all.yml ships a
          single default; if you override it in inventory, declare at least one
          instance (name + db_name + db_user + db_password + app_url).
      when: (openspecimen_instances | default([]) | length) == 0

    - name: Normalise declared instances (derive per-instance fields)
      ansible.builtin.set_fact:
        _instances: "{{ _instances | default([]) + [_derived] }}"
      loop: "{{ openspecimen_instances | default([]) }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"
      vars:
        _derived:
          name: "{{ item.name }}"
          context_path: "{{ item.context_path | default('/openspecimen') }}"
          service_name: "{{ item.service_name | default('openspecimen-' ~ item.name) }}"
          catalina_home: "{{ catalina_home | default(tomcat_home) }}"
          catalina_base: "{{ item.catalina_base | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/base') }}"
          http_port: "{{ item.http_port | default((openspecimen_port_base | default(8080) | int) + idx * 10) }}"
          ajp_port: "{{ item.ajp_port | default((openspecimen_ajp_port_base | default(8009) | int) + idx * 10) }}"
          shutdown_port: "{{ item.shutdown_port | default((openspecimen_shutdown_port_base | default(8005) | int) + idx * 10) }}"
          data_dir: "{{ item.data_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/data') }}"
          plugin_dir: "{{ item.plugin_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/plugins') }}"
          backup_dir: "{{ item.backup_dir | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/backup') }}"
          release_marker: "{{ item.release_marker | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/.release') }}"
          deploy_success_marker: "{{ item.deploy_success_marker | default(openspecimen_instances_base ~ '/' ~ item.name ~ '/.deploy_success') }}"
          release: "{{ item.release | default(openspecimen_release | default('')) }}"
          db_name: "{{ item.db_name }}"
          db_user: "{{ item.db_user }}"
          db_password: "{{ item.db_password | default('') }}"
          db_host: "{{ item.db_host | default(mysql_db_host) }}"
          heap_max: "{{ item.heap_max | default('') }}"
          heap_min: "{{ item.heap_min | default('') }}"
          app_url: "{{ item.app_url | default('') }}"
          node_name: "{{ item.node_name | default(item.name) }}"
          paid_plugins: "{{ item.paid_plugins | default([]) }}"
          customer_plugins: "{{ item.customer_plugins | default([]) }}"
      when: (openspecimen_instances | default([]) | length) > 0

    - name: Assert instance ports are unique across the host
      ansible.builtin.assert:
        that:
          - (_instances | map(attribute='http_port') | list | unique | length) == (_instances | length)
          - (_instances | map(attribute='ajp_port') | list | unique | length) == (_instances | length)
          - (_instances | map(attribute='shutdown_port') | list | unique | length) == (_instances | length)
        fail_msg: >-
          http/ajp/shutdown ports must be unique across openspecimen_instances -
          set explicit *_port values or space the instances out.

    - name: Limit to a single instance when -e instance=<name>
      ansible.builtin.set_fact:
        _instances: "{{ _instances | selectattr('name', 'equalto', instance) | list }}"
      when: instance is defined and instance | trim

    - name: Fail when -e instance matches no declared instance
      ansible.builtin.fail:
        msg: "instance='{{ instance }}' matches none of: {{ openspecimen_instances | default([{'name': 'openspecimen'}]) | map(attribute='name') | list }}"
      when:
        - instance is defined and instance | trim
        - (_instances | length) == 0

    # Detect deploy vs rollback direction by comparing openspecimen_release
    # against the on-target .release marker. On downgrade, the rollback flow
    # is invoked automatically and the play ends - the roles below do not run.
    - name: Detect direction (deploy or rollback)
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: direction

    # Verify the release zip and every paid/customer plugin zip exists on the
    # control node before any role runs. Fails fast if anything is missing.
    # (Only reached on forward / fresh deploys - rollback ended the play.)
    - name: Pre-flight artifact check
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: preflight

    # Choose deploy scope: FULL (base + app) on a fresh install (no .release
    # marker, set by direction.yml above) or when force_deploy is set; otherwise
    # FAST app-only (base roles skipped) on an upgrade.
    - name: Determine deploy scope (full base+app vs app-only)
      ansible.builtin.set_fact:
        _full_deploy: >-
          {{ ((_installed_release | default('') | trim) | length == 0)
             or (force_deploy | default(false) | bool) }}

  roles:
    # ── Base roles - fresh install or force_deploy only (skipped on fast upgrades)
    - role: common
      when: _full_deploy
      tags: [base]
    - role: java
      when: _full_deploy
      tags: [base]
    - role: mysql
      when:
        - _full_deploy
        - db_managed | default(true)
      tags: [base]
    - role: tomcat
      when: _full_deploy
      tags: [base]

    # ── App roles - always run (install and upgrade)
    - openspecimen
    - role: plugins
      when: customer_plugins | default([]) | length > 0
    - role: apache
      when: apache_enabled | default(false)

  post_tasks:
    # The primary readiness check is Phase 1 (Tomcat startup) in the openspecimen
    # role - always runs, local, no DNS needed. This optional public-URL (app_url)
    # check runs ONLY when openspecimen_verify_app_url is enabled (default false;
    # turn on once public DNS exists). It runs after ALL roles (notably apache) so
    # the proxy that serves the URL is in place.
    - name: Verify app reachable via public URL (opt-in)
      ansible.builtin.include_role:
        name: openspecimen
        tasks_from: verify-public-url
