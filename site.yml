---
# Unified deploy playbook - handles both fresh install and upgrade.
#
# The openspecimen role auto-detects fresh vs upgrade (DB schema check) and
# direction.yml detects deploy / rollback / no-op from the on-target .release
# marker. Deploy scope is selected automatically:
#   - Fresh install (no .release marker) -> FULL: base roles (common, java,
#       mysql, tomcat) run, then the app roles.
#   - Upgrade (existing install)         -> FAST app-only: base roles are
#       skipped; app roles (openspecimen, plugins, apache) run.
#   - force_deploy=true                  -> FULL (fully unified): base roles are
#       re-run even on an upgrade.
# The base roles are also tagged `base`, so you can force the choice directly:
#   --skip-tags base   (app-only)      --tags base   (base only).
#
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ site.yml \
#     -e openspecimen_release=openspecimen_v12.3 \
#     -e openspecimen_zip_path=/path/to/openspecimen_v12.3.zip \
#     -e mysql_db_password=<password>
#
#   # Full re-deploy (re-run base roles on an existing install):
#   #   ... -e force_deploy=true

- name: Deploy OpenSpecimen
  hosts: openspecimen
  become: true

  pre_tasks:
    # Resolve `_instances` from openspecimen_instances (ADR-006, #72).
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml

    # Resolve the component version spec for this release (ADR-002). Loads
    # component-specs/<release>.yml, merges any per-customer
    # component_versions_override, and exposes the result as `os_versions` to
    # the roles. No spec file -> built-in defaults (backward compatible).
    - name: Resolve component version spec
      tags: [always]
      vars:
        # master-DD-MM-YYYY snapshots roll continuously and share ONE spec, so
        # normalise any master-* key to 'master' (-> component-specs/master.yml).
        _release_key: "{{ openspecimen_release | default('') | regex_replace('^openspecimen_', '') | regex_replace('^master-.*$', 'master') }}"
        _spec_file: "{{ playbook_dir }}/component-specs/{{ _release_key }}.yml"
        _os_versions_default:
          java: {track: "17"}
          tomcat: ""
          mysql: {track: ""}
          apache: {track: ""}
      block:
        - name: Locate component spec file
          ansible.builtin.stat:
            path: "{{ _spec_file }}"
          register: _spec_stat
          delegate_to: localhost
          become: false

        - name: Load component spec for the release
          ansible.builtin.include_vars:
            file: "{{ _spec_file }}"
          when: _spec_stat.stat.exists

        - name: Warn when no component spec exists for this release
          ansible.builtin.debug:
            msg: >-
              No component-specs/{{ _release_key }}.yml found - using built-in
              defaults (Java {{ _os_versions_default.java.track }}). Generate one
              with discover-versions.yml (ops) and add it under component-specs/.
          when: not _spec_stat.stat.exists

        - name: Compute effective component versions (spec + customer override)
          ansible.builtin.set_fact:
            os_versions: >-
              {{ _os_versions_default
                 | combine(component_spec | default({}), recursive=true)
                 | combine(component_versions_override | default({}), recursive=true) }}

    # Host-level deploy scope. Direction (deploy / rollback / no-op) and the
    # artifact pre-flight are now detected PER INSTANCE in tasks/deploy-instance.yml.
    # Here we only decide whether the host-level base roles (common/java/mysql/
    # tomcat) need to run: when ANY instance is fresh (missing/empty .release
    # marker) or when force_deploy is set.
    - name: Probe each instance .release marker (host-level base gate)
      ansible.builtin.slurp:
        src: "{{ item.release_marker }}"
      loop: "{{ _instances }}"
      loop_control:
        loop_var: item
        label: "{{ item.name }}"
      register: _marker_probe
      failed_when: false
      changed_when: false

    - name: Determine deploy scope (full base+app vs app-only)
      ansible.builtin.set_fact:
        _full_deploy: >-
          {{ (force_deploy | default(false) | bool)
             or (_marker_probe.results
                 | selectattr('content', 'undefined') | list | length > 0)
             or (_marker_probe.results
                 | selectattr('content', 'defined')
                 | map(attribute='content') | map('b64decode') | map('trim')
                 | select('equalto', '') | list | length > 0) }}

  roles:
    # ── Base roles - fresh install or force_deploy only (skipped on fast upgrades)
    - role: common
      when: _full_deploy
      tags: [base]
    - role: java
      when: _full_deploy
      tags: [base]
    - role: mysql
      when:
        - _full_deploy
        - db_managed | default(true)
      tags: [base]
    - role: tomcat
      when: _full_deploy
      tags: [base]

  # ── App roles run PER INSTANCE (#72 part 2) ──────────────────────────────────
  # Each entry in _instances gets its own direction detection, WAR/config/plugin
  # deploy, apache vhost, and opt-in public-URL verify. The base roles above stay
  # host-level (run once). See tasks/deploy-instance.yml.
  tasks:
    - name: Deploy each OpenSpecimen instance
      ansible.builtin.include_tasks: tasks/deploy-instance.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
