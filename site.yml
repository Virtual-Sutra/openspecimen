---
# Unified deploy playbook (fresh install + upgrade). direction.yml detects
# deploy/rollback/no-op; scope is automatic - a fresh install runs the base roles
# (common, mysql) then the app roles, an upgrade skips the base roles (also
# `base`-tagged: --skip-tags base / --tags base to force). See docs/DEPLOY-UPGRADE.md.
#
# ── db_managed=false (external RDS/Oracle) - fresh vs existing ─────────────────
# db_managed=false never manages the DB server (mysql role, connectivity/schema
# probe, DB backups/dumps and the Liquibase lock clear are always skipped). Whether
# it RENDERS or REUSES the app config depends on whether the DB config already
# exists on the host - detected by probing context.xml for the jdbc/openspecimen
# datasource (direction.yml), NOT the .release marker (existing non-Ansible installs
# have no marker):
#   EXISTING (datasource present) → app-only UPGRADE: refresh java/tomcat-binary/
#     WAR/plugins/apache and REUSE all on-host config (context.xml, server.xml,
#     setenv.sh, openspecimen.properties). No db_password needed. The config-only
#     fast path is disabled. A reuse safety-net re-checks the datasource survived.
#   FRESH (no datasource) → RENDER all config from the inventory db_config, exactly
#     like a managed install (but still no mysql role - the external DB + user must
#     already exist; the app creates its schema). Preflight FAILS if the db_config
#     (e.g. mysql_db_password) is missing.
#
# REVISIT (tracked): no connectivity verification for external DBs. Edge case: a
# Tomcat *version change* on a default (base==home) instance re-unpacks the stock
# server.xml/context.xml over the shared conf - the reuse safety-net catches the
# lost datasource and fails with guidance; re-onboard such a host.

- name: Deploy OpenSpecimen
  hosts: openspecimen
  become: true
  # Run notified handlers (the 'restart openspecimen' Tomcat restart) even if a task
  # fails later in the play. Config changes (server.xml/AJP, context.xml, setenv.sh,
  # WAR) notify the restart and it is flushed before the readiness gate; without this,
  # a failure between the change and that flush would DROP the pending restart, leaving
  # new config on disk with the old process running (needing a manual restart).
  force_handlers: true

  pre_tasks:
    # Resolve `_instances` (one instance from the flat customer vars, ADR-009).
    - name: Resolve instance
      ansible.builtin.import_tasks: tasks/resolve-instances.yml

    # Resolve the SHARED component spec - drives the host-level Java install.
    # The instance's Tomcat version is resolved AGAIN (its own os_versions) in
    # tasks/deploy-instance.yml. Base release = explicit openspecimen_base_release,
    # else the instance's release.
    - name: Determine base release (shared Java / host spec)
      ansible.builtin.set_fact:
        _base_release: >-
          {{ openspecimen_base_release | default('', true)
             or ((_instances | first).release | default('')) }}
      tags: [always]

    - name: Resolve host-level component spec (base release)
      ansible.builtin.include_tasks: tasks/resolve-spec.yml
      vars:
        _spec_release: "{{ _base_release }}"
      tags: [always]

    # Host-level deploy scope. Direction (deploy / rollback / no-op) and the
    # artifact pre-flight are now detected PER INSTANCE in tasks/deploy-instance.yml.
    # Here we only decide whether the host-level base roles (common/java/mysql/
    # tomcat) need to run: when the instance is fresh (missing/empty .release
    # marker).
    - name: Probe each instance .release marker (host-level base gate)
      ansible.builtin.slurp:
        src: "{{ item.release_marker }}"
      loop: "{{ _instances }}"
      loop_control:
        loop_var: item
        label: "{{ item.name }}"
      register: _marker_probe
      failed_when: false
      changed_when: false

    - name: Determine deploy scope (full base+app vs app-only)
      ansible.builtin.set_fact:
        _full_deploy: >-
          {{ (_marker_probe.results
                 | selectattr('content', 'undefined') | list | length > 0)
             or (_marker_probe.results
                 | selectattr('content', 'defined')
                 | map(attribute='content') | map('b64decode') | map('trim')
                 | select('equalto', '') | list | length > 0) }}

    # ADR-012: the db_managed=false/mysql_host mutual-exclusion guard lives
    # inside resolve-mysql-target.yml itself, not here - db-backup.yml,
    # db-restore.yml, and rollback.yml are standalone playbooks that never
    # run this pre_tasks block, so a guard placed only here would leave those
    # three entry points free to silently split-host a customer whose
    # inventory says the DB is externally unmanaged.
    - name: Resolve the MySQL target host
      ansible.builtin.import_tasks: tasks/resolve-mysql-target.yml
      tags: [always]

  roles:
    # ── Base roles - fresh install only (skipped on fast upgrades)
    - role: common
      when: _full_deploy
      tags: [base]
    - role: mysql
      when:
        - _full_deploy
        - db_managed | default(true)
      tags: [base]
      # ADR-012: delegate to the dedicated MySQL VM when mysql_host is set;
      # default(omit) means no delegation at all when it's unset (undefined,
      # not falsy) - the role then runs on the current host exactly as
      # before this var existed. Connection params for the delegated hop come
      # from resolve-mysql-target.yml's add_host registration above, as real
      # per-host vars - never from a task/role `vars:` override here (see
      # that file's header comment for why: omit inside a magic-connection-var
      # vars: block does not fall through, it corrupts the connection).
      delegate_to: "{{ mysql_host | default(omit) }}"
    # java + tomcat are per-instance (installed in deploy-instance.yml) so instances
    # can run different OpenSpecimen/Tomcat/Java versions side by side; only shared
    # layers (OS packages, MySQL server) stay host-level.

  # App roles run PER INSTANCE (#72 part 2): each _instances entry gets its own
  # direction detection, WAR/config/plugin deploy, apache vhost, and verify.
  tasks:
    # Record the host-level MySQL stage outcome for the per-instance 5-stage report.
    # Reaching here means the mysql role (if it ran) SUCCEEDED - a failing base role
    # aborts the play before this. So this only distinguishes ran / skipped-why.
    - name: Record MySQL (host-level base) stage status for the deploy report
      ansible.builtin.set_fact:
        _mysql_stage: >-
          {{ ('ok (installed/updated this run, on dedicated host ' ~ mysql_host ~ ', ADR-012)'
                if _mysql_split_host else 'ok (installed/updated this run)')
             if (_full_deploy and (db_managed | default(true)))
             else ('skipped (external DB - db_managed=false: RDS/Oracle)'
                   if not (db_managed | default(true))
                   else 'skipped (already installed - app-only upgrade)') }}
      tags: [always]

    - name: Deploy each OpenSpecimen instance
      ansible.builtin.include_tasks: tasks/deploy-instance.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
