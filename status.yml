---
# Day-2: Show live config + health per instance (#102).
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ status.yml
#   # one instance:  ... -e instance=<name>
- name: OpenSpecimen status
  hosts: openspecimen
  become: true
  gather_facts: false
  pre_tasks:
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml
  tasks:
    - name: Status per instance
      ansible.builtin.include_tasks: tasks/day2-status.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
