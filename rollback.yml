---
# Day-2: roll back OpenSpecimen to a previous timestamped backup. Thin wrapper
# around roles/openspecimen/tasks/rollback.yml (also included by site.yml on an
# auto-downgrade). Backup selection: backup_timestamp > target_version (.release
# match) > most recent. Restores WAR + config + plugins + (local MySQL) DB dump
# END TO END, discarding data written after the backup. Usage examples +
# -e options in docs/DEPLOY-UPGRADE.md. Target: <= 5 minutes.

- name: Roll back OpenSpecimen
  hosts: openspecimen
  become: true

  tasks:
    - name: Include rollback tasks from openspecimen role
      ansible.builtin.include_role:
        name:       openspecimen
        tasks_from: rollback
