---
# Day-2: Roll back OpenSpecimen to a previous timestamped backup.
#
# This is a thin wrapper around roles/openspecimen/tasks/rollback.yml so that
# the same tasks are usable as both:
#   1. A standalone playbook (operator CLI - this file), and
#   2. An included task list (site.yml when a downgrade is detected
#      automatically - see roles/openspecimen/tasks/direction.yml).
#
# Backup selection (in order of precedence):
#   1. backup_timestamp   : restore from this specific timestamped directory
#   2. target_version     : restore from the backup whose .release matches this
#   3. (neither)          : restore from the most recent backup (by mtime)
#
# Safety: halts before stopping the service if Liquibase has applied changesets
# after the backup was created (schema-incompatible downgrade). Override with
# -e allow_downgrade=true.
#
# Usage:
#   # Roll back to the most recent backup (default)
#   ansible-playbook -i inventory/customers/<name>/ rollback.yml \
#     -e @secrets/<name>.yml --vault-password-file .vault-pass
#
#   # Roll back to a specific timestamped backup
#   ansible-playbook -i inventory/customers/<name>/ rollback.yml \
#     -e backup_timestamp=15062026_103247 \
#     -e @secrets/<name>.yml --vault-password-file .vault-pass
#
#   # Roll back to whichever backup matches a specific OpenSpecimen version
#   ansible-playbook -i inventory/customers/<name>/ rollback.yml \
#     -e target_version=openspecimen_v12.1.RC8 \
#     -e @secrets/<name>.yml --vault-password-file .vault-pass
#
#   # Override schema-downgrade halt (use only when you're sure)
#   ansible-playbook -i inventory/customers/<name>/ rollback.yml \
#     -e allow_downgrade=true \
#     -e @secrets/<name>.yml --vault-password-file .vault-pass
#
#   # Dry run (no service stop, no file moves)
#   ansible-playbook -i inventory/customers/<name>/ rollback.yml --check
#
# Target: ≤ 5 minutes total.

- name: Roll back OpenSpecimen
  hosts: openspecimen
  become: true

  tasks:
    - name: Include rollback tasks from openspecimen role
      ansible.builtin.include_role:
        name:       openspecimen
        tasks_from: rollback
