---
# Component version spec — DEFAULT / master.
#
# This is the SINGLE fallback spec: any release selected that does not have its
# own component-specs/<release>.yml uses THIS file (resolve-spec.yml), and every
# master-* snapshot (openspecimen_master-DD-MM-YYYY) normalises to it. Kept in
# step with v12.2.RC12. Per-customer overrides still apply via
# component_versions_override in the customer inventory.

component_spec:
  release: "openspecimen_master"

  # Pinned exact — installed by the tomcat role (#91). Same as v12.2.RC12.
  tomcat: "9.0.111"

  # OS packages — supported track + validated build (same as v12.2.RC12).
  java:
    track: "17"
    validated: "17.0.19"
  mysql:
    track: "5.7"
    validated: "5.7"
  apache:
    track: "2.4"
    validated: "2.4.58"

# Connectors ship in the release zip (not pinned here). Uncomment and set if a
# value is available (read from tomcat-as/lib/ or the release zip):
# mysql_connector: "x.y.z"
# oracle_jdbc: "x.y.z"
