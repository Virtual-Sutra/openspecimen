---
# Component version spec — OpenSpecimen master (snapshot) builds.
#
# Master builds are dated (openspecimen_master-DD-MM-YYYY) but roll continuously,
# so they all share THIS single spec: site.yml normalises any master-* release
# key to 'master' and loads this file. Keep the versions here in step with what
# the master tomcat-as bundle expects; per-customer overrides still apply via
# component_versions_override in the customer inventory.

component_spec:
  release: "openspecimen_master"

  # Pinned exact — installed by the tomcat role (#91).
  tomcat: "9.0.59"

  # OS packages — supported track + the build validated on Ubuntu 24.04.
  java:
    track: "17"
    validated: "17.0.19"
  mysql:
    track: "8.0"            # 8.4 on RHEL (Community repo)
    validated: "8.0.46"
  apache:
    track: "2.4"
    validated: "2.4.58"

# Connectors ship in the release zip (not pinned here). Uncomment and set if a
# value is available (read from tomcat-as/lib/ or the release zip):
# mysql_connector: "x.y.z"
# oracle_jdbc: "x.y.z"
