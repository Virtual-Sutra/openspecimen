---
# Component version spec — OpenSpecimen v11.2.RC17.
# Java / MySQL / Apache match v12.2.RC12; Tomcat pinned to 9.0.59. See _template.yml.

component_spec:
  release: "openspecimen_v11.2.RC17"

  # Pinned exact — installed by the tomcat role (#91). 3-part download version
  # (archive.apache.org artifact); Tomcat reports it as server number 9.0.59.0.
  tomcat: "9.0.59"

  # OS packages — supported track + validated build (same as v12.2.RC12).
  java:
    track: "17"
    validated: "17.0.19"
  mysql:
    track: "8.0"            # 8.4 on RHEL (Community repo)
    validated: "8.0.46"
  apache:
    track: "2.4"
    validated: "2.4.58"

# Connectors ship in the release zip (not pinned here). Uncomment and set if a
# value is available (read from tomcat-as/lib/ or the release zip):
# mysql_connector: "x.y.z"
# oracle_jdbc: "x.y.z"
