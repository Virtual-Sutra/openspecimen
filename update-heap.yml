---
# Day-2: Update JVM heap and restart. Per instance (#102).
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ update-heap.yml -e heap_min_mb=512 -e heap_max_mb=4096
#   # (one OpenSpecimen instance per customer folder - ADR-009)
- name: Update JVM heap settings
  hosts: openspecimen
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require heap_min_mb and heap_max_mb
      ansible.builtin.fail:
        msg: "Pass -e heap_min_mb=<int> -e heap_max_mb=<int> (integer MB, e.g. 512 / 4096)"
      when: heap_min_mb is not defined or heap_max_mb is not defined
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml
  tasks:
    - name: Update heap per instance
      ansible.builtin.include_tasks: tasks/day2-heap.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
