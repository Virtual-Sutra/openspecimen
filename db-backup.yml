---
# Standalone on-demand DB backup (local MySQL). Thin wrapper around
# roles/openspecimen/tasks/db-backup.yml. Use before a large-DB upgrade when the
# deploy's size gate halts, then re-run with -e db_backup_confirmed=true.
# Consistent (mysqldump --single-transaction), no outage. Output:
# <db_backup_dir>/<timestamp>_<db>.sql.gz (default `<openspecimen_instance_dir>/db-backups`).

- name: Back up OpenSpecimen database
  hosts: openspecimen
  become: true

  tasks:
    - name: Include db-backup tasks from openspecimen role
      ansible.builtin.include_role:
        name:       openspecimen
        tasks_from: db-backup
