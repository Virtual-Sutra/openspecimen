---
# Day-2: Update app.url in openspecimen.properties and restart. Per instance (#102).
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ update-app-url.yml -e app_url=https://os.example.com
#   # app.url comes from the customer folder config (ADR-009)
# After running, also update in the app UI: Settings -> Common -> Allowed Request Origins.
- name: Update app.url in openspecimen.properties
  hosts: openspecimen
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require app_url
      ansible.builtin.fail:
        msg: "Pass -e app_url=https://... (must start with http:// or https://)"
      when: app_url is not defined or not (app_url | regex_search('^https?://'))
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml
  tasks:
    - name: Update app.url per instance
      ansible.builtin.include_tasks: tasks/day2-app-url.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
