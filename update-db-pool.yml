---
# Day-2: Update JDBC pool and restart. Per instance (#102).
# Usage:
#   ansible-playbook -i inventory/customers/<name>/ update-db-pool.yml -e pool_max_active=150
#   #   optionally -e pool_min_idle=20
- name: Update JDBC connection pool settings
  hosts: openspecimen
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require pool_max_active
      ansible.builtin.fail:
        msg: "Pass -e pool_max_active=<int> (e.g. pool_max_active=150)"
      when: pool_max_active is not defined
    - name: Resolve instances
      ansible.builtin.import_tasks: tasks/resolve-instances.yml
  tasks:
    - name: Update pool per instance
      ansible.builtin.include_tasks: tasks/day2-db-pool.yml
      loop: "{{ _instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"
